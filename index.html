,"verse":"12","variant":"","devanagari":"दानेन पाणिर्न तु कङ्कणेन\nस्नानेन शुद्धिर्न तु चन्दनेन ।\nमानेन तृप्तिर्न तु भोजनेन\nज्ञानेन मुक्तिर्न तु मुण्डनेन ॥ १७-१२","iast":"dānena pāṇirna tu kaṅkaṇena\nsnānena śuddhirna tu candanena .\nmānena tṛptirna tu bhojanena\njñānena muktirna tu muṇḍanena .. 17-12","meaning":"Hands are adorned by charity, the body by bathing, satisfaction by respect, and liberation by spiritual knowledge—not by ornaments alone.","source":"Chanakya Nīti 17-12"},{"slokaNo":"17-13","chapter":"17","verse":"13","variant":"","devanagari":"नापितस्य गृहे क्षौरं पाषाणे गन्ध्यलेपनम् ।\nआत्मरूपं जले पश्यन् शक्रस्यापि श्रियं हरेत् ॥ १७-१३","iast":"nāpitasya gṛhe kṣauraṃ pāṣāṇe gandhyalepanam .\nātmarūpaṃ jale paśyan śakrasyāpi śriyaṃ haret .. 17-13","meaning":"True beauty and purity come from right action and knowledge, not mere external decoration.","source":"Chanakya Nīti 17-13"},{"slokaNo":"17-14","chapter":"17","verse":"14","variant":"","devanagari":"सद्यः प्रज्ञाहरा टुण्डी सद्यः प्रज्ञाकरी वचा ।\nसद्यः शक्तिहरा नारी सद्यः शक्तिधरं पयः ॥ १७-१४","iast":"sadyaḥ prajñāharā ṭuṇḍī sadyaḥ prajñākarī vacā .\nsadyaḥ śaktiharā nārī sadyaḥ śaktidharaṃ payaḥ .. 17-14","meaning":"Tundi fruit harms understanding, vacha restores it; the verse contrasts forces that drain or restore strength.","source":"Chanakya Nīti 17-14"},{"slokaNo":"17-15","chapter":"17","verse":"15","variant":"","devanagari":"परोपकरणं येषां जागर्ति हृदये सताम् ।\nनश्यन्ति विपदस्त्वेषां सम्पदः स्युः पदे पदे ॥ १७-१५","iast":"paropakaraṇaṃ yeṣāṃ jāgarti hṛdaye satām .\nnaśyanti vipadastveṣāṃ sampadaḥ syuḥ pade pade .. 17-15","meaning":"Those whose hearts are awake to helping others see troubles vanish and prosperity come at every step.","source":"Chanakya Nīti 17-15"},{"slokaNo":"17-16","chapter":"17","verse":"16","variant":"","devanagari":"यदि रामा यदि च रमा यदि तनयो विनयगुणोपेतः ।\nतनये तनयोत्पत्तिः सुरवरनगरे किमाधिक्यम् ॥ १७-१६","iast":"yadi rāmā yadi ca ramā yadi tanayo vinayaguṇopetaḥ .\ntanaye tanayotpattiḥ suravaranagare kimādhikyam .. 17-16","meaning":"A loving virtuous wife, wealth, a well-behaved son, and grandchildren make even heaven seem no better.","source":"Chanakya Nīti 17-16"},{"slokaNo":"17-17","chapter":"17","verse":"17","variant":"","devanagari":"आहारनिद्राभयमैथुनानि\nसमानि चैतानि नृणां पशूनाम् ।\nज्ञानं नराणामधिको विशेषो\nज्ञानेन हीनाः पशुभिः समानाः ॥ १७-१७","iast":"āhāranidrābhayamaithunāni\nsamāni caitāni nṛṇāṃ paśūnām .\njñānaṃ narāṇāmadhiko viśeṣo\njñānena hīnāḥ paśubhiḥ samānāḥ .. 17-17","meaning":"Eating, sleeping, fear, and mating are common to humans and animals; knowledge is the special human distinction.","source":"Chanakya Nīti 17-17"},{"slokaNo":"17-18","chapter":"17","verse":"18","variant":"","devanagari":"दानार्थिनो मधुकर। यदि कर्णतालैर्दूरीकृताः\nदूरीकृताः करिवरेण मदान्धबुद्ध्या ।\nतस्यैव गण्डयुग्ममण्डनहानिरिषा\nभृङ्गाः पुनर्विंकचपद्मवने वसन्ति ॥ १७-१८","iast":"dānārthino madhukara. yadi karṇatālairdūrīkṛtāḥ\ndūrīkṛtāḥ karivareṇa madāndhabuddhyā .\ntasyaiva gaṇḍayugmamaṇḍanahāniriṣā\nbhṛṅgāḥ punarviṃkacapadmavane vasanti .. 17-18","meaning":"If an elephant drives away bees, it loses only its own ornament; the bees happily find another lotus grove.","source":"Chanakya Nīti 17-18"},{"slokaNo":"17-19","chapter":"17","verse":"19","variant":"","devanagari":"राजा वेश्या यमश्चाभिस्तस्करो बालयाचकौ ।\nपरदुःखं न जानन्ति अष्टमो ग्रामकण्टकः ॥ १७-१९","iast":"rājā veśyā yamaścābhistaskaro bālayācakau .\nparaduḥkhaṃ na jānanti aṣṭamo grāmakaṇṭakaḥ .. 17-19","meaning":"A king, courtesan, death, fire, thief, child, beggar, and tax-collector do not truly understand others’ pain.","source":"Chanakya Nīti 17-19"},{"slokaNo":"17-20","chapter":"17","verse":"20","variant":"","devanagari":"अधः पश्यसि किं बाले पतितं तव किं भुवि ।\nरे रे मूर्ख न जानासि गतं तारुण्यमौक्तिकम् ॥ १७-२०","iast":"adhaḥ paśyasi kiṃ bāle patitaṃ tava kiṃ bhuvi .\nre re mūrkha na jānāsi gataṃ tāruṇyamauktikam .. 17-20","meaning":"The woman looking down says nothing fell but her youthful pearl; youth slips away with time.","source":"Chanakya Nīti 17-20"},{"slokaNo":"17-21","chapter":"17","verse":"21","variant":"","devanagari":"व्यालाश्रयापि विफलापि सकण्टकापि\nवक्रापि पङ्किलभवापि दुरासदापि ।\nगन्धेन बन्धुरसि केतकि सर्वजन्तो-\nरेको गुणः खलु निहन्ति समस्तदोषान् ॥ १७-२१","iast":"vyālāśrayāpi viphalāpi sakaṇṭakāpi\nvakrāpi paṅkilabhavāpi durāsadāpi .\ngandhena bandhurasi ketaki sarvajanto-\nreko guṇaḥ khalu nihanti samastadoṣān .. 17-21","meaning":"Though the ketakī has many faults—thorns, mud, crookedness, and no edible fruit—its fragrance makes it beloved; one excellence can overcome many defects.","source":"Chanakya Nīti 17-21"}];
    let filtered = verses.map((_, i) => i);
    let pos = 0;

    const el = (id) => document.getElementById(id);
    const searchInput = el('searchInput');
    const counter = el('counter');
    const status = el('status');
    const prevBtn = el('prevBtn');
    const nextBtn = el('nextBtn');

    function normalizeText(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/[–—]/g, '-')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlight(value, query) {
      const raw = escapeHTML(value || '');
      const q = String(query || '').trim();
      if (!q) return raw;
      const words = q.split(/\s+/).filter(Boolean).slice(0, 4).map(escapeRegExp);
      if (!words.length) return raw;
      try {
        const re = new RegExp('(' + words.join('|') + ')', 'gi');
        return raw.replace(re, '<mark>$1</mark>');
      } catch { return raw; }
    }

    function currentVerse() {
      if (!filtered.length) return null;
      return verses[filtered[pos]];
    }

    function render() {
      const q = searchInput.value.trim();
      const verse = currentVerse();
      if (!verse) {
        el('metaText').textContent = 'No matching śloka found';
        el('devanagariText').textContent = 'Try another word or śloka number.';
        el('iastText').textContent = '';
        el('meaningText').textContent = '';
        counter.textContent = '0 / 0';
        status.textContent = 'No search results';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        chips.innerHTML = '';
        return;
      }
      const variant = verse.variant ? ` • Variant: ${verse.variant}` : '';
      el('metaText').innerHTML = highlight(`${verse.slokaNo} • Chapter ${verse.chapter}, Verse ${verse.verse}${variant}`, q);
      el('devanagariText').innerHTML = highlight(verse.devanagari, q);
      el('iastText').innerHTML = highlight(verse.iast, q);
      el('meaningText').innerHTML = highlight(verse.meaning, q);
      counter.textContent = `${pos + 1} / ${filtered.length}`;
      status.textContent = q ? `Found ${filtered.length} matching śloka${filtered.length === 1 ? '' : 's'} for “${q}”` : `Showing all ${verses.length} ślokas`;
      prevBtn.disabled = filtered.length <= 1;
      nextBtn.disabled = filtered.length <= 1;
    }

    function applySearch() {
      const q = normalizeText(searchInput.value);
      if (!q) { filtered = verses.map((_, i) => i); pos = 0; render(); return; }
      const tokens = q.split(' ').filter(Boolean);
      filtered = verses.map((v, i) => ({ v, i })).filter(({v}) => {
        const haystack = normalizeText([v.slokaNo, v.chapter, v.verse, v.variant, v.devanagari, v.iast, v.meaning].join(' '));
        return tokens.every(t => haystack.includes(t));
      }).map(x => x.i);
      pos = 0;
      render();
    }

    prevBtn.addEventListener('click', () => { if (filtered.length) { pos = (pos - 1 + filtered.length) % filtered.length; render(); } });
    nextBtn.addEventListener('click', () => { if (filtered.length) { pos = (pos + 1) % filtered.length; render(); } });
    el('clearBtn').addEventListener('click', () => { searchInput.value = ''; applySearch(); searchInput.focus(); });
    searchInput.addEventListener('input', applySearch);
    document.addEventListener('keydown', (event) => {
      if (event.target === searchInput) return;
      if (event.key === 'ArrowLeft') prevBtn.click();
      if (event.key === 'ArrowRight') nextBtn.click();
      if (event.key === '/') { event.preventDefault(); searchInput.focus(); }
    });
    render();
  </script>
