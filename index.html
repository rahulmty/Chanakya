<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Chanakya Nīti Darpan</title>
  <meta name="description" content="Kid-friendly Chanakya Nīti śloka viewer with Devanagari, IAST pronunciation, English meaning, and search." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Vesper+Libre:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #eaf7ff;
      --sun: #ffc928;
      --sun-dark: #f7a900;
      --blue: #13a8e8;
      --green: #49b34e;
      --pink: #ef1760;
      --orange: #ff9700;
      --ink: #293241;
      --soft-yellow: #fff8bf;
      --soft-blue: #dcf4ff;
      --soft-green: #e8f8e7;
      --soft-pink: #ffe4ee;
      --shadow: 0 18px 40px rgba(35, 72, 110, .14);
      --round: 26px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 202, 40, .22), transparent 22rem),
        radial-gradient(circle at 88% 18%, rgba(19, 168, 232, .15), transparent 20rem),
        linear-gradient(180deg, #eef9ff 0%, #f8fcff 62%, #fffdf6 100%);
      color: var(--ink);
      font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .page { width: min(1040px, calc(100% - 24px)); margin: 0 auto; padding: clamp(12px, 2vw, 20px) 0 28px; }
    header { text-align: center; margin-bottom: 12px; }
    h1 {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      font-size: clamp(1.9rem, 5vw, 3.55rem);
      line-height: .95;
      letter-spacing: .5px;
      color: #ff6868;
      text-shadow: 0 3px 0 rgba(255,255,255,.95);
    }
    .subtitle { margin: 6px auto 0; font-weight: 800; color: #526477; font-size: clamp(.92rem, 1.8vw, 1.05rem); }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin: 14px auto 12px;
    }
    .searchWrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border: 4px solid #d7f0ff;
      border-radius: 999px;
      padding: 7px 12px 7px 16px;
      box-shadow: 0 10px 28px rgba(19, 168, 232, .13);
    }
    .searchIcon { font-size: 1.35rem; }
    #searchInput {
      width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink);
      font: 800 clamp(.94rem, 1.7vw, 1.05rem) 'Nunito', sans-serif;
    }
    #searchInput::placeholder { color: #7c92a8; }
    .smallBtn, .navBtn {
      border: 0;
      cursor: pointer;
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      transition: transform .15s ease, filter .15s ease;
      user-select: none;
    }
    .smallBtn:hover, .navBtn:hover { transform: translateY(-1px); filter: brightness(1.02); }
    .smallBtn:active, .navBtn:active { transform: translateY(1px) scale(.99); }
    .smallBtn {
      background: #e7f6ff;
      color: #126fa2;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: .96rem;
      white-space: nowrap;
    }
    .controls { display: flex; justify-content: center; align-items: center; gap: clamp(8px, 2vw, 18px); margin: 10px 0 12px; flex-wrap: wrap; }
    .navBtn {
      min-width: 124px;
      padding: 10px 18px;
      border-radius: 999px;
      color: #fff;
      font-size: clamp(1.02rem, 2vw, 1.2rem);
      box-shadow: 0 8px 0 rgba(0,0,0,.06), 0 14px 24px rgba(255, 151, 0, .20);
    }
    .navBtn.prev { background: #bfc3c7; }
    .navBtn.next { background: var(--orange); }
    .navBtn:disabled { opacity: .48; cursor: not-allowed; transform: none; filter: grayscale(.15); }
    .counter { font-size: clamp(1rem, 2vw, 1.12rem); font-weight: 900; color: #39495a; min-width: 96px; text-align: center; }
    .status { text-align: center; font-weight: 800; color: #607488; margin: 0 0 10px; font-size: clamp(.9rem, 1.6vw, 1rem); }
    .card {
      background: white;
      border-radius: var(--round);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.8);
    }
    .row { display: grid; grid-template-columns: 210px 1fr; }
    .label {
      display: flex;
      align-items: center;
      padding: clamp(16px, 2.4vw, 24px) clamp(18px, 2.8vw, 26px);
      color: white;
      font-family: 'Baloo 2', cursive;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .content { padding: clamp(16px, 2.4vw, 24px) clamp(18px, 3vw, 28px); font-size: clamp(1rem, 1.8vw, 1.28rem); line-height: 1.58; white-space: pre-line; }
    .row + .row { border-top: 3px solid white; }
    .sloka .label { background: var(--sun); } .sloka .content { background: var(--soft-yellow); color: #f26300; }
    .pron .label { background: var(--blue); } .pron .content { background: var(--soft-blue); color: #0070bc; }
    .meaning .label { background: var(--green); } .meaning .content { background: var(--soft-green); color: #076b2e; }
    .meta .label { background: #7c5cff; } .meta .content { background: #eeeaff; color: #443087; font-weight: 800; }
    .devanagari { font-family: 'Vesper Libre', serif; font-size: clamp(1.42rem, 3vw, 2.18rem); line-height: 1.48; font-weight: 500; }
    .iast { font-size: clamp(1rem, 1.9vw, 1.28rem); font-weight: 700; }
    .meaningText { font-weight: 700; }
    .chips { display: none; }
    footer { text-align: center; margin-top: 16px; color: #6c7c8d; font-weight: 800; font-size: .95rem; }
    mark { background: #fff176; color: inherit; padding: 0 .08em; border-radius: .18em; }
    @media (max-width: 760px) {
      .page { width: min(100% - 16px, 680px); padding-top: 10px; }
      .toolbar { grid-template-columns: 1fr; gap: 9px; margin-top: 10px; }
      .smallBtn { justify-self: center; padding: 7px 13px; }
      .row { grid-template-columns: 1fr; }
      .label { padding: 9px 16px; justify-content: center; letter-spacing: .5px; }
      .content { padding: 14px 15px; line-height: 1.48; }
      .devanagari { font-size: clamp(1.28rem, 5.4vw, 1.85rem); }
      .navBtn { min-width: 116px; padding: 9px 13px; }
      .counter { min-width: 76px; }
    }
    @media (min-width: 761px) and (max-width: 1024px) {
      .row { grid-template-columns: 180px 1fr; }
      .label, .content { padding: 18px 22px; }
    }
    @media print {
      body { background: white; } .toolbar, .controls, .chips, footer { display:none; }
      .page { width: 100%; } .card { box-shadow:none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Chanakya Nīti Darpan</h1>
      <p class="subtitle">Sanskrit ślokas with IAST pronunciation and simple English meaning</p>
    </header>

    <section class="toolbar" aria-label="Search Sanskrit verses">
      <label class="searchWrap" for="searchInput">
        <span class="searchIcon">🔎</span>
        <input id="searchInput" type="search" placeholder="Search any word or śloka no. Example: 01-01, vidyā, ज्ञान, truth" autocomplete="off" />
      </label>
      <button class="smallBtn" id="clearBtn" type="button">Clear Search</button>
    </section>

    <nav class="controls" aria-label="Verse navigation">
      <button class="navBtn prev" id="prevBtn" type="button">⬅ Previous</button>
      <div class="counter" id="counter">1 / 344</div>
      <button class="navBtn next" id="nextBtn" type="button">Next ➡</button>
    </nav>
    <div class="status" id="status">Showing all 344 ślokas</div>

    <article class="card" id="verseCard" aria-live="polite">
      <section class="row meta"><div class="label">Sloka No.</div><div class="content" id="metaText"></div></section>
      <section class="row sloka"><div class="label">Sloka</div><div class="content devanagari" id="devanagariText"></div></section>
      <section class="row pron"><div class="label">Pronunciation</div><div class="content iast" id="iastText"></div></section>
      <section class="row meaning"><div class="label">Meaning</div><div class="content meaningText" id="meaningText"></div></section>
    </article>

    <footer>Use search to find any śloka quickly</footer>
  </main>

  <script>
    const verses = [{"slokaNo":"01-01","chapter":"1","verse":"1","variant":"","devanagari":"प्रणम्य शिरसा विष्णुं त्रैलोक्याधिपतिं प्रभुम् ।\nनानाशास्त्रोद्धृतं वक्ष्ये राजनीतिसमुच्चयम् ॥ ०१-०१","iast":"praṇamya śirasā viṣṇuṃ trailokyādhipatiṃ prabhum .\nnānāśāstroddhṛtaṃ vakṣye rājanītisamuccayam .. 01-01","meaning":"Having bowed to Lord Vishnu, ruler of the three worlds, Chanakya begins a collection of teachings on polity and ethics drawn from many śāstras.","source":"Chanakya Nīti 01-01"},{"slokaNo":"01-02","chapter":"1","verse":"2","variant":"","devanagari":"अधीत्येदं यथाशास्त्रं नरो जानाति सत्तमः ।\nधर्मोपदेशविख्यातं कार्याकार्य शुभाशुभम् ॥ ०१-०२","iast":"adhītyedaṃ yathāśāstraṃ naro jānāti sattamaḥ .\ndharmopadeśavikhyātaṃ kāryākārya śubhāśubham .. 01-02","meaning":"One who studies these maxims properly understands duty, what should and should not be done, and what is auspicious or harmful.","source":"Chanakya Nīti 01-02"},{"slokaNo":"01-03","chapter":"1","verse":"3","variant":"","devanagari":"तदहं सम्प्रवक्ष्यामि लोकानां हितकाम्यया ।\nयेन विज्ञातमात्रेण सर्वज्ञातं प्रपद्यते ॥ ०१-०३","iast":"tadahaṃ sampravakṣyāmi lokānāṃ hitakāmyayā .\nyena vijñātamātreṇa sarvajñātaṃ prapadyate .. 01-03","meaning":"Chanakya says he will speak for the welfare of people, giving wisdom that helps one understand life correctly.","source":"Chanakya Nīti 01-03"},{"slokaNo":"01-04","chapter":"1","verse":"4","variant":"","devanagari":"मूर्खशिष्योपदेशेन दुष्टस्त्रीभरणेन च ।\nदुःखितैः सम्प्रयोगेण पण्डितोऽप्यवसीदति ॥ ०१-०४","iast":"mūrkhaśiṣyopadeśena duṣṭastrībharaṇena ca .\nduḥkhitaiḥ samprayogeṇa paṇḍito'pyavasīdati .. 01-04","meaning":"Even a learned person suffers by advising a foolish student, supporting a wicked spouse, or keeping painful company.","source":"Chanakya Nīti 01-04"},{"slokaNo":"01-05","chapter":"1","verse":"5","variant":"","devanagari":"दुष्टा भार्या शठं मित्रं भृत्यश्चोत्तरदायकः ।\nससर्पे च गृहे वासो मृत्युरेव न संशयः ॥ ०१-०५","iast":"duṣṭā bhāryā śaṭhaṃ mitraṃ bhṛtyaścottaradāyakaḥ .\nsasarpe ca gṛhe vāso mṛtyureva na saṃśayaḥ .. 01-05","meaning":"A wicked wife, deceitful friend, insolent servant, and a house with a snake are all life-threatening dangers.","source":"Chanakya Nīti 01-05"},{"slokaNo":"01-06","chapter":"1","verse":"6","variant":"","devanagari":"आपदर्थे धनं रक्षेदारान् रक्षेद्धनैरपि ।\nआत्मानं सततं रक्षेदारैरपि धनैरपि ॥ ०१-०६","iast":"āpadarthe dhanaṃ rakṣedārān rakṣeddhanairapi .\nātmānaṃ satataṃ rakṣedārairapi dhanairapi .. 01-06","meaning":"Save wealth for adversity, save the family even with wealth, but protect the self above wealth and family.","source":"Chanakya Nīti 01-06"},{"slokaNo":"01-07","chapter":"1","verse":"7","variant":"","devanagari":"आपदर्थे धनं रक्षेच्छ्रीमतां कुत आपदः ।\nकदाचिच्चलते लक्ष्मीः सञ्चितोऽपि विनश्यति ॥ ०१-०७","iast":"āpadarthe dhanaṃ rakṣecchrīmatāṃ kuta āpadaḥ .\nkadāciccalate lakṣmīḥ sañcito'pi vinaśyati .. 01-07","meaning":"Wealth should be saved for calamities, because fortune is unstable and even accumulated wealth can disappear.","source":"Chanakya Nīti 01-07"},{"slokaNo":"01-08","chapter":"1","verse":"8","variant":"","devanagari":"यस्मिन्देशे न सम्मानो न वृत्तिर्न च बान्धवाः ।\nन च विद्यागमोऽप्यस्ति वासं तत्र न कारयेत् ॥ ०१-०८","iast":"yasmindeśe na sammāno na vṛttirna ca bāndhavāḥ .\nna ca vidyāgamo'pyasti vāsaṃ tatra na kārayet .. 01-08","meaning":"Do not settle where there is no respect, livelihood, relatives, or opportunity to gain knowledge.","source":"Chanakya Nīti 01-08"},{"slokaNo":"01-09","chapter":"1","verse":"9","variant":"","devanagari":"धनिकः श्रोत्रियो राजा नदी वैद्यस्तु पञ्चमः ।\nपञ्च यत्र न विद्यन्ते न तत्र दिवसं वसेत् ॥ ०१-०९","iast":"dhanikaḥ śrotriyo rājā nadī vaidyastu pañcamaḥ .\npañca yatra na vidyante na tatra divasaṃ vaset .. 01-09","meaning":"Do not stay where there are not five supports: a wealthy patron, learned priest, ruler, river, and physician.","source":"Chanakya Nīti 01-09"},{"slokaNo":"01-10","chapter":"1","verse":"10","variant":"","devanagari":"लोकयात्रा भयं लज्जा दाक्षिण्यं त्यागशीलता ।\nपञ्च यत्र न विद्यन्ते न कुर्यात्तत्र संस्थितिम् ॥ ०१-१०","iast":"lokayātrā bhayaṃ lajjā dākṣiṇyaṃ tyāgaśīlatā .\npañca yatra na vidyante na kuryāttatra saṃsthitim .. 01-10","meaning":"Avoid living where people lack social order, fear of wrongdoing, modesty, generosity, and practical wisdom.","source":"Chanakya Nīti 01-10"},{"slokaNo":"01-11","chapter":"1","verse":"11","variant":"","devanagari":"जानीयात्प्रेषणे भृत्यान्बान्धवान् व्यसनागमे ।\nमित्रं चापत्तिकालेषु भार्या च विभवक्षये ॥ ०१-११","iast":"jānīyātpreṣaṇe bhṛtyānbāndhavān vyasanāgame .\nmitraṃ cāpattikāleṣu bhāryā ca vibhavakṣaye .. 01-11","meaning":"A servant is tested in work, relatives in trouble, friends in adversity, and a spouse when wealth declines.","source":"Chanakya Nīti 01-11"},{"slokaNo":"01-12","chapter":"1","verse":"12","variant":"","devanagari":"आतुरे व्यसने प्राप्ते दुर्भिक्षे शत्रुसङ्कटे ।\nराजद्वारे श्मशाने च यस्तिष्ठति स बान्धवः ॥ ०१-१२","iast":"āture vyasane prāpte durbhikṣe śatrusaṅkaṭe .\nrājadvāre śmaśāne ca yastiṣṭhati sa bāndhavaḥ .. 01-12","meaning":"A true kinsman stands by one in sickness, danger, famine, enemy trouble, court matters, and even at the cremation ground.","source":"Chanakya Nīti 01-12"},{"slokaNo":"01-13","chapter":"1","verse":"13","variant":"","devanagari":"यो ध्रुवाणि परित्यज्य अध्रुवं परिषेवते ।\nध्रुवाणि तस्य नश्यन्ति चाध्रुवं नष्टमेव हि ॥ ०१-१३","iast":"yo dhruvāṇi parityajya adhruvaṃ pariṣevate .\ndhruvāṇi tasya naśyanti cādhruvaṃ naṣṭameva hi .. 01-13","meaning":"One who abandons the certain for the uncertain loses what is certain, and the uncertain is lost already.","source":"Chanakya Nīti 01-13"},{"slokaNo":"01-14","chapter":"1","verse":"14","variant":"","devanagari":"वरयेत्कुलजां प्राज्ञो विरूपामपि कन्यकाम् ।\nरूपशीलां न नीचस्य विवाहः सदृशे कुले ॥ ०१-१४","iast":"varayetkulajāṃ prājño virūpāmapi kanyakām .\nrūpaśīlāṃ na nīcasya vivāhaḥ sadṛśe kule .. 01-14","meaning":"A wise person should marry within a good and compatible family; character and lineage matter more than outward beauty alone.","source":"Chanakya Nīti 01-14"},{"slokaNo":"01-15","chapter":"1","verse":"15","variant":"","devanagari":"नदीनां शस्त्रपाणीनांनखीनां शृङ्गिणां तथा ।\nविश्वासो नैव कर्तव्यः स्त्रीषु राजकुलेषु च ॥ ०१-१५","iast":"nadīnāṃ śastrapāṇīnāṃnakhīnāṃ śṛṅgiṇāṃ tathā .\nviśvāso naiva kartavyaḥ strīṣu rājakuleṣu ca .. 01-15","meaning":"Do not blindly trust rivers, armed people, clawed or horned animals, women, or royal households.","source":"Chanakya Nīti 01-15"},{"slokaNo":"01-16","chapter":"1","verse":"16","variant":"","devanagari":"विषादप्यमृतं ग्राह्यमेध्यादपि काञ्चनम् ।\nअमित्रादपि सद्वृत्तं बालादपि सुभाषितम् ॥ ०१-१६","iast":"viṣādapyamṛtaṃ grāhyamedhyādapi kāñcanam .\namitrādapi sadvṛttaṃ bālādapi subhāṣitam .. 01-16","meaning":"Take nectar even from poison, gold even from impurity, good conduct even from an enemy, and wise speech even from a child.","source":"Chanakya Nīti 01-16"},{"slokaNo":"01-17","chapter":"1","verse":"17","variant":"","devanagari":"स्त्रीणां द्विगुण आहारो लज्जा चापि चतुर्गुणा ।\nसाहसं षड्गुणं चैव कामश्चाष्टगुणः स्मृतः ॥ ०१-१७","iast":"strīṇāṃ dviguṇa āhāro lajjā cāpi caturguṇā .\nsāhasaṃ ṣaḍguṇaṃ caiva kāmaścāṣṭaguṇaḥ smṛtaḥ .. 01-17","meaning":"The verse states that appetite, modesty, courage, and desire are described as stronger in women than in men.","source":"Chanakya Nīti 01-17"},{"slokaNo":"02-01","chapter":"2","verse":"1","variant":"","devanagari":"अनृतं साहसं माया मूर्खत्वमतिलोभिता ।\nअशौचत्वं निर्दयत्वं स्त्रीणां दोषाः स्वभावजाः ॥ ०२-०१","iast":"anṛtaṃ sāhasaṃ māyā mūrkhatvamatilobhitā .\naśaucatvaṃ nirdayatvaṃ strīṇāṃ doṣāḥ svabhāvajāḥ .. 02-01","meaning":"The verse lists traits such as falsehood, rashness, deceit, folly, greed, impurity, and cruelty as natural faults to guard against.","source":"Chanakya Nīti 02-01"},{"slokaNo":"02-02","chapter":"2","verse":"2","variant":"","devanagari":"भोज्यं भोजनशक्तिश्च रतिशक्तिर्वराङ्गना ।\nविभवो दानशक्तिश्च नाल्पस्य तपसः फलम् ॥ ०२-०२","iast":"bhojyaṃ bhojanaśaktiśca ratiśaktirvarāṅganā .\nvibhavo dānaśaktiśca nālpasya tapasaḥ phalam .. 02-02","meaning":"Good appetite, marital vitality, prosperity, and a generous mind are said to be fruits of great merit.","source":"Chanakya Nīti 02-02"},{"slokaNo":"02-03","chapter":"2","verse":"3","variant":"","devanagari":"यस्य पुत्रो वशीभूतो भार्या छन्दानुगामिनी ।\nविभवे यश्च सन्तुष्टस्तस्य स्वर्ग इहैव हि ॥ ०२-०३","iast":"yasya putro vaśībhūto bhāryā chandānugāminī .\nvibhave yaśca santuṣṭastasya svarga ihaiva hi .. 02-03","meaning":"One whose child is obedient, spouse cooperative, and wealth sufficient has heaven here on earth.","source":"Chanakya Nīti 02-03"},{"slokaNo":"02-04","chapter":"2","verse":"4","variant":"","devanagari":"ते पुत्रा ये पितृभक्ताः स पिता यस्तु पोषकः ।\nतन्मित्रं यत्र विश्वासः सा भार्या यत्र निर्वृतिः ॥ ०२-०४","iast":"te putrā ye pitṛbhaktāḥ sa pitā yastu poṣakaḥ .\ntanmitraṃ yatra viśvāsaḥ sā bhāryā yatra nirvṛtiḥ .. 02-04","meaning":"A true son is devoted to his father, a true father supports his child, a true friend inspires trust, and a true wife brings peace.","source":"Chanakya Nīti 02-04"},{"slokaNo":"02-05","chapter":"2","verse":"5","variant":"","devanagari":"परोक्षे कार्यहन्तारं प्रत्यक्षे प्रियवादिनम् ।\nवर्जयेत्तादृशं मित्रं विषकुम्भं पयोमुखम् ॥ ०२-०५","iast":"parokṣe kāryahantāraṃ pratyakṣe priyavādinam .\nvarjayettādṛśaṃ mitraṃ viṣakumbhaṃ payomukham .. 02-05","meaning":"Avoid a person who speaks sweetly in front but harms you behind your back; such a person is like poison covered with milk.","source":"Chanakya Nīti 02-05"},{"slokaNo":"02-06","chapter":"2","verse":"6","variant":"","devanagari":"न विश्वसेत्कुमित्रे च मित्रे चापि न विश्वसेत् ।\nकदाचित्कुपितं मित्रं सर्व गुह्यं प्रकाशयेत् ॥ ०२-०६","iast":"na viśvasetkumitre ca mitre cāpi na viśvaset .\nkadācitkupitaṃ mitraṃ sarva guhyaṃ prakāśayet .. 02-06","meaning":"Do not trust a bad friend, and do not trust any friend without discretion; in anger, even a friend may reveal secrets.","source":"Chanakya Nīti 02-06"},{"slokaNo":"02-07","chapter":"2","verse":"7","variant":"","devanagari":"मनसा चिन्तितं कार्यं वाचा नैव प्रकाशयेत् ।\nमन्त्रेण रक्षयेद्गूढं कार्ये चापि नियोजयेत् ॥ ०२-०७","iast":"manasā cintitaṃ kāryaṃ vācā naiva prakāśayet .\nmantreṇa rakṣayedgūḍhaṃ kārye cāpi niyojayet .. 02-07","meaning":"Do not announce a plan prematurely; keep counsel secret and act when the work is ready.","source":"Chanakya Nīti 02-07"},{"slokaNo":"02-08","chapter":"2","verse":"8","variant":"","devanagari":"कष्टं च खलु मूर्खत्वं कष्टं च खलु यौवनम् ।\nकष्टात्कष्टतरं चैव परगेहनिवासनाम् ॥ ०२-०८","iast":"kaṣṭaṃ ca khalu mūrkhatvaṃ kaṣṭaṃ ca khalu yauvanam .\nkaṣṭātkaṣṭataraṃ caiva paragehanivāsanām .. 02-08","meaning":"Foolishness is painful, youth can be difficult, and dependence on another person’s house is even more painful.","source":"Chanakya Nīti 02-08"},{"slokaNo":"02-09","chapter":"2","verse":"9","variant":"","devanagari":"शैले शैले च माणिक्यं मौक्तिकं न गजे गजे ।\nसाधवो न हि सर्वत्र चन्दनं न वने वने ॥ ०२-०९","iast":"śaile śaile ca māṇikyaṃ mauktikaṃ na gaje gaje .\nsādhavo na hi sarvatra candanaṃ na vane vane .. 02-09","meaning":"Gems are not found on every mountain, pearls not in every elephant, saints not everywhere, and sandalwood not in every forest.","source":"Chanakya Nīti 02-09"},{"slokaNo":"02-10","chapter":"2","verse":"10","variant":"","devanagari":"पुत्राश्च विविद्यैः शीलैर्नियोज्याः सततं बुधैः ।\nनीतिज्ञाः शीलसम्पन्ना भवन्ति कुलपूजिताः ॥ ०२-१०","iast":"putrāśca vividyaiḥ śīlairniyojyāḥ satataṃ budhaiḥ .\nnītijñāḥ śīlasampannā bhavanti kulapūjitāḥ .. 02-10","meaning":"Wise people should educate children in learning and good conduct, for disciplined and ethical children honor the family.","source":"Chanakya Nīti 02-10"},{"slokaNo":"02-11","chapter":"2","verse":"11","variant":"","devanagari":"माता शत्रुः पिता वैरी याभ्यां बाला न पाठिताः ।\nसभाधये न शोभन्ते हंसमध्ये बको यथा ।। ०२-११","iast":"mātā śatruḥ pitā vairī yābhyāṃ bālā na pāṭhitāḥ .\nsabhādhaye na śobhante haṃsamadhye bako yathā .. 02-11","meaning":"Parents who do not educate their children become like enemies; an uneducated child looks out of place among the learned.","source":"Chanakya Nīti 02-11"},{"slokaNo":"02-12","chapter":"2","verse":"12","variant":"","devanagari":"लालनाद्धहवो दोषास्ताडने बहवो गुणाः ।\nतस्मात्पुत्रं च शिष्यं च ताडयेन्न तु लालयेत् ।। ०२-१२","iast":"lālanāddhahavo doṣāstāḍane bahavo guṇāḥ .\ntasmātputraṃ ca śiṣyaṃ ca tāḍayenna tu lālayet .. 02-12","meaning":"Overindulgence creates faults, while discipline develops virtues; therefore students and children need firm guidance, not pampering.","source":"Chanakya Nīti 02-12"},{"slokaNo":"02-13","chapter":"2","verse":"13","variant":"","devanagari":"श्लोकेन वा तदर्धेन तदर्धाधार्क्षरेण वा ।\nअबन्ध्यं दिवसं कुर्यादानाध्ययनकर्मभिः ।। ०२-१३","iast":"ślokena vā tadardhena tadardhādhārkṣareṇa vā .\nabandhyaṃ divasaṃ kuryādānādhyayanakarmabhiḥ .. 02-13","meaning":"Do not let a day pass without learning, charity, study, or some worthy action, even if only a small amount is done.","source":"Chanakya Nīti 02-13"},{"slokaNo":"02-14","chapter":"2","verse":"14","variant":"","devanagari":"कान्ता वियोगः स्वजनापमानं\nऋणस्य शेषं कुनृपस्य सेवा ।\nदारिद्र्यभावादिमुखं च मित्रं\nविनाग्निना पञ्च दहन्ति कायम् ।। ०२-१४","iast":"kāntā viyogaḥ svajanāpamānaṃ\nṛṇasya śeṣaṃ kunṛpasya sevā .\ndāridryabhāvādimukhaṃ ca mitraṃ\nvināgninā pañca dahanti kāyam .. 02-14","meaning":"Separation from a beloved, insult by relatives, unpaid debt, service to a bad ruler, poverty, and false friends burn a person without fire.","source":"Chanakya Nīti 02-14"},{"slokaNo":"02-15","chapter":"2","verse":"15","variant":"","devanagari":"नदीतीरे च ये वृक्षाः परगेहेषु कामिनी ।\nमन्त्रहीनाश्च राजानः शीघ्रं नश्यन्त्यसंशयम् ।। ०२-१५","iast":"nadītīre ca ye vṛkṣāḥ parageheṣu kāminī .\nmantrahīnāśca rājānaḥ śīghraṃ naśyantyasaṃśayam .. 02-15","meaning":"Trees on riverbanks, women in others’ houses, and kings without counsel are quickly destroyed.","source":"Chanakya Nīti 02-15"},{"slokaNo":"02-16","chapter":"2","verse":"16","variant":"","devanagari":"बलं विद्या च विप्राणां राज्ञां सैन्यं बलं तथा ।\nबलं वित्तं च वैश्यानां शूद्राणां पारिचर्यकम् ।। ०२-१६","iast":"balaṃ vidyā ca viprāṇāṃ rājñāṃ sainyaṃ balaṃ tathā .\nbalaṃ vittaṃ ca vaiśyānāṃ śūdrāṇāṃ pāricaryakam .. 02-16","meaning":"Learning is the strength of brāhmaṇas, armies of kings, wealth of merchants, and service of workers.","source":"Chanakya Nīti 02-16"},{"slokaNo":"02-17","chapter":"2","verse":"17","variant":"","devanagari":"निर्धनं पुरुषं वेश्या प्रजा भग्नं नृपं त्यजेत् ।\nखगा वीतफलं वृक्षं भुक्त्वा चाभ्यागतो गृहम् ।। ०२-१७","iast":"nirdhanaṃ puruṣaṃ veśyā prajā bhagnaṃ nṛpaṃ tyajet .\nkhagā vītaphalaṃ vṛkṣaṃ bhuktvā cābhyāgato gṛham .. 02-17","meaning":"Those dependent on benefit leave when benefit ends: courtesans leave the poor, subjects leave weak rulers, birds leave fruitless trees, and guests leave after eating.","source":"Chanakya Nīti 02-17"},{"slokaNo":"02-18","chapter":"2","verse":"18","variant":"","devanagari":"गृहीत्वा दक्षिणां विप्रास्त्यजन्ति यजमानकम् ।\nप्राप्तविद्या गुरु शिष्या दग्धरण्यं मृगास्तथा ।। ०२-१८","iast":"gṛhītvā dakṣiṇāṃ viprāstyajanti yajamānakam .\nprāptavidyā guru śiṣyā dagdharaṇyaṃ mṛgāstathā .. 02-18","meaning":"Priests leave after receiving gifts, students after receiving learning, and animals after a forest burns.","source":"Chanakya Nīti 02-18"},{"slokaNo":"02-19","chapter":"2","verse":"19","variant":"","devanagari":"दुराचारी दुरादृष्टिरावासी च दुर्जनः ।\nयन्मैत्री क्रियते पुंभिर्नरः शीघ्रं विनश्यति ।। ०२-१९","iast":"durācārī durādṛṣṭirāvāsī ca durjanaḥ .\nyanmaitrī kriyate puṃbhirnaraḥ śīghraṃ vinaśyati .. 02-19","meaning":"Friendship with a corrupt, impure-minded, or crooked person quickly brings ruin.","source":"Chanakya Nīti 02-19"},{"slokaNo":"02-20","chapter":"2","verse":"20","variant":"","devanagari":"समाने शोभते प्रीतिः राज्ञि सेवा च शोभते ।\nवाणिज्यं व्यवहारेषु दिव्या स्त्री शोभते गृहे ।। ०२-२०","iast":"samāne śobhate prītiḥ rājñi sevā ca śobhate .\nvāṇijyaṃ vyavahāreṣu divyā strī śobhate gṛhe .. 02-20","meaning":"Affection suits equals, service suits a king, trade suits public dealings, and a good wife shines in the home.","source":"Chanakya Nīti 02-20"},{"slokaNo":"03-01","chapter":"3","verse":"1","variant":"","devanagari":"कस्य दोषः कुले नास्ति व्याधिना को न पीडितः ।\nव्यसनं केन न प्राप्तं कस्य सौख्यं निरन्तरम् ।। ०३-०१","iast":"kasya doṣaḥ kule nāsti vyādhinā ko na pīḍitaḥ .\nvyasanaṃ kena na prāptaṃ kasya saukhyaṃ nirantaram .. 03-01","meaning":"Every family has faults, everyone faces disease or trouble, and no one enjoys happiness without interruption.","source":"Chanakya Nīti 03-01"},{"slokaNo":"03-02","chapter":"3","verse":"2","variant":"","devanagari":"आचारः कुलमारव्याति देशमारव्याति भाषणम् ।\nसम्श्रमः स्नेहमारव्याति वपुरारव्याति भोजनम् ।। ०३-०२","iast":"ācāraḥ kulamāravyāti deśamāravyāti bhāṣaṇam .\nsamśramaḥ snehamāravyāti vapurāravyāti bhojanam .. 03-02","meaning":"Conduct reveals family background, speech reveals region, warmth reveals friendship, and the body reveals eating habits.","source":"Chanakya Nīti 03-02"},{"slokaNo":"03-03","chapter":"3","verse":"3","variant":"","devanagari":"सुकुले योजयेत्कन्यां पुत्रं विद्यासु योजयेत् ।\nव्यसने योजयेच्छत्रुं मित्रं धर्मेण योजयेत् ।। ०३-०३","iast":"sukule yojayetkanyāṃ putraṃ vidyāsu yojayet .\nvyasane yojayecchatruṃ mitraṃ dharmeṇa yojayet .. 03-03","meaning":"Marry a daughter into a good family, educate a son, put an enemy into difficulty, and engage friends in dharma.","source":"Chanakya Nīti 03-03"},{"slokaNo":"03-04","chapter":"3","verse":"4","variant":"","devanagari":"दुर्जनस्य च सर्पस्य वरं सर्पो न दुर्जनः ।\nसर्पो दंशति काले तु दुर्जनस्तु पदे पदे ।। ०३-०४","iast":"durjanasya ca sarpasya varaṃ sarpo na durjanaḥ .\nsarpo daṃśati kāle tu durjanastu pade pade .. 03-04","meaning":"Between a wicked person and a snake, the snake is preferable; it bites at one time, but the wicked hurt at every step.","source":"Chanakya Nīti 03-04"},{"slokaNo":"03-05","chapter":"3","verse":"5","variant":"","devanagari":"एतदर्थे कुलीनानां नृपाः कुर्वन्ति सङ्ग्रहम् ।\nआदिमध्यावसानेषु न ते गच्छन्ति विक्रियाम् ।। ०३-०५","iast":"etadarthe kulīnānāṃ nṛpāḥ kurvanti saṅgraham .\nādimadhyāvasāneṣu na te gacchanti vikriyām .. 03-05","meaning":"Kings gather noble people because such people remain steady in the beginning, middle, and end.","source":"Chanakya Nīti 03-05"},{"slokaNo":"03-06","chapter":"3","verse":"6","variant":"","devanagari":"प्रलये भिन्नमर्यादा भवन्ति किल सागराः ।\nसागरा भेदमिच्छन्ति प्रलयेऽपि न साधवः ।। ०३-०६","iast":"pralaye bhinnamaryādā bhavanti kila sāgarāḥ .\nsāgarā bhedamicchanti pralaye'pi na sādhavaḥ .. 03-06","meaning":"At cosmic dissolution even oceans may break their limits, but good people do not abandon their principles.","source":"Chanakya Nīti 03-06"},{"slokaNo":"03-07","chapter":"3","verse":"7","variant":"","devanagari":"मूर्खस्तु प्रहर्तव्यः प्रत्यक्षो द्विपदः पशुः ।\nभिद्यते वाक्य-शल्येन अदृशं कण्टकं यथा ।। ०३-०७","iast":"mūrkhastu prahartavyaḥ pratyakṣo dvipadaḥ paśuḥ .\nbhidyate vākya-śalyena adṛśaṃ kaṇṭakaṃ yathā .. 03-07","meaning":"Avoid the company of fools; they are two-legged beasts whose words pierce like hidden thorns.","source":"Chanakya Nīti 03-07"},{"slokaNo":"03-08","chapter":"3","verse":"8","variant":"","devanagari":"रूपयौवनसम्पन्ना विशालकुलसम्भवाः ।\nविद्याहीना न शोभन्ते निर्गन्धाः किंशुका यथा ।। ०३-०८","iast":"rūpayauvanasampannā viśālakulasambhavāḥ .\nvidyāhīnā na śobhante nirgandhāḥ kiṃśukā yathā .. 03-08","meaning":"Beauty, youth, and high birth are useless without learning, like a beautiful flower without fragrance.","source":"Chanakya Nīti 03-08"},{"slokaNo":"03-09","chapter":"3","verse":"9","variant":"","devanagari":"कोकिलानां स्वरो रूपं स्त्रीणां रूपं पतिव्रतम् ।\nविद्या रूपं कुरूपाणां क्षमा रूपं तपस्विनाम् ।। ०३-०९","iast":"kokilānāṃ svaro rūpaṃ strīṇāṃ rūpaṃ pativratam .\nvidyā rūpaṃ kurūpāṇāṃ kṣamā rūpaṃ tapasvinām .. 03-09","meaning":"The cuckoo’s beauty is its voice, a wife’s in fidelity, an unattractive person’s in learning, and an ascetic’s in forgiveness.","source":"Chanakya Nīti 03-09"},{"slokaNo":"03-10","chapter":"3","verse":"10","variant":"","devanagari":"त्यजेदेकं कुलस्यार्थे ग्रामस्यार्थे कुलं त्यजेत् ।\nग्रामं जनपदस्यार्थे आत्मार्थे पृथिवीं त्यजेत् ।। ०३-१०","iast":"tyajedekaṃ kulasyārthe grāmasyārthe kulaṃ tyajet .\ngrāmaṃ janapadasyārthe ātmārthe pṛthivīṃ tyajet .. 03-10","meaning":"Sacrifice one person for a family, a family for a village, a village for a country, and even the world for the self’s highest good.","source":"Chanakya Nīti 03-10"},{"slokaNo":"03-11","chapter":"3","verse":"11","variant":"","devanagari":"उद्योगे नास्ति दारिद्र्यं जपतो नास्ति पातकम् ।\nमौनेन कलहो नास्ति नास्ति जागृते भयम् ।। ०३-११","iast":"udyoge nāsti dāridryaṃ japato nāsti pātakam .\nmaunena kalaho nāsti nāsti jāgṛte bhayam .. 03-11","meaning":"Industry removes poverty, chanting removes sin, silence prevents quarrels, and alertness removes fear.","source":"Chanakya Nīti 03-11"},{"slokaNo":"03-12","chapter":"3","verse":"12","variant":"","devanagari":"अतिरूपेण वा सीता अतिगर्वेण रावणः ।\nअतिदानाद्बलिर्बद्धो ह्यतिसर्वत्र वर्जयेत् ।। ०३-१२","iast":"atirūpeṇa vā sītā atigarveṇa rāvaṇaḥ .\natidānādbalirbaddho hyatisarvatra varjayet .. 03-12","meaning":"Excess is harmful: Sītā by excessive beauty, Rāvaṇa by pride, Bali by over-giving; avoid excess in everything.","source":"Chanakya Nīti 03-12"},{"slokaNo":"03-13","chapter":"3","verse":"13","variant":"","devanagari":"को हि भारः समर्थानां किं दूरं व्यवसायिनाम् ।\nको विदेशः सुविद्यानां कः परः प्रियवादिनाम् ।। ०३-१३","iast":"ko hi bhāraḥ samarthānāṃ kiṃ dūraṃ vyavasāyinām .\nko videśaḥ suvidyānāṃ kaḥ paraḥ priyavādinām .. 03-13","meaning":"Nothing is too heavy for the capable, too far for the industrious, foreign to the learned, or hostile to pleasant speakers.","source":"Chanakya Nīti 03-13"},{"slokaNo":"03-14","chapter":"3","verse":"14","variant":"","devanagari":"एकेनापि सुवृक्षेण पुष्पितेन सुगन्धिना ।\nवासितं तद्वनं सर्वं सुपुत्रेण कुलं यथा ।। ०३-१४","iast":"ekenāpi suvṛkṣeṇa puṣpitena sugandhinā .\nvāsitaṃ tadvanaṃ sarvaṃ suputreṇa kulaṃ yathā .. 03-14","meaning":"One fragrant flowering tree scents the whole forest, just as one good son uplifts a family.","source":"Chanakya Nīti 03-14"},{"slokaNo":"03-15","chapter":"3","verse":"15","variant":"","devanagari":"एकेन शुष्कवृक्षेण दह्यमानेन वह्निना ।\nदह्यते तद्वनं सर्वं कुपुत्रेण कुलं यथा ।। ०३-१५","iast":"ekena śuṣkavṛkṣeṇa dahyamānena vahninā .\ndahyate tadvanaṃ sarvaṃ kuputreṇa kulaṃ yathā .. 03-15","meaning":"One dry burning tree can burn a whole forest, just as one bad son can destroy a family.","source":"Chanakya Nīti 03-15"},{"slokaNo":"03-16","chapter":"3","verse":"16","variant":"","devanagari":"एकेनापि सुपुत्रेण विद्यायुक्तेन साधुना ।\nआह्लादितं कुलं सर्वं यथा चन्द्रेण शर्वरी ।। ०३-१६","iast":"ekenāpi suputreṇa vidyāyuktena sādhunā .\nāhlāditaṃ kulaṃ sarvaṃ yathā candreṇa śarvarī .. 03-16","meaning":"One learned and virtuous son delights the family like the moon brightens the night.","source":"Chanakya Nīti 03-16"},{"slokaNo":"03-17","chapter":"3","verse":"17","variant":"","devanagari":"किं जातैर्बहुभिः पुत्रैः शोकसन्तापकारकः ।\nवरमेकः कुलालम्बी यत्र विश्राम्यते कुलम् ।। ०३-१७","iast":"kiṃ jātairbahubhiḥ putraiḥ śokasantāpakārakaḥ .\nvaramekaḥ kulālambī yatra viśrāmyate kulam .. 03-17","meaning":"Many troublesome sons are useless; one worthy son who supports the family is better.","source":"Chanakya Nīti 03-17"},{"slokaNo":"03-18","chapter":"3","verse":"18","variant":"","devanagari":"लालयेत्पञ्चवर्षाणि दशवर्षाणि ताडयेत् ।\nप्राप्ते तु षोडशे वर्षे पुत्रे मित्रवदाचरेत् ।। ०३-१८","iast":"lālayetpañcavarṣāṇi daśavarṣāṇi tāḍayet .\nprāpte tu ṣoḍaśe varṣe putre mitravadācaret .. 03-18","meaning":"Raise a son with affection for five years, discipline for the next ten, and treat him as a friend after sixteen.","source":"Chanakya Nīti 03-18"},{"slokaNo":"03-19","chapter":"3","verse":"19","variant":"","devanagari":"उपसर्गेऽन्यचक्रे च दुर्भिक्षे च भयावहे ।\nअसाधुजनसम्पर्के यः पलायेत्स जीवति ।। ०३-१९","iast":"upasarge'nyacakre ca durbhikṣe ca bhayāvahe .\nasādhujanasamparke yaḥ palāyetsa jīvati .. 03-19","meaning":"One survives by leaving during calamity, invasion, famine, or association with wicked people.","source":"Chanakya Nīti 03-19"},{"slokaNo":"03-20","chapter":"3","verse":"20","variant":"","devanagari":"धर्मार्थकाममोक्षाणां यस्यैकोऽपि न विद्यते ।\nअजागलस्तनस्येव तस्य जन्म निरर्थकम् ।। ०३-२०","iast":"dharmārthakāmamokṣāṇāṃ yasyaiko'pi na vidyate .\najāgalastanasyeva tasya janma nirarthakam .. 03-20","meaning":"A life without even one of dharma, wealth, desire, or liberation is considered fruitless.","source":"Chanakya Nīti 03-20"},{"slokaNo":"03-21","chapter":"3","verse":"21","variant":"","devanagari":"मूर्खा यत्र न पूज्यन्ते धान्यं यत्र सुसञ्चितम् ।\nदाम्पत्ये कलहो नास्ति तत्र श्री: स्वयमागता ॥ ०३-२१","iast":"mūrkhā yatra na pūjyante dhānyaṃ yatra susañcitam .\ndāmpatye kalaho nāsti tatra śrī: svayamāgatā .. 03-21","meaning":"Fortune comes where fools are not honored, grain is stored well, and husband and wife do not quarrel.","source":"Chanakya Nīti 03-21"},{"slokaNo":"03-31","chapter":"3","verse":"31","variant":"","devanagari":"अयमृतनिधानं नायकोऽप्योषधीनां\nअमृतमयशरीर: कान्तियुक्तोऽपि चन्द्र: ।\nभवति विगतरश्मिर्मण्डलं प्राप्य भानो:\nपरसदननिविष्ट: को लघुत्वं न याति ॥ ०३-३१ Ed. Sharma","iast":"ayamṛtanidhānaṃ nāyako'pyoṣadhīnāṃ\namṛtamayaśarīra: kāntiyukto'pi candra: .\nbhavati vigataraśmirmaṇḍalaṃ prāpya bhāno:\nparasadananiviṣṭa: ko laghutvaṃ na yāti .. 03-31 Ed. Sharma","meaning":"Even the moon, rich in nectar and beauty, loses brightness before the sun; likewise one living in another’s house becomes diminished.","source":"Chanakya Nīti 03-31"},{"slokaNo":"04-01","chapter":"4","verse":"1","variant":"","devanagari":"आयु: कर्म च वित्तं च विद्या निधनमेव च ।\nपञ्चैतानि हि सृज्यन्ते गर्भस्थस्यैव देहिन: ॥ ०४-०१","iast":"āyu: karma ca vittaṃ ca vidyā nidhanameva ca .\npañcaitāni hi sṛjyante garbhasthasyaiva dehina: .. 04-01","meaning":"Lifespan, work, wealth, learning, and death are shaped while a person is still in the womb.","source":"Chanakya Nīti 04-01"},{"slokaNo":"04-02","chapter":"4","verse":"2","variant":"","devanagari":"साधुभ्यस्ते निवर्तन्ते पुत्रमित्राणि बान्धवा: ।\nये च तै: सह गन्तारस्तद्धर्मात्सुकृतं कुलम् ॥ ०४-०२","iast":"sādhubhyaste nivartante putramitrāṇi bāndhavā: .\nye ca tai: saha gantārastaddharmātsukṛtaṃ kulam .. 04-02","meaning":"Relatives may leave the righteous, but those who follow the righteous bring merit to their families.","source":"Chanakya Nīti 04-02"},{"slokaNo":"04-03","chapter":"4","verse":"3","variant":"","devanagari":"दर्शनध्यानसंस्पर्शर्मत्सी कूर्मो च पक्षिणी ।\nशिशुं पालयते नित्यं तथा सज्जन-संगति: ॥ ०४-०३","iast":"darśanadhyānasaṃsparśarmatsī kūrmo ca pakṣiṇī .\nśiśuṃ pālayate nityaṃ tathā sajjana-saṃgati: .. 04-03","meaning":"Fish, tortoises, and birds care for their young by sight, thought, and touch; good company similarly nourishes people.","source":"Chanakya Nīti 04-03"},{"slokaNo":"04-04","chapter":"4","verse":"4","variant":"","devanagari":"यावत्स्वस्थो ह्ययं देहो यावन्मृत्युश्च दूरत: ।\nतावदात्महितं कुर्यात्प्राणान्ते किं करिष्यति ॥ ०४-०४","iast":"yāvatsvastho hyayaṃ deho yāvanmṛtyuśca dūrata: .\ntāvadātmahitaṃ kuryātprāṇānte kiṃ kariṣyati .. 04-04","meaning":"While the body is healthy and death is distant, work for the welfare of the self; at death, it is too late.","source":"Chanakya Nīti 04-04"},{"slokaNo":"04-05","chapter":"4","verse":"5","variant":"","devanagari":"कामधेनुगुणा विद्या ह्यकाले फलदायिनी ।\nप्रवासे मातृसदृशी विद्या गुप्तं धनं स्मृतम् ॥ ०४-०५","iast":"kāmadhenuguṇā vidyā hyakāle phaladāyinī .\npravāse mātṛsadṛśī vidyā guptaṃ dhanaṃ smṛtam .. 04-05","meaning":"Learning is like a wish-fulfilling cow, gives fruit at all times, is like a mother abroad, and is hidden wealth.","source":"Chanakya Nīti 04-05"},{"slokaNo":"04-06","chapter":"4","verse":"6","variant":"","devanagari":"एकोऽपि गुणवानपुत्रो निर्गुणेन शतेन किम् ।\nएकश्चन्द्रस्तमो हन्ति न च तारा: सहस्रश: ॥ ०४-०६","iast":"eko'pi guṇavānaputro nirguṇena śatena kim .\nekaścandrastamo hanti na ca tārā: sahasraśa: .. 04-06","meaning":"One virtuous child is better than a hundred without qualities, as one moon removes darkness better than many stars.","source":"Chanakya Nīti 04-06"},{"slokaNo":"04-07","chapter":"4","verse":"7","variant":"","devanagari":"मूर्खश्चिरायुर्जातोऽपि तस्माज्जातृतो वर: ।\nमृत: स चाल्पदु:खाय यावज्जीवं जडो दहेत् ॥ ०४-०७","iast":"mūrkhaścirāyurjāto'pi tasmājjātṛto vara: .\nmṛta: sa cālpadu:khāya yāvajjīvaṃ jaḍo dahet .. 04-07","meaning":"A dead child causes brief sorrow, but a foolish child causes lifelong grief.","source":"Chanakya Nīti 04-07"},{"slokaNo":"04-08","chapter":"4","verse":"8","variant":"","devanagari":"कुग्रामवास: कुलहीनसेवा\nकुभोजनं क्रोधमुखी च भार्या ।\nपुत्रश्च मूर्खो विधवा च कन्या\nविनाभिना षद्गदहन्ति कायम् ॥ ०४-०८","iast":"kugrāmavāsa: kulahīnasevā\nkubhojanaṃ krodhamukhī ca bhāryā .\nputraśca mūrkho vidhavā ca kanyā\nvinābhinā ṣadgadahanti kāyam .. 04-08","meaning":"A bad village, service to the low, bad food, an angry wife, foolish son, and widowed daughter burn the body without fire.","source":"Chanakya Nīti 04-08"},{"slokaNo":"04-09","chapter":"4","verse":"9","variant":"","devanagari":"किं तया क्रियते धेन्वा या न दोग्ध्री न गर्भिणी ।\nकोऽर्थ: पुत्रेण जातेन यो न विद्वान् न भक्तिमान् ॥ ०४-०९","iast":"kiṃ tayā kriyate dhenvā yā na dogdhrī na garbhiṇī .\nko'rtha: putreṇa jātena yo na vidvān na bhaktimān .. 04-09","meaning":"A cow that gives no milk and bears no calf is useless; likewise a son without learning or devotion is of little value.","source":"Chanakya Nīti 04-09"},{"slokaNo":"04-10","chapter":"4","verse":"10","variant":"","devanagari":"संसारतापदग्धानां त्रयो विश्रान्तिहेतव: ।\nअपत्यं च कलत्रं च सतां सङ्गतिरेव च ॥ ०४-१०","iast":"saṃsāratāpadagdhānāṃ trayo viśrāntihetava: .\napatyaṃ ca kalatraṃ ca satāṃ saṅgatireva ca .. 04-10","meaning":"For those scorched by worldly suffering, three give relief: children, spouse, and the company of good people.","source":"Chanakya Nīti 04-10"},{"slokaNo":"04-11","chapter":"4","verse":"11","variant":"","devanagari":"सकृज्जल्पन्ति राजान: सकृज्जल्पन्ति पण्डिता: ।\nसकृत्कन्या: प्रदीयन्ते त्रीण्येतानि सकृत्सकृत् ॥ ०४-११","iast":"sakṛjjalpanti rājāna: sakṛjjalpanti paṇḍitā: .\nsakṛtkanyā: pradīyante trīṇyetāni sakṛtsakṛt .. 04-11","meaning":"Kings speak once, scholars speak once, and a daughter is given once; these acts should be decisive.","source":"Chanakya Nīti 04-11"},{"slokaNo":"04-12","chapter":"4","verse":"12","variant":"","devanagari":"एकाकिना तपो द्वाभ्यां पठनं गायनं त्रिभि: ।\nचतुर्भिर्गमनं क्षेत्रं पञ्चभिर्बहुभी रण: ॥ ०४-१२","iast":"ekākinā tapo dvābhyāṃ paṭhanaṃ gāyanaṃ tribhi: .\ncaturbhirgamanaṃ kṣetraṃ pañcabhirbahubhī raṇa: .. 04-12","meaning":"Austerity is done alone, study by two, singing by three, travel by four, farming by five, and battle by many.","source":"Chanakya Nīti 04-12"},{"slokaNo":"04-13","chapter":"4","verse":"13","variant":"","devanagari":"सा भार्या या शुचिर्दक्षा सा भार्या या पतिव्रता ।\nसा भार्या या पतिप्रीता सा भार्या सत्यवादिनी ॥ ०४-१३","iast":"sā bhāryā yā śucirdakṣā sā bhāryā yā pativratā .\nsā bhāryā yā patiprītā sā bhāryā satyavādinī .. 04-13","meaning":"A true wife is clean, capable, faithful, pleasing to her husband, and truthful.","source":"Chanakya Nīti 04-13"},{"slokaNo":"04-14","chapter":"4","verse":"14","variant":"","devanagari":"अपुत्रस्य गृहं शून्यं दिश: शून्यास्त्वबान्धवा: ।\nमूर्खस्य हृदयं शून्यं सर्वशून्या दरिद्रता ॥ ०४-१४","iast":"aputrasya gṛhaṃ śūnyaṃ diśa: śūnyāstvabāndhavā: .\nmūrkhasya hṛdayaṃ śūnyaṃ sarvaśūnyā daridratā .. 04-14","meaning":"A childless house is empty, directions are empty without relatives, the heart of a fool is empty, and poverty makes everything empty.","source":"Chanakya Nīti 04-14"},{"slokaNo":"04-15","chapter":"4","verse":"15","variant":"","devanagari":"अनभ्यासे विषं शास्त्रमजीर्णे भोजनं विषम् ।\nदरिद्रस्य विषं गोष्ठी वृद्धस्य तरुणी विषम् ॥ ०४-१५","iast":"anabhyāse viṣaṃ śāstramajīrṇe bhojanaṃ viṣam .\ndaridrasya viṣaṃ goṣṭhī vṛddhasya taruṇī viṣam .. 04-15","meaning":"Scripture without practice is poison, food during indigestion is poison, society is poison to the poor, and a young wife is poison to an old man.","source":"Chanakya Nīti 04-15"},{"slokaNo":"04-16","chapter":"4","verse":"16","variant":"","devanagari":"त्यजेद्धर्मं दयाहीनं विद्याहीनं गुरुं त्यजेत् ।\nत्यजेत्क्रोधमुखीं भार्यां निःस्नेहान्बान्धवांस्त्यजेत् ॥ ०४-१६","iast":"tyajeddharmaṃ dayāhīnaṃ vidyāhīnaṃ guruṃ tyajet .\ntyajetkrodhamukhīṃ bhāryāṃ niḥsnehānbāndhavāṃstyajet .. 04-16","meaning":"Reject a merciless religion, an ignorant teacher, an angry spouse, and relatives without affection.","source":"Chanakya Nīti 04-16"},{"slokaNo":"04-17","chapter":"4","verse":"17","variant":"1","devanagari":"अध्वा जरा देवतां पर्वतानां जलं जरा ।\nअमैथुनं जरा स्त्रीणां वस्त्राणामातपो जरा ॥ ०४-१७","iast":"adhvā jarā devatāṃ parvatānāṃ jalaṃ jarā .\namaithunaṃ jarā strīṇāṃ vastrāṇāmātapo jarā .. 04-17","meaning":"Travel ages a person, being tied ages a horse, lack of marital union ages a woman, and sun exposure ages clothes.","source":"Chanakya Nīti 04-17"},{"slokaNo":"04-17","chapter":"4","verse":"17","variant":"2","devanagari":"इन्द्रियाणि च संयम्य बकवत्पण्डितो नर: ।\nदेशकालवलं ज्ञात्वा सर्वकार्याणि साधयेत् ॥ ०४-१७ Ed. Sharma","iast":"indriyāṇi ca saṃyamya bakavatpaṇḍito nara: .\ndeśakālavalaṃ jñātvā sarvakāryāṇi sādhayet .. 04-17 Ed. Sharma","meaning":"A wise person restrains the senses like a crane and acts after knowing place, time, and strength.","source":"Chanakya Nīti 04-17"},{"slokaNo":"04-18","chapter":"4","verse":"18","variant":"","devanagari":"क: काल: कानि मित्राणि को देश: कौ व्ययागमौ ।\nकश्चाहं क च मे शक्तिरिति चिन्त्यं मुहुर्मुहु: ॥ ०४-१८","iast":"ka: kāla: kāni mitrāṇi ko deśa: kau vyayāgamau .\nkaścāhaṃ ka ca me śaktiriti cintyaṃ muhurmuhu: .. 04-18","meaning":"Repeatedly consider the time, friends, place, income and expense, your identity, and your strength before acting.","source":"Chanakya Nīti 04-18"},{"slokaNo":"04-19","chapter":"4","verse":"19","variant":"","devanagari":"अभिर्देवो द्विजातीनां मुनीनां हृदि दैवतम् ।\nप्रतिमा स्वल्पबुद्धीनां सर्वत्र समदर्शिन: ॥ ०४-१९","iast":"abhirdevo dvijātīnāṃ munīnāṃ hṛdi daivatam .\npratimā svalpabuddhīnāṃ sarvatra samadarśina: .. 04-19","meaning":"Fire is sacred to the twice-born, God dwells in sages’ hearts, images help the simple-minded, and the wise see divinity everywhere.","source":"Chanakya Nīti 04-19"},{"slokaNo":"05-01","chapter":"5","verse":"1","variant":"","devanagari":"गुरुर्ग्निद्विजातीनां वर्णानां ब्राह्मणो गुरु: ।\nपतिरेव गुरु: स्त्रीणां सर्वस्याभ्यागतो गुरु: ॥ ०५-०१","iast":"gururgnidvijātīnāṃ varṇānāṃ brāhmaṇo guru: .\npatireva guru: strīṇāṃ sarvasyābhyāgato guru: .. 05-01","meaning":"Fire is the guide for the twice-born, the brāhmaṇa for the social orders, the husband for the wife, and the guest for all.","source":"Chanakya Nīti 05-01"},{"slokaNo":"05-02","chapter":"5","verse":"2","variant":"","devanagari":"यथा चतुर्भि: कनकं परीक्ष्यते\nनिघर्षणच्छेदनताडनै: ।\nतथा चतुर्भि: पुरुष: परीक्ष्यते\nत्यागेन शीलेन गुणेन कर्मणा ॥ ०५-०२","iast":"yathā caturbhi: kanakaṃ parīkṣyate\nnigharṣaṇacchedanatāḍanai: .\ntathā caturbhi: puruṣa: parīkṣyate\ntyāgena śīlena guṇena karmaṇā .. 05-02","meaning":"Gold is tested by rubbing, cutting, heating, and beating; a person is tested by sacrifice, conduct, qualities, and actions.","source":"Chanakya Nīti 05-02"},{"slokaNo":"05-03","chapter":"5","verse":"3","variant":"","devanagari":"तावद्भयेषु भेतव्यं यावद्भययमागताम् ।\nआगतं तु भयं वीक्ष्य प्रहर्तव्यमशङ्कया ॥ ०५-०३","iast":"tāvadbhayeṣu bhetavyaṃ yāvadbhayayamāgatām .\nāgataṃ tu bhayaṃ vīkṣya prahartavyamaśaṅkayā .. 05-03","meaning":"Fear danger only until it arrives; once it has come, face it and strike without hesitation.","source":"Chanakya Nīti 05-03"},{"slokaNo":"05-04","chapter":"5","verse":"4","variant":"","devanagari":"एकोदरसमुद्भूता एकनक्षत्रजातका: ।\nन भवन्ति समा: शीले यथा बदरकण्टका: ॥ ०५-०४","iast":"ekodarasamudbhūtā ekanakṣatrajātakā: .\nna bhavanti samā: śīle yathā badarakaṇṭakā: .. 05-04","meaning":"People born from the same womb and under the same stars may still differ in character, like thorns on the same tree.","source":"Chanakya Nīti 05-04"},{"slokaNo":"05-05","chapter":"5","verse":"5","variant":"1","devanagari":"अन्यायार्जितवित्तपूर्णमुदरं गर्वेण तुङ्गं शिरो\nरे रे जम्बुक मुञ्च मुञ्च सहसा नीचं सुनिन्द्यं वपु: ॥ ०५-०५ Ed. Sharma","iast":"anyāyārjitavittapūrṇamudaraṃ garveṇa tuṅgaṃ śiro\nre re jambuka muñca muñca sahasā nīcaṃ sunindyaṃ vapu: .. 05-05 Ed. Sharma","meaning":"O jackal, abandon the low and blameworthy body that is swollen with unjust wealth and pride.","source":"Chanakya Nīti 05-05"},{"slokaNo":"05-05","chapter":"5","verse":"5","variant":"2","devanagari":"नि:स्पृहो नाधिकारी स्यान् नाकामो मण्डनप्रिय: ।\nनाविद्वग्धः प्रियं ब्रूयात्स्पष्टवक्ता न वञ्चकः ॥ ०५-०५","iast":"ni:spṛho nādhikārī syān nākāmo maṇḍanapriya: .\nnāvidvagdhaḥ priyaṃ brūyātspaṣṭavaktā na vañcakaḥ .. 05-05","meaning":"The detached do not seek office, the desireless do not seek ornament, the half-learned cannot speak well, and the plain speaker is not deceitful.","source":"Chanakya Nīti 05-05"},{"slokaNo":"05-06","chapter":"5","verse":"6","variant":"","devanagari":"मूर्खाणां पण्डिता द्वेष्या अधनानां महाधनाः ।\nपरांगना कुलस्त्रीणां सुभगानां च दुर्भगाः ॥ ०५-०६","iast":"mūrkhāṇāṃ paṇḍitā dveṣyā adhanānāṃ mahādhanāḥ .\nparāṃganā kulastrīṇāṃ subhagānāṃ ca durbhagāḥ .. 05-06","meaning":"The foolish envy the learned, the poor envy the wealthy, immoral women envy chaste women, and the ugly envy the beautiful.","source":"Chanakya Nīti 05-06"},{"slokaNo":"05-07","chapter":"5","verse":"7","variant":"","devanagari":"आलस्योपगता विद्या परहस्तगतं धनम् ।\nअल्पबीजं हतं क्षेत्रं हतं सैन्यमनायकम् ॥ ०५-०७","iast":"ālasyopagatā vidyā parahastagataṃ dhanam .\nalpabījaṃ hataṃ kṣetraṃ hataṃ sainyamanāyakam .. 05-07","meaning":"Laziness ruins learning, entrusted money may be lost, poor sowing ruins a field, and an army without a leader is destroyed.","source":"Chanakya Nīti 05-07"},{"slokaNo":"05-08","chapter":"5","verse":"8","variant":"","devanagari":"अभ्यासाद्धार्यते विद्या कुलं शीलेन धार्यते ।\nगुणेन ज्ञायते त्वार्यः कोपो नेत्रेण गम्यते ॥ ०५-०८","iast":"abhyāsāddhāryate vidyā kulaṃ śīlena dhāryate .\nguṇena jñāyate tvāryaḥ kopo netreṇa gamyate .. 05-08","meaning":"Learning is preserved by practice, family by conduct, nobility by qualities, and anger is known through the eyes.","source":"Chanakya Nīti 05-08"},{"slokaNo":"05-09","chapter":"5","verse":"9","variant":"","devanagari":"वित्तेन रक्ष्यते धर्मो विद्या योगेन रक्ष्यते ।\nमृदुना रक्ष्यते भूपः सत्स्त्रिया रक्ष्यते गृहम् ॥ ०५-०९","iast":"vittena rakṣyate dharmo vidyā yogena rakṣyate .\nmṛdunā rakṣyate bhūpaḥ satstriyā rakṣyate gṛham .. 05-09","meaning":"Wealth protects dharma, practice protects knowledge, gentleness protects rulers, and a good wife protects the home.","source":"Chanakya Nīti 05-09"},{"slokaNo":"05-10","chapter":"5","verse":"10","variant":"","devanagari":"अन्यथा वेदशास्त्राणि ज्ञानपाण्डित्यमन्यथा ।\nअन्यथा तत्पदं शान्तं लोकाः क्लिश्यन्ति चाह्यथा ॥ ०५-१०","iast":"anyathā vedaśāstrāṇi jñānapāṇḍityamanyathā .\nanyathā tatpadaṃ śāntaṃ lokāḥ kliśyanti cāhyathā .. 05-10","meaning":"Those who reject sacred knowledge, ridicule śāstric ways, or deride peaceful people bring suffering on themselves.","source":"Chanakya Nīti 05-10"},{"slokaNo":"05-11","chapter":"5","verse":"11","variant":"","devanagari":"दारिद्र्यनाशनं दानं शीलं दुर्गतिनाशनम् ।\nअज्ञाननाशिनी प्रज्ञा भावना भयनाशिनी ॥ ०५-११","iast":"dāridryanāśanaṃ dānaṃ śīlaṃ durgatināśanam .\najñānanāśinī prajñā bhāvanā bhayanāśinī .. 05-11","meaning":"Charity removes poverty, good conduct removes misery, wisdom removes ignorance, and contemplation removes fear.","source":"Chanakya Nīti 05-11"},{"slokaNo":"05-12","chapter":"5","verse":"12","variant":"","devanagari":"नास्ति कामसमो व्याधिर्नास्ति मोहसमो रिपुः ।\nनास्ति कोपसमो वह्नीर्नास्ति ज्ञानात्परं सुखम् ॥ ०५-१२","iast":"nāsti kāmasamo vyādhirnāsti mohasamo ripuḥ .\nnāsti kopasamo vahnīrnāsti jñānātparaṃ sukham .. 05-12","meaning":"No disease equals lust, no enemy equals delusion, no fire equals anger, and no happiness equals knowledge.","source":"Chanakya Nīti 05-12"},{"slokaNo":"05-13","chapter":"5","verse":"13","variant":"","devanagari":"जन्ममृत्यू हि यात्येको भुनक्त्येकः शुभाशुभम् ।\nनरकेषु पतत्येक एको याति परां गतिम् ॥ ०५-१३","iast":"janmamṛtyū hi yātyeko bhunaktyekaḥ śubhāśubham .\nnarakeṣu patatyeka eko yāti parāṃ gatim .. 05-13","meaning":"A person is born alone, dies alone, experiences karma alone, and goes alone to lower or higher states.","source":"Chanakya Nīti 05-13"},{"slokaNo":"05-14","chapter":"5","verse":"14","variant":"","devanagari":"तृणं ब्रह्मविदः स्वर्गस्तृणं शूरस्य जीवितम् ।\nजिताशयस्य तृणं नारी निःस्पृहस्य तृणं जगत् ॥ ०५-१४","iast":"tṛṇaṃ brahmavidaḥ svargastṛṇaṃ śūrasya jīvitam .\njitāśayasya tṛṇaṃ nārī niḥspṛhasya tṛṇaṃ jagat .. 05-14","meaning":"Heaven is nothing to the knower, life to the brave, woman to the self-controlled, and the world to the detached.","source":"Chanakya Nīti 05-14"},{"slokaNo":"05-15","chapter":"5","verse":"15","variant":"","devanagari":"विद्या मित्रं प्रवासे च भार्या मित्रं गृहेषु च ।\nव्याधितस्यौषधं मित्रं धर्मो मित्रं मृतस्य च ॥ ०५-१५","iast":"vidyā mitraṃ pravāse ca bhāryā mitraṃ gṛheṣu ca .\nvyādhitasyauṣadhaṃ mitraṃ dharmo mitraṃ mṛtasya ca .. 05-15","meaning":"Learning is a friend abroad, a wife at home, medicine in sickness, and dharma after death.","source":"Chanakya Nīti 05-15"},{"slokaNo":"05-16","chapter":"5","verse":"16","variant":"","devanagari":"वृथा वृष्टिः समुद्रेषु वृथा तृप्तस्य भोजनम् ।\nवृथा दानं समर्थस्य वृथा दीपो दिवापि च ॥ ०५-१६","iast":"vṛthā vṛṣṭiḥ samudreṣu vṛthā tṛptasya bhojanam .\nvṛthā dānaṃ samarthasya vṛthā dīpo divāpi ca .. 05-16","meaning":"Rain in the ocean, food for the full, charity to the rich, and a lamp in daylight are useless.","source":"Chanakya Nīti 05-16"},{"slokaNo":"05-17","chapter":"5","verse":"17","variant":"","devanagari":"नास्ति मेघसमं तोयं नास्ति चात्मसमं बलम् ।\nनास्ति चक्षुःसमं तेजो नास्ति धान्यसमं प्रियम् ॥ ०५-१७","iast":"nāsti meghasamaṃ toyaṃ nāsti cātmasamaṃ balam .\nnāsti cakṣuḥsamaṃ tejo nāsti dhānyasamaṃ priyam .. 05-17","meaning":"Rainwater is the best water, self-strength the best strength, eyesight the best light, and grain the dearest wealth.","source":"Chanakya Nīti 05-17"},{"slokaNo":"05-18","chapter":"5","verse":"18","variant":"","devanagari":"अधना धनमिच्छन्ति वाचं चैव चतुष्पदाः ।\nमानवाः स्वर्गमिच्छन्ति मोक्षमिच्छन्ति देवताः ॥ ०५-१८","iast":"adhanā dhanamicchanti vācaṃ caiva catuṣpadāḥ .\nmānavāḥ svargamicchanti mokṣamicchanti devatāḥ .. 05-18","meaning":"The poor desire wealth, animals speech, humans heaven, and divine beings liberation.","source":"Chanakya Nīti 05-18"},{"slokaNo":"05-19","chapter":"5","verse":"19","variant":"","devanagari":"सत्येन धार्यते पृथ्वी सत्येन तपते रविः ।\nसत्येन वाति वायुश्च सर्वं सत्ये प्रतिष्ठितम् ॥ ०५-१९","iast":"satyena dhāryate pṛthvī satyena tapate raviḥ .\nsatyena vāti vāyuśca sarvaṃ satye pratiṣṭhitam .. 05-19","meaning":"Truth upholds the earth, makes the sun shine and the wind blow; everything rests on truth.","source":"Chanakya Nīti 05-19"},{"slokaNo":"05-20","chapter":"5","verse":"20","variant":"","devanagari":"चला लक्ष्मीश्चलाः प्राणाश्चले जीवितमन्दिरे ।\nचलाचले च संसारे धर्म एको हि निश्चलः ॥ ०५-२०","iast":"calā lakṣmīścalāḥ prāṇāścale jīvitamandire .\ncalācale ca saṃsāre dharma eko hi niścalaḥ .. 05-20","meaning":"Wealth, life, and home are unstable; in this changing world only dharma is firm.","source":"Chanakya Nīti 05-20"},{"slokaNo":"05-21","chapter":"5","verse":"21","variant":"","devanagari":"नराणां नापितो धूर्तः पक्षिणां चैव वायसः ।\nचतुष्पादं शृगालस्तु स्त्रीणां धूर्ता च मालिनी ॥ ०५-२१","iast":"narāṇāṃ nāpito dhūrtaḥ pakṣiṇāṃ caiva vāyasaḥ .\ncatuṣpādaṃ śṛgālastu strīṇāṃ dhūrtā ca mālinī .. 05-21","meaning":"Among men the barber is called cunning, among birds the crow, among animals the jackal, and among women the flower seller.","source":"Chanakya Nīti 05-21"},{"slokaNo":"05-22","chapter":"5","verse":"22","variant":"","devanagari":"जनिता चोपनेता च यस्तु विद्यां प्रयच्छति ।\nअन्नदाता भयत्राता पञ्चैते पितरः स्मृताः ॥ ०५-२२","iast":"janitā copanetā ca yastu vidyāṃ prayacchati .\nannadātā bhayatrātā pañcaite pitaraḥ smṛtāḥ .. 05-22","meaning":"The giver of birth, initiator, teacher, food-giver, and protector from danger are remembered as five fathers.","source":"Chanakya Nīti 05-22"},{"slokaNo":"05-23","chapter":"5","verse":"23","variant":"","devanagari":"राजपत्नी गुरोः पत्नी मित्रपत्नी तथैव च ।\nपत्नीमाता स्वमाता च पञ्चैता मातरः स्मृताः ॥ ०५-२३","iast":"rājapatnī guroḥ patnī mitrapatnī tathaiva ca .\npatnīmātā svamātā ca pañcaitā mātaraḥ smṛtāḥ .. 05-23","meaning":"The king’s wife, teacher’s wife, friend’s wife, wife’s mother, and one’s own mother are to be regarded as mothers.","source":"Chanakya Nīti 05-23"},{"slokaNo":"06-01","chapter":"6","verse":"1","variant":"","devanagari":"श्रुत्वा धर्मं विजानाति श्रुत्वा त्यजति दुर्मतिम् ।\nश्रुत्वा ज्ञानमवाप्नोति श्रुत्वा मोक्षमवाप्नुयात् ॥ ०६-०१","iast":"śrutvā dharmaṃ vijānāti śrutvā tyajati durmatim .\nśrutvā jñānamavāpnoti śrutvā mokṣamavāpnuyāt .. 06-01","meaning":"By hearing, one understands dharma, gives up wrong thinking, gains knowledge, and moves toward liberation.","source":"Chanakya Nīti 06-01"},{"slokaNo":"06-02","chapter":"6","verse":"2","variant":"","devanagari":"पक्षिणः काकश्चण्डालः पशूनां चैव कुक्कुरः ।\nमुनीनां पापश्चण्डालः सर्वचाण्डालनिन्दकः ॥ ०६-०२","iast":"pakṣiṇaḥ kākaścaṇḍālaḥ paśūnāṃ caiva kukkuraḥ .\nmunīnāṃ pāpaścaṇḍālaḥ sarvacāṇḍālanindakaḥ .. 06-02","meaning":"The crow is low among birds, the dog among animals, the sinful among ascetics, and the slanderer is worst of all.","source":"Chanakya Nīti 06-02"},{"slokaNo":"06-03","chapter":"6","verse":"3","variant":"","devanagari":"भस्मना शुध्यते कांस्यं ताम्रमम्लेन शुध्यति ।\nरजसा शुध्यते नारी नदी वेगेन शुध्यति ॥ ०६-०३","iast":"bhasmanā śudhyate kāṃsyaṃ tāmramamlena śudhyati .\nrajasā śudhyate nārī nadī vegena śudhyati .. 06-03","meaning":"Brass is cleaned with ash, copper with acid, a woman by her natural cycle, and a river by its flow.","source":"Chanakya Nīti 06-03"},{"slokaNo":"06-04","chapter":"6","verse":"4","variant":"","devanagari":"भ्रमन्सम्पूज्यते राजा भ्रमन्सम्पूज्यते द्विजः ।\nभ्रमन्सम्पूज्यते योगी स्त्री भ्रमन्ती विनश्यति ॥ ०६-०४","iast":"bhramansampūjyate rājā bhramansampūjyate dvijaḥ .\nbhramansampūjyate yogī strī bhramantī vinaśyati .. 06-04","meaning":"A travelling king, brāhmaṇa, and yogi gain respect, but a wandering woman is said to fall into danger.","source":"Chanakya Nīti 06-04"},{"slokaNo":"06-05","chapter":"6","verse":"5","variant":"","devanagari":"यस्यार्थास्तस्य मित्राणि यस्यार्थास्तस्य बान्धवाः ।\nयस्यार्थाः स पुमांल्लोके यस्यार्थाः स च पण्डितः ॥ ०६-०५","iast":"yasyārthāstasya mitrāṇi yasyārthāstasya bāndhavāḥ .\nyasyārthāḥ sa pumāṃlloke yasyārthāḥ sa ca paṇḍitaḥ .. 06-05","meaning":"The wealthy have friends and relatives; wealth often makes a person seem important and wise.","source":"Chanakya Nīti 06-05"},{"slokaNo":"06-06","chapter":"6","verse":"6","variant":"","devanagari":"तादृशी जायते बुद्धिव्यवसायोऽपि तादृशः ।\nसाहयास्तादृशा एव यादृशी भवितव्यता ॥ ०६-०६","iast":"tādṛśī jāyate buddhivyavasāyo'pi tādṛśaḥ .\nsāhayāstādṛśā eva yādṛśī bhavitavyatā .. 06-06","meaning":"As destiny is, so are intellect, effort, and helpers; circumstances follow destiny.","source":"Chanakya Nīti 06-06"},{"slokaNo":"06-07","chapter":"6","verse":"7","variant":"","devanagari":"कालः पचति भूतानि कालः संहरते प्रजाः ।\nकालः सुप्तेषु जागर्ति कालो हि दुरतिक्रमः ॥ ०६-०७","iast":"kālaḥ pacati bhūtāni kālaḥ saṃharate prajāḥ .\nkālaḥ supteṣu jāgarti kālo hi duratikramaḥ .. 06-07","meaning":"Time ripens beings, destroys them, remains awake when all sleep, and cannot be overcome.","source":"Chanakya Nīti 06-07"},{"slokaNo":"06-08","chapter":"6","verse":"8","variant":"","devanagari":"न पश्यति च जन्मान्धः कामान्धो नैव पश्यति ।\nमदोन्मत्ता न पश्यन्ति अर्थी दोषं न पश्यति ॥ ०६-०८","iast":"na paśyati ca janmāndhaḥ kāmāndho naiva paśyati .\nmadonmattā na paśyanti arthī doṣaṃ na paśyati .. 06-08","meaning":"The born-blind cannot see; the lust-blind, proud, and greedy also fail to see truth or fault.","source":"Chanakya Nīti 06-08"},{"slokaNo":"06-09","chapter":"6","verse":"9","variant":"","devanagari":"स्वयं कर्म करोत्यात्मा स्वयं तत्फलमश्नुते ।\nस्वयं भ्रमति संसारे स्वयं तस्माद्विमुच्यते ॥ ०६-०९","iast":"svayaṃ karma karotyātmā svayaṃ tatphalamaśnute .\nsvayaṃ bhramati saṃsāre svayaṃ tasmādvimucyate .. 06-09","meaning":"The self acts, enjoys the fruits, wanders in the world, and is freed by its own effort.","source":"Chanakya Nīti 06-09"},{"slokaNo":"06-10","chapter":"6","verse":"10","variant":"","devanagari":"राजा राष्ट्रकृतं पापं राज्ञः पापं पुरोहितः ।\nभर्ता च स्त्रीकृतं पापं शिष्यपापं गुरुस्तथा ॥ ०६-१०","iast":"rājā rāṣṭrakṛtaṃ pāpaṃ rājñaḥ pāpaṃ purohitaḥ .\nbhartā ca strīkṛtaṃ pāpaṃ śiṣyapāpaṃ gurustathā .. 06-10","meaning":"A king bears the sins of subjects, a priest of the king, a husband of his wife, and a teacher of his students.","source":"Chanakya Nīti 06-10"},{"slokaNo":"06-11","chapter":"6","verse":"11","variant":"","devanagari":"ऋणकर्ता पिता शत्रुर्माता च व्यभिचारिणी ।\nभार्या रूपवती शत्रुः पुत्रः शत्रुरपण्डितः ॥ ०६-११","iast":"ṛṇakartā pitā śatrurmātā ca vyabhicāriṇī .\nbhāryā rūpavatī śatruḥ putraḥ śatrurapaṇḍitaḥ .. 06-11","meaning":"A debtor father, adulterous mother, overly attractive wife, and unlearned son are like enemies in the home.","source":"Chanakya Nīti 06-11"},{"slokaNo":"06-12","chapter":"6","verse":"12","variant":"","devanagari":"लुभ्यमर्थेन गृह्णीयात् स्तब्धमञ्जलिकर्मणा ।\nमूर्खं छन्दोऽनुवृत्त्या च यथार्थत्वेन पण्डितम् ॥ ०६-१२","iast":"lubhyamarthena gṛhṇīyāt stabdhamañjalikarmaṇā .\nmūrkhaṃ chando'nuvṛttyā ca yathārthatvena paṇḍitam .. 06-12","meaning":"Win the greedy with gifts, the proud with humility, the fool by pleasing him, and the learned with truth.","source":"Chanakya Nīti 06-12"},{"slokaNo":"06-13","chapter":"6","verse":"13","variant":"","devanagari":"वरं न राज्यं न कुराज्यराज्यं\nवरं न मित्रं न कुमित्रमित्रम् ।\nवरं न शिष्यो न कुशिष्यशिष्यो\nवरं न दार न कुदारदारः ॥ ०६-१३","iast":"varaṃ na rājyaṃ na kurājyarājyaṃ\nvaraṃ na mitraṃ na kumitramitram .\nvaraṃ na śiṣyo na kuśiṣyaśiṣyo\nvaraṃ na dāra na kudāradāraḥ .. 06-13","meaning":"Better no kingdom, friend, disciple, or wife than a bad kingdom, bad friend, bad disciple, or bad wife.","source":"Chanakya Nīti 06-13"},{"slokaNo":"06-14","chapter":"6","verse":"14","variant":"","devanagari":"कुराजराज्येन कुतः प्रजासुखं\nकुमित्रमित्रेण कुतोऽभिनिवृतिः ।\nकुदारदारैश्च कुतो गृहे रतिः\nकुशिष्यशिष्यमध्यापयतः कुतो यशः ॥ ०६-१४","iast":"kurājarājyena kutaḥ prajāsukhaṃ\nkumitramitreṇa kuto'bhinivṛtiḥ .\nkudāradāraiśca kuto gṛhe ratiḥ\nkuśiṣyaśiṣyamadhyāpayataḥ kuto yaśaḥ .. 06-14","meaning":"A bad kingdom gives no public happiness; a bad friend no peace; a bad wife no home joy; a bad pupil no teacherly fame.","source":"Chanakya Nīti 06-14"},{"slokaNo":"06-15","chapter":"6","verse":"15","variant":"","devanagari":"सिंहादेकं बकादेकं शिक्षेच्चत्वारि कुक्कुटात् ।\nवायसात्पञ्च शिक्षेच्च षड्वनस्त्रीणि गर्दभात् ॥ ०६-१५","iast":"siṃhādekaṃ bakādekaṃ śikṣeccatvāri kukkuṭāt .\nvāyasātpañca śikṣecca ṣaḍvanastrīṇi gardabhāt .. 06-15","meaning":"Learn one quality from the lion, one from the crane, four from the cock, five from the crow, six from the dog, and three from the donkey.","source":"Chanakya Nīti 06-15"},{"slokaNo":"06-16","chapter":"6","verse":"16","variant":"","devanagari":"प्रभूतं कार्यमल्पं वा यन्नरः कर्तुमिच्छति ।\nसर्वारम्भेण तत्कार्यं सिंहादेकं प्रचक्षते ॥ ०६-१६","iast":"prabhūtaṃ kāryamalpaṃ vā yannaraḥ kartumicchati .\nsarvārambheṇa tatkāryaṃ siṃhādekaṃ pracakṣate .. 06-16","meaning":"From the lion learn to undertake every task, great or small, with full force.","source":"Chanakya Nīti 06-16"},{"slokaNo":"06-17","chapter":"6","verse":"17","variant":"","devanagari":"इन्द्रियाणि च संयम्य रागद्वेषविवर्जितः ।\nसमदुःखसुखः शान्तः तत्त्वज्ञः साधुरुच्यते ॥ ०६-१७","iast":"indriyāṇi ca saṃyamya rāgadveṣavivarjitaḥ .\nsamaduḥkhasukhaḥ śāntaḥ tattvajñaḥ sādhurucyate .. 06-17","meaning":"Like the crane, restrain the senses and act only after judging place, time, and ability.","source":"Chanakya Nīti 06-17"},{"slokaNo":"06-18","chapter":"6","verse":"18","variant":"","devanagari":"प्रत्युत्थानं च युद्धं च संविभागं च बन्धुषु ।\nस्वयमाक्रम्य भुक्तं च शिक्षेच्चत्वारि कुक्कुटात् ॥ ०६-१८","iast":"pratyutthānaṃ ca yuddhaṃ ca saṃvibhāgaṃ ca bandhuṣu .\nsvayamākramya bhuktaṃ ca śikṣeccatvāri kukkuṭāt .. 06-18","meaning":"From the cock learn to rise on time, be ready to fight, share with kin, and earn by one’s own effort.","source":"Chanakya Nīti 06-18"},{"slokaNo":"06-19","chapter":"6","verse":"19","variant":"","devanagari":"गूढमैथुनचारित्वं काले काले च सङ्ग्रहम् ।\nअप्रमत्तमविश्वासं पञ्च शिक्षेच्च वायसात् ॥ ०६-१९","iast":"gūḍhamaithunacāritvaṃ kāle kāle ca saṅgraham .\napramattamaviśvāsaṃ pañca śikṣecca vāyasāt .. 06-19","meaning":"From the crow learn secrecy in union, timely storing, alertness, boldness, and caution in trusting.","source":"Chanakya Nīti 06-19"},{"slokaNo":"06-20","chapter":"6","verse":"20","variant":"","devanagari":"बहाशी स्वल्पसन्तुष्टः सनिद्रो लघुचेतनः ।\nस्वामिभक्तश्च शूरश्च षडेते ध्वानतो गुणाः ॥ ०६-२०","iast":"bahāśī svalpasantuṣṭaḥ sanidro laghucetanaḥ .\nsvāmibhaktaśca śūraśca ṣaḍete dhvānato guṇāḥ .. 06-20","meaning":"From the dog learn appetite with contentment, quick waking, loyalty to the master, and bravery.","source":"Chanakya Nīti 06-20"},{"slokaNo":"06-21","chapter":"6","verse":"21","variant":"","devanagari":"सुश्रान्तोऽपि वहेद्भारं शीतोष्णं न च पश्यति ।\nसन्तुष्टश्चरते नित्यं त्रीणि शिक्षेच्च गर्दभात् ॥ ०६-२१","iast":"suśrānto'pi vahedbhāraṃ śītoṣṇaṃ na ca paśyati .\nsantuṣṭaścarate nityaṃ trīṇi śikṣecca gardabhāt .. 06-21","meaning":"From the donkey learn to carry burdens despite fatigue, endure heat and cold, and remain content.","source":"Chanakya Nīti 06-21"},{"slokaNo":"06-22","chapter":"6","verse":"22","variant":"","devanagari":"य एतान्विंशतिगुणानाचरिष्यति मानवः ।\nकार्यावस्थासु सर्वासु अजेयः स भविष्यति ॥ ०६-२२","iast":"ya etānviṃśatiguṇānācariṣyati mānavaḥ .\nkāryāvasthāsu sarvāsu ajeyaḥ sa bhaviṣyati .. 06-22","meaning":"One who practices these twenty qualities becomes unconquerable in undertakings.","source":"Chanakya Nīti 06-22"},{"slokaNo":"07-01","chapter":"7","verse":"1","variant":"","devanagari":"अर्थनाशं मनस्तापं गृहे दुश्चरितानि च ।\nवञ्चनं चापमानं च मतिमान्न प्रकाशयेत् ॥ ०७-०१","iast":"arthanāśaṃ manastāpaṃ gṛhe duścaritāni ca .\nvañcanaṃ cāpamānaṃ ca matimānna prakāśayet .. 07-01","meaning":"A wise person does not publicly reveal loss of wealth, mental pain, family misconduct, deception, or insult.","source":"Chanakya Nīti 07-01"},{"slokaNo":"07-02","chapter":"7","verse":"2","variant":"","devanagari":"धनधान्यप्रयोगेषु विद्यासङ्ग्रहणे तथा ।\nआहारे व्यवहारे च त्यक्तलज्जः सुखी भवेत् ॥ ०७-०२","iast":"dhanadhānyaprayogeṣu vidyāsaṅgrahaṇe tathā .\nāhāre vyavahāre ca tyaktalajjaḥ sukhī bhavet .. 07-02","meaning":"One who gives up false shyness in money matters, learning, eating, and business becomes happy.","source":"Chanakya Nīti 07-02"},{"slokaNo":"07-03","chapter":"7","verse":"3","variant":"","devanagari":"सन्तोषामृततृप्तानां यत्सुखं शान्तिरेव च ।\nन च तद्धनलुब््यानामितश्चेतश्च धावताम् ॥ ०७-०३","iast":"santoṣāmṛtatṛptānāṃ yatsukhaṃ śāntireva ca .\nna ca taddhanalubyānāmitaścetaśca dhāvatām .. 07-03","meaning":"The peace of the content cannot be attained by greedy people running restlessly everywhere.","source":"Chanakya Nīti 07-03"},{"slokaNo":"07-04","chapter":"7","verse":"4","variant":"","devanagari":"सन्तोषस्त्रिषु कर्तव्यः स्वदारे भोजने धने ।\nत्रिषु चैव न कर्तव्योऽध्ययने जपदानयोः ।। ०७-०४","iast":"santoṣastriṣu kartavyaḥ svadāre bhojane dhane .\ntriṣu caiva na kartavyo'dhyayane japadānayoḥ .. 07-04","meaning":"Be content with one’s spouse, food, and wealth; never be content with study, japa, or charity.","source":"Chanakya Nīti 07-04"},{"slokaNo":"07-05","chapter":"7","verse":"5","variant":"","devanagari":"विप्रयोर्वप्रवह्योश्च दम्पत्योः स्वामिभृत्ययोः ।\nअन्तरेण न गन्तव्यं हलस्य वृषभस्य च ।। ०७-०५","iast":"viprayorvapravahyośca dampatyoḥ svāmibhṛtyayoḥ .\nantareṇa na gantavyaṃ halasya vṛṣabhasya ca .. 07-05","meaning":"Do not pass between two brāhmaṇas, between a priest and fire, husband and wife, master and servant, or plough and ox.","source":"Chanakya Nīti 07-05"},{"slokaNo":"07-06","chapter":"7","verse":"6","variant":"","devanagari":"पादाभ्यां न स्पृशेदग्निं गुरुं ब्राह्मणमेव च ।\nनैव गां न कुमारीं च न वृद्धं न शिशुं तथा ।। ०७-०६","iast":"pādābhyāṃ na spṛśedagniṃ guruṃ brāhmaṇameva ca .\nnaiva gāṃ na kumārīṃ ca na vṛddhaṃ na śiśuṃ tathā .. 07-06","meaning":"Do not touch with the feet fire, teacher, brāhmaṇa, cow, maiden, elder, or child.","source":"Chanakya Nīti 07-06"},{"slokaNo":"07-07","chapter":"7","verse":"7","variant":"","devanagari":"शकटं पञ्चहस्तेन दशहस्तेन वाजिनम् ।\nगजं हस्तसहस्रेण देशत्यागेन दुर्जनम् ।। ०७-०७","iast":"śakaṭaṃ pañcahastena daśahastena vājinam .\ngajaṃ hastasahasreṇa deśatyāgena durjanam .. 07-07","meaning":"Keep distance from danger: carts, horses, elephants, and especially wicked people—leave the country if needed.","source":"Chanakya Nīti 07-07"},{"slokaNo":"07-08","chapter":"7","verse":"8","variant":"","devanagari":"हस्ती अङ्कुशमात्रेण वाजी हस्तेन ताड्यते ।\nशृङ्गी लगुडहस्तेन खड्गहस्तेन दुर्जनः ।। ०७-०८","iast":"hastī aṅkuśamātreṇa vājī hastena tāḍyate .\nśṛṅgī laguḍahastena khaḍgahastena durjanaḥ .. 07-08","meaning":"An elephant is controlled by a goad, a horse by the hand, a horned animal by a stick, and the wicked by force.","source":"Chanakya Nīti 07-08"},{"slokaNo":"07-09","chapter":"7","verse":"9","variant":"","devanagari":"तुष्यन्ति भोजने विप्रा मयूरा घनगर्जिते ।\nसाधवः परसम्पत्तौ खलाः परविपत्तिषु ।। ०७-०९","iast":"tuṣyanti bhojane viprā mayūrā ghanagarjite .\nsādhavaḥ parasampattau khalāḥ paravipattiṣu .. 07-09","meaning":"Brāhmaṇas rejoice in food, peacocks in thunder, good people in others’ prosperity, and the wicked in others’ misery.","source":"Chanakya Nīti 07-09"},{"slokaNo":"07-10","chapter":"7","verse":"10","variant":"","devanagari":"अनुलोमेन बलिनं प्रतिलोमेन दुर्जनम् ।\nआत्मतुल्यबलं शत्रुं विनयेन बलेन वा ।। ०७-१०","iast":"anulomena balinaṃ pratilomena durjanam .\nātmatulyabalaṃ śatruṃ vinayena balena vā .. 07-10","meaning":"Handle the powerful with submission, the wicked with opposition, and equals with politeness or strength.","source":"Chanakya Nīti 07-10"},{"slokaNo":"07-11","chapter":"7","verse":"11","variant":"","devanagari":"बाहुवीर्यं बलं राज्ञां ब्रह्मणो ब्रह्मविद्धली ।\nरूपयौवनमाधुर्यं स्त्रीणां बलमनुत्तमम् ।। ०७-११","iast":"bāhuvīryaṃ balaṃ rājñāṃ brahmaṇo brahmaviddhalī .\nrūpayauvanamādhuryaṃ strīṇāṃ balamanuttamam .. 07-11","meaning":"A king’s strength is arms, a brāhmaṇa’s is spiritual knowledge, and a woman’s is beauty, youth, and sweetness.","source":"Chanakya Nīti 07-11"},{"slokaNo":"07-12","chapter":"7","verse":"12","variant":"","devanagari":"नात्यन्तं सरलैर्भाव्यं गत्वा पश्य वनस्थलीम् ।\nछिद्यन्ते सरलास्तत्र कुब्जास्तिष्ठन्ति पादपाः ।। ०७-१२","iast":"nātyantaṃ saralairbhāvyaṃ gatvā paśya vanasthalīm .\nchidyante saralāstatra kubjāstiṣṭhanti pādapāḥ .. 07-12","meaning":"Do not be excessively straightforward; in the forest straight trees are cut, while crooked trees remain.","source":"Chanakya Nīti 07-12"},{"slokaNo":"07-13","chapter":"7","verse":"13","variant":"","devanagari":"यत्रोदकं तत्र वसन्ति हंसा-\nस्तथैव शुष्कं परिवर्जयन्ति ।\nन हंसतुल्येन नरेण भाव्यं\nपुनस्त्यजन्तः पुनराश्रयन्ते ।। ०७-१३","iast":"yatrodakaṃ tatra vasanti haṃsā-\nstathaiva śuṣkaṃ parivarjayanti .\nna haṃsatulyena nareṇa bhāvyaṃ\npunastyajantaḥ punarāśrayante .. 07-13","meaning":"Swans leave dry places and go where water is; a person should not be fickle like that.","source":"Chanakya Nīti 07-13"},{"slokaNo":"07-14","chapter":"7","verse":"14","variant":"","devanagari":"उपार्जितानां वित्तानां त्याग एव हि रक्षणम् ।\nतडागोदरसंस्थानां परीवाह इवाम्भसाम् ।। ०७-१४","iast":"upārjitānāṃ vittānāṃ tyāga eva hi rakṣaṇam .\ntaḍāgodarasaṃsthānāṃ parīvāha ivāmbhasām .. 07-14","meaning":"Wealth is preserved through proper giving, just as a reservoir stays pure by overflow of water.","source":"Chanakya Nīti 07-14"},{"slokaNo":"07-15","chapter":"7","verse":"15","variant":"","devanagari":"यस्यार्थास्तस्य मित्राणि यस्यार्थास्तस्य बान्धवाः ।\nयस्यार्थाः स पुमाँल्लोके यस्यार्थाः स च पण्डितः ।। ०७-१५","iast":"yasyārthāstasya mitrāṇi yasyārthāstasya bāndhavāḥ .\nyasyārthāḥ sa pumām̐lloke yasyārthāḥ sa ca paṇḍitaḥ .. 07-15","meaning":"The wealthy gain friends and relatives and are treated as important and wise.","source":"Chanakya Nīti 07-15"},{"slokaNo":"07-16","chapter":"7","verse":"16","variant":"","devanagari":"स्वर्गस्थितानामिह जीवलोके\nचत्वारि चिह्नानि वसन्ति देहे ।\nदानप्रसंगो मधुरा च वाणी\nदेवार्चनं ब्राह्मणतर्पणं च ।। ०७-१६","iast":"svargasthitānāmiha jīvaloke\ncatvāri cihnāni vasanti dehe .\ndānaprasaṃgo madhurā ca vāṇī\ndevārcanaṃ brāhmaṇatarpaṇaṃ ca .. 07-16","meaning":"Charity, sweet speech, worship, and honoring the learned are signs of heavenly character on earth.","source":"Chanakya Nīti 07-16"},{"slokaNo":"07-17","chapter":"7","verse":"17","variant":"","devanagari":"अत्यन्तकोपः कटुका च वाणी\nदरिद्रता च स्वजनेषु वैरम् ।\nनीचप्रसंगः कुलहीनसेवा\nचिह्नानि देहे नरकस्थितानाम् ॥ ०७-१७","iast":"atyantakopaḥ kaṭukā ca vāṇī\ndaridratā ca svajaneṣu vairam .\nnīcaprasaṃgaḥ kulahīnasevā\ncihnāni dehe narakasthitānām .. 07-17","meaning":"Extreme anger, harsh speech, poverty, quarrels with relatives, bad company, and service to the low are signs of hellish conduct.","source":"Chanakya Nīti 07-17"},{"slokaNo":"07-18","chapter":"7","verse":"18","variant":"","devanagari":"गम्यते यदि मृगेन्द्रमन्दिरं\nलभ्यते करिकपालमौक्तिकम् ।\nजम्बुकालयगते च प्राप्यते\nवत्सपुच्छखरचर्मखण्डनम् ॥ ०७-१८","iast":"gamyate yadi mṛgendramandiraṃ\nlabhyate karikapālamauktikam .\njambukālayagate ca prāpyate\nvatsapucchakharacarmakhaṇḍanam .. 07-18","meaning":"Going to a lion’s den may yield elephant pearls; going to a jackal’s hole yields only worthless scraps.","source":"Chanakya Nīti 07-18"},{"slokaNo":"07-19","chapter":"7","verse":"19","variant":"","devanagari":"शुनः पुच्छमिव व्यर्थं जीवितं विद्यया विना ।\nन गुह्यगोपने शक्तं न च दंशनिवारणे ॥ ०७-१९","iast":"śunaḥ pucchamiva vyarthaṃ jīvitaṃ vidyayā vinā .\nna guhyagopane śaktaṃ na ca daṃśanivāraṇe .. 07-19","meaning":"Life without learning is like a dog’s tail: it hides nothing and protects nothing.","source":"Chanakya Nīti 07-19"},{"slokaNo":"07-20","chapter":"7","verse":"20","variant":"","devanagari":"वाचां शौचं च मनसः शौचमिन्द्रियनिग्रहः ।\nसर्वभूतदयाशौचमेतच्छौचं परार्थिनाम् ॥ ०७-२०","iast":"vācāṃ śaucaṃ ca manasaḥ śaucamindriyanigrahaḥ .\nsarvabhūtadayāśaucametacchaucaṃ parārthinām .. 07-20","meaning":"Purity of speech, mind, senses, and compassion toward all beings is true purity for seekers.","source":"Chanakya Nīti 07-20"},{"slokaNo":"07-21","chapter":"7","verse":"21","variant":"","devanagari":"पुष्पे गन्धं तिले तैलं काष्ठेऽग्निं पयसि घृतम् ।\nइक्षौ गुडं तथा देहे पश्यात्मानं विवेकतः ॥ ०७-२१","iast":"puṣpe gandhaṃ tile tailaṃ kāṣṭhe'gniṃ payasi ghṛtam .\nikṣau guḍaṃ tathā dehe paśyātmānaṃ vivekataḥ .. 07-21","meaning":"As fragrance is in flowers and oil in sesame, seek the Self within the body through discernment.","source":"Chanakya Nīti 07-21"},{"slokaNo":"08-01","chapter":"8","verse":"1","variant":"","devanagari":"अधमा धनमिच्छन्ति धनमानौ च मध्यमाः ।\nउत्तम मानमिच्छन्ति मानो हि महतां धनम् ॥ ०८-०१","iast":"adhamā dhanamicchanti dhanamānau ca madhyamāḥ .\nuttama mānamicchanti māno hi mahatāṃ dhanam .. 08-01","meaning":"Low people desire wealth, middling people wealth and honor, but noble people value honor as their true wealth.","source":"Chanakya Nīti 08-01"},{"slokaNo":"08-02","chapter":"8","verse":"2","variant":"","devanagari":"इक्षुरापः पयो मूलं ताम्बूलं फलमौषधम् ।\nभक्षयित्वापि कर्तव्याः स्नानदानादिकाः क्रियाः ॥ ०८-०२","iast":"ikṣurāpaḥ payo mūlaṃ tāmbūlaṃ phalamauṣadham .\nbhakṣayitvāpi kartavyāḥ snānadānādikāḥ kriyāḥ .. 08-02","meaning":"After taking sugarcane, water, milk, roots, betel, fruit, or medicine, one may still perform bathing, charity, and sacred duties.","source":"Chanakya Nīti 08-02"},{"slokaNo":"08-03","chapter":"8","verse":"3","variant":"","devanagari":"दीपो भक्ष्यते ध्वान्तं कज्जलं च प्रसूयते ।\nयदन्नं भक्ष्यते नित्यं जायते तादृशी प्रजा ॥ ०८-०३","iast":"dīpo bhakṣyate dhvāntaṃ kajjalaṃ ca prasūyate .\nyadannaṃ bhakṣyate nityaṃ jāyate tādṛśī prajā .. 08-03","meaning":"A lamp consumes darkness and produces soot; similarly, the nature of what one consumes influences one’s offspring and character.","source":"Chanakya Nīti 08-03"},{"slokaNo":"08-04","chapter":"8","verse":"4","variant":"","devanagari":"वित्तं देहि गुणान्वितेषु मतिमन्यत्र देहि कचित्\nप्राप्तं वारिनिधेर्जलं घनमुखे माधुर्ययुक्तं सदा ।\nजीवान्स्थावरजंगमांश्च सकलान्संजीवय भूमण्डलं\nभूयः पश्य तदेव कोटिगुणितं गच्छन्तमम्भोनिधिम् ॥ ०८-०४","iast":"vittaṃ dehi guṇānviteṣu matimanyatra dehi kacit\nprāptaṃ vārinidherjalaṃ ghanamukhe mādhuryayuktaṃ sadā .\njīvānsthāvarajaṃgamāṃśca sakalānsaṃjīvaya bhūmaṇḍalaṃ\nbhūyaḥ paśya tadeva koṭiguṇitaṃ gacchantamambhonidhim .. 08-04","meaning":"Give wealth to the worthy, not the unworthy; water given to clouds returns multiplied as rain that nourishes the world.","source":"Chanakya Nīti 08-04"},{"slokaNo":"08-05","chapter":"8","verse":"5","variant":"","devanagari":"चाण्डालानां सहस्रैश्च सूरिभिस्तत्त्वदर्शिभिः ।\nएको हि यवनः प्रोक्तो न नीचो यवनात्परः ॥ ०८-०५","iast":"cāṇḍālānāṃ sahasraiśca sūribhistattvadarśibhiḥ .\neko hi yavanaḥ prokto na nīco yavanātparaḥ .. 08-05","meaning":"The verse reflects an old social judgment that places the yavana below even many outcastes.","source":"Chanakya Nīti 08-05"},{"slokaNo":"08-06","chapter":"8","verse":"6","variant":"","devanagari":"तैलाभ्यङ्गे चिताधूमे मैथुने क्षौरकर्मणि ।\nतावद्भवति चाण्डालो यावत्स्नानं न चाचरेत् ॥ ०८-०६","iast":"tailābhyaṅge citādhūme maithune kṣaurakarmaṇi .\ntāvadbhavati cāṇḍālo yāvatsnānaṃ na cācaret .. 08-06","meaning":"After oil massage, funeral smoke, intercourse, or shaving, one is considered impure until bathing.","source":"Chanakya Nīti 08-06"},{"slokaNo":"08-07","chapter":"8","verse":"7","variant":"","devanagari":"अजीर्णे भेषजं वारि जीर्णे वारि बलप्रदम् ।\nभोजने चामृतं वारि भोजनन्ते विषापहम् ॥ ०८-०७","iast":"ajīrṇe bheṣajaṃ vāri jīrṇe vāri balapradam .\nbhojane cāmṛtaṃ vāri bhojanante viṣāpaham .. 08-07","meaning":"Water is medicine for indigestion, strength after digestion, nectar during meals, and harmful immediately after meals.","source":"Chanakya Nīti 08-07"},{"slokaNo":"08-08","chapter":"8","verse":"8","variant":"","devanagari":"हतं ज्ञानं क्रियाहीनं हतश्चाज्ञानतो नरः ।\nहतं निर्णायकं सैन्यं स्त्रियो नष्टा ह्यभर्तृकाः ॥ ०८-०८","iast":"hataṃ jñānaṃ kriyāhīnaṃ hataścājñānato naraḥ .\nhataṃ nirṇāyakaṃ sainyaṃ striyo naṣṭā hyabhartṛkāḥ .. 08-08","meaning":"Knowledge unused is lost, ignorance ruins a person, an army without commander is lost, and a woman without husband is said to suffer.","source":"Chanakya Nīti 08-08"},{"slokaNo":"08-09","chapter":"8","verse":"9","variant":"","devanagari":"वृद्धकाले मृता भार्या बन्धुहस्तगतं धनम् ।\nभोजनं च पराधीनं तिस्र: पुंसां विडम्बना: ॥ ०८-०९","iast":"vṛddhakāle mṛtā bhāryā bandhuhastagataṃ dhanam .\nbhojanaṃ ca parādhīnaṃ tisra: puṃsāṃ viḍambanā: .. 08-09","meaning":"Three misfortunes for a man are losing his wife in old age, wealth held by relatives, and dependence on others for food.","source":"Chanakya Nīti 08-09"},{"slokaNo":"08-10","chapter":"8","verse":"10","variant":"","devanagari":"नाग्निहोत्रं विना वेदा न च दानं विना क्रिया ।\nन भावेन विना सिद्धिस्तस्माद्भावो हि कारणम् ॥ ०८-१०","iast":"nāgnihotraṃ vinā vedā na ca dānaṃ vinā kriyā .\nna bhāvena vinā siddhistasmādbhāvo hi kāraṇam .. 08-10","meaning":"Vedic recitation without sacrifice, rituals without gifts, and action without inner devotion do not bring success.","source":"Chanakya Nīti 08-10"},{"slokaNo":"08-11","chapter":"8","verse":"11","variant":"","devanagari":"न देवो विद्यते काष्ठे न पाषाणे न मृण्मये ।\nभावे हि विद्यते देवस्तस्माद्भावो हि कारणम् ॥ ०८-११","iast":"na devo vidyate kāṣṭhe na pāṣāṇe na mṛṇmaye .\nbhāve hi vidyate devastasmādbhāvo hi kāraṇam .. 08-11","meaning":"God is not truly in wood, stone, or clay by themselves; divinity is realized through faith and inner devotion.","source":"Chanakya Nīti 08-11"},{"slokaNo":"08-12","chapter":"8","verse":"12","variant":"","devanagari":"काष्ठपाषाणधातूनां कृत्वा भावेन सेवनम् ।\nश्रद्धया च तथा सिद्धिस्तस्य विष्णुप्रसादतः ॥ ०८-१२","iast":"kāṣṭhapāṣāṇadhātūnāṃ kṛtvā bhāvena sevanam .\nśraddhayā ca tathā siddhistasya viṣṇuprasādataḥ .. 08-12","meaning":"Serving images made of wood, stone, or metal with faith brings fulfillment by divine grace.","source":"Chanakya Nīti 08-12"},{"slokaNo":"08-13","chapter":"8","verse":"13","variant":"","devanagari":"शान्तितुल्यं तपो नास्ति न सन्तोषात्परं सुखम् ।\nन तृष्णाया: परो व्याधिर्न च धर्मो दयापर: ॥ ०८-१३ (दयासम: )","iast":"śāntitulyaṃ tapo nāsti na santoṣātparaṃ sukham .\nna tṛṣṇāyā: paro vyādhirna ca dharmo dayāpara: .. 08-13 (dayāsama: )","meaning":"No austerity equals peace, no happiness equals contentment, no disease equals craving, and no virtue equals mercy.","source":"Chanakya Nīti 08-13"},{"slokaNo":"08-14","chapter":"8","verse":"14","variant":"","devanagari":"क्रोधो वैवस्वतो राजा तृष्णा वैतरणी नदी ।\nविद्या कामदुघा धेनु: सन्तोषो नन्दनं वनम् ॥ ०८-१४","iast":"krodho vaivasvato rājā tṛṣṇā vaitaraṇī nadī .\nvidyā kāmadughā dhenu: santoṣo nandanaṃ vanam .. 08-14","meaning":"Anger is like death, craving like a hellish river, knowledge like a wish-fulfilling cow, and conten
