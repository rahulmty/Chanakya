tment like paradise.","source":"Chanakya Nīti 08-14"},{"slokaNo":"08-15","chapter":"8","verse":"15","variant":"","devanagari":"गुणो भूष्यते रूपं शीलं भूष्यते कुलम् ।\nसिधिर्भूष्यते विद्यां भोगो भूष्यते धनम् ॥ ०८-१५","iast":"guṇo bhūṣyate rūpaṃ śīlaṃ bhūṣyate kulam .\nsidhirbhūṣyate vidyāṃ bhogo bhūṣyate dhanam .. 08-15","meaning":"Good character ornaments beauty, conduct ornaments noble birth, accomplishment ornaments learning, and proper use ornaments wealth.","source":"Chanakya Nīti 08-15"},{"slokaNo":"08-16","chapter":"8","verse":"16","variant":"","devanagari":"निर्गुणस्य हतं रूपं दु:शीलस्य हतं कुलम् ।\nअसिद्धस्य हता विद्या ह्यभोगेन हतं धनम् ॥ ०८-१६","iast":"nirguṇasya hataṃ rūpaṃ du:śīlasya hataṃ kulam .\nasiddhasya hatā vidyā hyabhogena hataṃ dhanam .. 08-16","meaning":"Bad conduct spoils beauty, bad behavior spoils noble birth, lack of practice spoils learning, and misuse spoils wealth.","source":"Chanakya Nīti 08-16"},{"slokaNo":"08-17","chapter":"8","verse":"17","variant":"","devanagari":"शुद्धं भूमिगतं तोयं शुद्धा नारी पतिव्रता ।\nशुचि: क्षेमकरो राजा सन्तोषो ब्राह्मण: शुचि: ॥ ०८-१७","iast":"śuddhaṃ bhūmigataṃ toyaṃ śuddhā nārī pativratā .\nśuci: kṣemakaro rājā santoṣo brāhmaṇa: śuci: .. 08-17","meaning":"Water in the earth, a faithful wife, a people-serving king, and a content brāhmaṇa are considered pure.","source":"Chanakya Nīti 08-17"},{"slokaNo":"08-18","chapter":"8","verse":"18","variant":"","devanagari":"असन्तुष्टा द्विजा नष्टा: सन्तुष्टाश्च महीभृत: ।\nसलज्जा गणिका नष्टा निर्लज्जाश्च कुलाङ्गना ॥ ०८-१८","iast":"asantuṣṭā dvijā naṣṭā: santuṣṭāśca mahībhṛta: .\nsalajjā gaṇikā naṣṭā nirlajjāśca kulāṅganā .. 08-18","meaning":"A discontented brāhmaṇa, contented king, shy courtesan, and immodest housewife are each ruined by the wrong quality.","source":"Chanakya Nīti 08-18"},{"slokaNo":"08-19","chapter":"8","verse":"19","variant":"","devanagari":"किं कुलेन विशालेन विद्याहीनेन देहिनाम् ।\nदुष्कुलं चापि विदुषो देवैरपि स पूज्यते ॥ ०८-१९","iast":"kiṃ kulena viśālena vidyāhīnena dehinām .\nduṣkulaṃ cāpi viduṣo devairapi sa pūjyate .. 08-19","meaning":"High birth without learning is useless; a learned person of low birth may be honored even by the gods.","source":"Chanakya Nīti 08-19"},{"slokaNo":"08-20","chapter":"8","verse":"20","variant":"","devanagari":"विद्वान्प्रशस्यते लोके विद्वान् सर्वत्र पूज्यते ।\nविद्यया लभते सर्वं विद्या सर्वत्र पूज्यते ॥ ०८-२०","iast":"vidvānpraśasyate loke vidvān sarvatra pūjyate .\nvidyayā labhate sarvaṃ vidyā sarvatra pūjyate .. 08-20","meaning":"The learned are honored everywhere; learning itself commands respect in all places.","source":"Chanakya Nīti 08-20"},{"slokaNo":"08-21","chapter":"8","verse":"21","variant":"","devanagari":"ऋणकर्ता पिता शत्रुर्माता च व्यभिचारिणी ।\nभार्या रूपवती शत्रु: पुत्र: शत्रुरपण्डित: ॥ ०८-२१","iast":"ṛṇakartā pitā śatrurmātā ca vyabhicāriṇī .\nbhāryā rūpavatī śatru: putra: śatrurapaṇḍita: .. 08-21","meaning":"Beauty, youth, and noble birth without learning are like bright flowers without fragrance.","source":"Chanakya Nīti 08-21"},{"slokaNo":"08-22","chapter":"8","verse":"22","variant":"","devanagari":"मांसभक्ष्यै: सुरापानैर्मुखैश्चाक्षरवर्जितै: ।\nपशुभि: पुरुषाकारैर्भाराक्रान्ता हि मेदिनी ॥ ०८-२२","iast":"māṃsabhakṣyai: surāpānairmukhaiścākṣaravarjitai: .\npaśubhi: puruṣākārairbhārākrāntā hi medinī .. 08-22","meaning":"The earth is burdened by people who live like beasts through violence, intoxication, stupidity, and ignorance.","source":"Chanakya Nīti 08-22"},{"slokaNo":"08-23","chapter":"8","verse":"23","variant":"","devanagari":"अन्नहीनो दहेद्राष्ट्रं मन्त्रहीनश्च ऋत्विज: ।\nयजमानं दानहीनो नास्ति यज्ञसमो रिपु: ॥ ०८-२३","iast":"annahīno dahedrāṣṭraṃ mantrahīnaśca ṛtvija: .\nyajamānaṃ dānahīno nāsti yajñasamo ripu: .. 08-23","meaning":"A badly performed sacrifice harms the kingdom, priest, and patron; sacred action requires proper care.","source":"Chanakya Nīti 08-23"},{"slokaNo":"09-01","chapter":"9","verse":"1","variant":"","devanagari":"मुक्तिमिच्छसि चेत्तात् विषयान्विषवत्त्यज ।\nक्षमार्जवदयाशौचं सत्यं पीयूषवतिब ॥ ०९-०१","iast":"muktimicchasi cettāt viṣayānviṣavattyaja .\nkṣamārjavadayāśaucaṃ satyaṃ pīyūṣavatiba .. 09-01","meaning":"To seek liberation, abandon sense-objects like poison and cultivate patience, uprightness, mercy, purity, and truth.","source":"Chanakya Nīti 09-01"},{"slokaNo":"09-02","chapter":"9","verse":"2","variant":"","devanagari":"परस्परस्य मर्माणि ये भाषन्ते नराधमाः ।\nत एव विलयं यान्ति वल्मीकोदरसर्पवत् ॥ ०९-०२","iast":"parasparasya marmāṇi ye bhāṣante narādhamāḥ .\nta eva vilayaṃ yānti valmīkodarasarpavat .. 09-02","meaning":"Base people who reveal others’ secret faults destroy themselves like snakes entering anthills.","source":"Chanakya Nīti 09-02"},{"slokaNo":"09-03","chapter":"9","verse":"3","variant":"","devanagari":"गन्धः सुवर्णे फलमिक्सुदण्डे\nनाकरि पुष्पं खलु चन्दनस्य ।\nविद्वान्यनाद्यश्च नृपश्विरायुः\nधातुः पुरा कोऽपि न बुद्धिदोऽभूत् ॥ ०९-०३","iast":"gandhaḥ suvarṇe phalamiksudaṇḍe\nnākari puṣpaṃ khalu candanasya .\nvidvānyanādyaśca nṛpaśvirāyuḥ\ndhātuḥ purā ko'pi na buddhido'bhūt .. 09-03","meaning":"Brahmā did not give scent to gold, fruit to sugarcane, flowers to sandalwood, wealth to scholars, or long life to kings.","source":"Chanakya Nīti 09-03"},{"slokaNo":"09-04","chapter":"9","verse":"4","variant":"","devanagari":"सर्वौषधीनाममृता प्रधाना\nसर्वेषु सौख्येष्वशनं प्रधानम् ।\nसर्वेन्द्रियाणां नयनं प्रधानं\nसर्वेषु गात्रेषु शिरः प्रधानम् ॥ ०९-०४","iast":"sarvauṣadhīnāmamṛtā pradhānā\nsarveṣu saukhyeṣvaśanaṃ pradhānam .\nsarvendriyāṇāṃ nayanaṃ pradhānaṃ\nsarveṣu gātreṣu śiraḥ pradhānam .. 09-04","meaning":"Nectar is best among medicines, good food among pleasures, the eye among senses, and the head among limbs.","source":"Chanakya Nīti 09-04"},{"slokaNo":"09-05","chapter":"9","verse":"5","variant":"","devanagari":"दूतो न सञ्चरति खे न चलेच्च वार्ता\nपूर्वं न जल्पितमिदं न च सङ्गमोऽस्ति ।\nव्योम्नि स्थितं रविशशिग्रहणं प्रशस्तं\nजानाति यो द्विजवरः स कथं न विद्वान् ॥ ०९-०५","iast":"dūto na sañcarati khe na calecca vārtā\npūrvaṃ na jalpitamidaṃ na ca saṅgamo'sti .\nvyomni sthitaṃ raviśaśigrahaṇaṃ praśastaṃ\njānāti yo dvijavaraḥ sa kathaṃ na vidvān .. 09-05","meaning":"Since no messenger goes to the sky, the one who predicts eclipses must be highly learned.","source":"Chanakya Nīti 09-05"},{"slokaNo":"09-06","chapter":"9","verse":"6","variant":"","devanagari":"विद्यार्थी सेवकः पान्थः क्षुधार्तो भयकातरः ।\nभाण्डारी प्रतिहारी च सप्त सुप्तान्प्रबोधयेत् ॥ ०९-०६","iast":"vidyārthī sevakaḥ pānthaḥ kṣudhārto bhayakātaraḥ .\nbhāṇḍārī pratihārī ca sapta suptānprabodhayet .. 09-06","meaning":"Wake a student, servant, traveler, hungry person, frightened person, treasury guard, and steward if they sleep.","source":"Chanakya Nīti 09-06"},{"slokaNo":"09-07","chapter":"9","verse":"7","variant":"","devanagari":"अहिं नृपं च शार्दूलं वृद्धं च बालकं तथा ।\nपरश्वानं च मूर्खं च सप्त सुप्तान्न बोधयेत् ॥ ०९-०७","iast":"ahiṃ nṛpaṃ ca śārdūlaṃ vṛddhaṃ ca bālakaṃ tathā .\nparaśvānaṃ ca mūrkhaṃ ca sapta suptānna bodhayet .. 09-07","meaning":"Do not wake a snake, king, tiger, wasp, child, another’s dog, or fool.","source":"Chanakya Nīti 09-07"},{"slokaNo":"09-08","chapter":"9","verse":"8","variant":"","devanagari":"अर्धाधीताश्च यैर्वेदास्तथा शूद्रान्नभोजनाः ।\nते द्विजाः किं करिष्यन्ति निर्विषा इव पन्नगाः ॥ ०९-०८","iast":"ardhādhītāśca yairvedāstathā śūdrānnabhojanāḥ .\nte dvijāḥ kiṃ kariṣyanti nirviṣā iva pannagāḥ .. 09-08","meaning":"Vedic learning pursued only for gain, and food taken unworthily, make spiritual power ineffective like a fangless snake.","source":"Chanakya Nīti 09-08"},{"slokaNo":"09-09","chapter":"9","verse":"9","variant":"","devanagari":"यस्मिन्नुष्टे भयं नास्ति तुष्टे नैव धनागमः ।\nनिग्रहोऽनुग्रहो नास्ति स रुष्टः किं करिष्यति ॥ ०९-०९","iast":"yasminnuṣṭe bhayaṃ nāsti tuṣṭe naiva dhanāgamaḥ .\nnigraho'nugraho nāsti sa ruṣṭaḥ kiṃ kariṣyati .. 09-09","meaning":"One who inspires no fear when angry and grants no favor when pleased cannot rule or protect.","source":"Chanakya Nīti 09-09"},{"slokaNo":"09-10","chapter":"9","verse":"10","variant":"","devanagari":"निर्विषेणापि सर्पेण कर्तव्या महती फणा ।\nविषमस्तु न चाप्यस्तु घटाटोपो भयंङ्करः ॥ ०९-१०","iast":"nirviṣeṇāpi sarpeṇa kartavyā mahatī phaṇā .\nviṣamastu na cāpyastu ghaṭāṭopo bhayaṃṅkaraḥ .. 09-10","meaning":"Even a non-poisonous snake should raise its hood; the appearance of strength can deter danger.","source":"Chanakya Nīti 09-10"},{"slokaNo":"09-11","chapter":"9","verse":"11","variant":"","devanagari":"प्रातर्द्यूतप्रसङ्गेन मध्याह्ने स्त्रीप्रसङ्गतः ।\nरात्रौ चौरप्रसङ्गेन कालो गच्छन्ति धीमताम् ॥ ०९-११","iast":"prātardyūtaprasaṅgena madhyāhne strīprasaṅgataḥ .\nrātrau cauraprasaṅgena kālo gacchanti dhīmatām .. 09-11","meaning":"Wise people spend time on sacred stories: Mahābhārata, Rāmāyaṇa, and divine narratives.","source":"Chanakya Nīti 09-11"},{"slokaNo":"09-12","chapter":"9","verse":"12","variant":"","devanagari":"स्वहस्तग्रथिता माला स्वहस्तघृष्टचन्दनम् ।\nस्वहस्तलिखितं स्तोत्रं शक्रस्यापि श्रियं हरेत् ॥ ०९-१२","iast":"svahastagrathitā mālā svahastaghṛṣṭacandanam .\nsvahastalikhitaṃ stotraṃ śakrasyāpi śriyaṃ haret .. 09-12","meaning":"Making garlands, sandal paste, or sacred texts with one’s own hands brings great merit.","source":"Chanakya Nīti 09-12"},{"slokaNo":"09-13","chapter":"9","verse":"13","variant":"","devanagari":"इक्षुदण्डास्तिलाः शूद्राः कान्ता हेम च मेदिनी ।\nचन्दनं दधि ताम्बूलं मर्दनं गुणवर्धनम् ॥ ०९-१३","iast":"ikṣudaṇḍāstilāḥ śūdrāḥ kāntā hema ca medinī .\ncandanaṃ dadhi tāmbūlaṃ mardanaṃ guṇavardhanam .. 09-13","meaning":"A little knowledge gained through effort can shine; true refinement comes through practice and discipline.","source":"Chanakya Nīti 09-13"},{"slokaNo":"09-14","chapter":"9","verse":"14","variant":"","devanagari":"दह्यमानाः सुतीव्रेण नीचाः परयशोऽग्निना\nअशक्तास्तत्पदं गन्तुं ततो निन्दां प्रकुर्वते ।\nदरिद्रता धीरतया विराजतेकुवस्त्रता शुभ्रतया विराजते\nकदन्रता चोष्णतया विराजते कुरूपता शीलतया विराजते ॥ ०९-१४","iast":"dahyamānāḥ sutīvreṇa nīcāḥ parayaśo'gninā\naśaktāstatpadaṃ gantuṃ tato nindāṃ prakurvate .\ndaridratā dhīratayā virājatekuvastratā śubhratayā virājate\nkadanratā coṣṇatayā virājate kurūpatā śīlatayā virājate .. 09-14","meaning":"Poverty is adorned by courage, worn clothes by cleanliness, poor food by warmth, and ugliness by good conduct.","source":"Chanakya Nīti 09-14"},{"slokaNo":"10-01","chapter":"10","verse":"1","variant":"","devanagari":"धनहीनो न हीनश्च धनिकः स सुनिश्चयः ।\nविद्यारत्नेन हीनो यः स हीनः सर्ववस्तुषु ॥ १०-०१","iast":"dhanahīno na hīnaśca dhanikaḥ sa suniścayaḥ .\nvidyāratnena hīno yaḥ sa hīnaḥ sarvavastuṣu .. 10-01","meaning":"A person without wealth is not truly poor if learned; one without learning is poor in every way.","source":"Chanakya Nīti 10-01"},{"slokaNo":"10-02","chapter":"10","verse":"2","variant":"","devanagari":"दृष्टिपूतं न्यसेत्पादं वस्त्रपूतं पिबेज्ज लम् ।\nशास्त्रपूतं वदेद्वाक्यं मनःपूतं समाचरेत् ॥ १०-०२","iast":"dṛṣṭipūtaṃ nyasetpādaṃ vastrapūtaṃ pibejja lam .\nśāstrapūtaṃ vadedvākyaṃ manaḥpūtaṃ samācaret .. 10-02","meaning":"Step carefully, drink filtered water, speak according to śāstra, and act after thoughtful consideration.","source":"Chanakya Nīti 10-02"},{"slokaNo":"10-03","chapter":"10","verse":"3","variant":"","devanagari":"सुखार्थी चेत्त्यजेद्विद्यां विद्यार्थी चेत्त्यजेत्सुखम् ।\nसुखार्थिनः कुतो विद्या सुखं विद्यार्थिनः कुतः ॥ १०-०३","iast":"sukhārthī cettyajedvidyāṃ vidyārthī cettyajetsukham .\nsukhārthinaḥ kuto vidyā sukhaṃ vidyārthinaḥ kutaḥ .. 10-03","meaning":"One who wants sensual pleasure must give up learning; one who seeks learning must give up indulgence.","source":"Chanakya Nīti 10-03"},{"slokaNo":"10-04","chapter":"10","verse":"4","variant":"","devanagari":"कवयः किं न पश्यन्ति किं न भक्षन्ति वायसाः ।\nमद्यपाः किं न जल्पन्ति किं न कुर्वन्ति योषितः ॥ १०-०४","iast":"kavayaḥ kiṃ na paśyanti kiṃ na bhakṣanti vāyasāḥ .\nmadyapāḥ kiṃ na jalpanti kiṃ na kurvanti yoṣitaḥ .. 10-04","meaning":"Poets observe everything, women can do anything, drunkards say anything, and crows eat anything.","source":"Chanakya Nīti 10-04"},{"slokaNo":"10-05","chapter":"10","verse":"5","variant":"","devanagari":"रङ्कं करोति राजानं राजानं रङ्कमेव च ।\nधनिनां निर्धनं चैव निर्धनं धनिनं विधिः ॥ १०-०५","iast":"raṅkaṃ karoti rājānaṃ rājānaṃ raṅkameva ca .\ndhanināṃ nirdhanaṃ caiva nirdhanaṃ dhaninaṃ vidhiḥ .. 10-05","meaning":"Fate can make a beggar a king or a king a beggar, and can make the rich poor or the poor rich.","source":"Chanakya Nīti 10-05"},{"slokaNo":"10-06","chapter":"10","verse":"6","variant":"","devanagari":"लुब्धानां याचकः शत्रुमूर्खाणां बोधको रिपुः ।\nजारस्त्रीणां पतिः शत्रौश्चौराणां चन्द्रमा रिपुः ॥ १०-०६","iast":"lubdhānāṃ yācakaḥ śatrumūrkhāṇāṃ bodhako ripuḥ .\njārastrīṇāṃ patiḥ śatrauścaurāṇāṃ candramā ripuḥ .. 10-06","meaning":"A beggar troubles a miser, a wise adviser troubles a fool, a husband troubles an adulteress, and the moon troubles a thief.","source":"Chanakya Nīti 10-06"},{"slokaNo":"10-07","chapter":"10","verse":"7","variant":"","devanagari":"येषां न विद्या न तपो न दानं\nज्ञानं न शीलां न गुणो न धर्मः ।\nते मर्त्यलोके भुवि भारभूता\nमनुष्यरूपेण मृगाश्चरन्ति ॥ १०-०७","iast":"yeṣāṃ na vidyā na tapo na dānaṃ\njñānaṃ na śīlāṃ na guṇo na dharmaḥ .\nte martyaloke bhuvi bhārabhūtā\nmanuṣyarūpeṇa mṛgāścaranti .. 10-07","meaning":"People without learning, austerity, knowledge, good conduct, virtue, or generosity are like beasts in human form.","source":"Chanakya Nīti 10-07"},{"slokaNo":"10-08","chapter":"10","verse":"8","variant":"","devanagari":"अन्तःसारविहीनानामुपदेशो न जायते ।\nमल्याचलसंसर्गान्न वेणुश्चन्दनायते ॥ १०-०८","iast":"antaḥsāravihīnānāmupadeśo na jāyate .\nmalyācalasaṃsargānna veṇuścandanāyate .. 10-08","meaning":"Instruction cannot help the empty-minded, just as bamboo does not become sandalwood by growing near sandalwood mountains.","source":"Chanakya Nīti 10-08"},{"slokaNo":"10-09","chapter":"10","verse":"9","variant":"","devanagari":"यस्य नास्ति स्वयं प्रज्ञा शास्त्रं तस्य करोति किम् ।\nलोचनाभ्यां विहीनस्य दर्पणः किं करिष्यति ॥ १०-०९","iast":"yasya nāsti svayaṃ prajñā śāstraṃ tasya karoti kim .\nlocanābhyāṃ vihīnasya darpaṇaḥ kiṃ kariṣyati .. 10-09","meaning":"Scripture is useless to one without understanding, just as a mirror is useless to the blind.","source":"Chanakya Nīti 10-09"},{"slokaNo":"10-10","chapter":"10","verse":"10","variant":"","devanagari":"दुर्जनं सज्जनं कर्तुमुपायो नहि भूतले ।\nअपानं शतधा धौतं न श्रेष्ठमिन्द्रियं भवेत् ॥ १०-१०","iast":"durjanaṃ sajjanaṃ kartumupāyo nahi bhūtale .\napānaṃ śatadhā dhautaṃ na śreṣṭhamindriyaṃ bhavet .. 10-10","meaning":"A bad person is not easily purified, just as a low part of the body remains low however often washed.","source":"Chanakya Nīti 10-10"},{"slokaNo":"10-11","chapter":"10","verse":"11","variant":"","devanagari":"आप्तद्वेषाद्भवेन्मृत्युः परद्वेषाद्धनक्षयः ।\nराजद्वेषाद्भवेन्नाशो ब्रह्मद्वेषात्कुलक्षयः ॥ १०-११","iast":"āptadveṣādbhavenmṛtyuḥ paradveṣāddhanakṣayaḥ .\nrājadveṣādbhavennāśo brahmadveṣātkulakṣayaḥ .. 10-11","meaning":"Offending relatives costs life, offending others costs wealth, offending a king costs everything, and offending a brāhmaṇa ruins the family.","source":"Chanakya Nīti 10-11"},{"slokaNo":"10-12","chapter":"10","verse":"12","variant":"","devanagari":"वरं वनं व्याघ्रगजेन्द्रसेवितं\nद्रुमालयं पत्रफलाम्बुसेवनम् ।\nतृणेषु शय्या शतजीर्णवल्कलं\nन बन्धुमध्ये धनहीनजीवनम् ॥ १०-१२","iast":"varaṃ vanaṃ vyāghragajendrasevitaṃ\ndrumālayaṃ patraphalāmbusevanam .\ntṛṇeṣu śayyā śatajīrṇavalkalaṃ\nna bandhumadhye dhanahīnajīvanam .. 10-12","meaning":"It is better to live simply in a forest than to live poor and humiliated among relatives.","source":"Chanakya Nīti 10-12"},{"slokaNo":"10-13","chapter":"10","verse":"13","variant":"","devanagari":"विप्रो वृक्षस्तस्य मूलं च सन्ध्या\nवेद: शाखा धर्मकर्माणि पत्रम् ।\nतस्मान्मूलं यत्नतो रक्षणीयं\nछिन्नं मूले नैव शाखा न पत्रम् ॥ १०-१३","iast":"vipro vṛkṣastasya mūlaṃ ca sandhyā\nveda: śākhā dharmakarmāṇi patram .\ntasmānmūlaṃ yatnato rakṣaṇīyaṃ\nchinnaṃ mūle naiva śākhā na patram .. 10-13","meaning":"A brāhmaṇa is like a tree whose roots are prayers, branches Vedic recitation, and leaves sacred actions; preserve the roots.","source":"Chanakya Nīti 10-13"},{"slokaNo":"10-14","chapter":"10","verse":"14","variant":"","devanagari":"माता च कमला देवी पिता देवो जनार्दन: ।\nबान्धवा विष्णुभक्ताश्च स्वदेशो भुवनत्रयम् ॥ १०-१४","iast":"mātā ca kamalā devī pitā devo janārdana: .\nbāndhavā viṣṇubhaktāśca svadeśo bhuvanatrayam .. 10-14","meaning":"The devotee sees Lakṣmī as mother, Viṣṇu as father, devotees as relatives, and the three worlds as homeland.","source":"Chanakya Nīti 10-14"},{"slokaNo":"10-15","chapter":"10","verse":"15","variant":"","devanagari":"एकवृक्षसमारूढा नानावर्णा विहङ्गमा: ।\nप्रभाते दिक्षु दशसु यान्ति का तत्र वेदना ॥ १०-१५","iast":"ekavṛkṣasamārūḍhā nānāvarṇā vihaṅgamā: .\nprabhāte dikṣu daśasu yānti kā tatra vedanā .. 10-15","meaning":"Birds gather on one tree at night and scatter in the morning; similarly, separation from loved ones is natural.","source":"Chanakya Nīti 10-15"},{"slokaNo":"10-16","chapter":"10","verse":"16","variant":"","devanagari":"बुद्धियस्य बलं तस्य निर्बुद्धेश्च कुतो बलम् ।\nवने सिंहो यदोन्मत्तः मशकेन निपातित: ॥ १०-१६","iast":"buddhiyasya balaṃ tasya nirbuddheśca kuto balam .\nvane siṃho yadonmattaḥ maśakena nipātita: .. 10-16","meaning":"Intelligence is true strength; without wisdom, even a mighty elephant can be defeated by a small creature.","source":"Chanakya Nīti 10-16"},{"slokaNo":"10-17","chapter":"10","verse":"17","variant":"","devanagari":"का चिन्ता मम जीवने यदि हरिविश्वम्भरो गीयते\nनो चेदर्क्षकजीवनाय जननीस्तन्यं कथं निर्ममे ।\nइत्यालोच्य मुहुर्मुहुर्यदुपते लक्ष्मीपते केवलं\nत्वत्पादाम्बुजसेवनेन सततं कालो मया नीयते ॥ १०-१७","iast":"kā cintā mama jīvane yadi hariviśvambharo gīyate\nno cedarkṣakajīvanāya jananīstanyaṃ kathaṃ nirmame .\nityālocya muhurmuhuryadupate lakṣmīpate kevalaṃ\ntvatpādāmbujasevanena satataṃ kālo mayā nīyate .. 10-17","meaning":"One who trusts Lord Viṣṇu as sustainer spends life serving His lotus feet without anxiety about livelihood.","source":"Chanakya Nīti 10-17"},{"slokaNo":"10-18","chapter":"10","verse":"18","variant":"","devanagari":"गीर्वाणवाणीषु विशिष्टबुद्धि-\nस्तथापि भाषान्तरलोलु TheSहम् ।\nयथा सुधायाममरेषु सत्यां\nस्वर्गाङ्गनानामधरासवे रुचि: ॥ १०-१८","iast":"gīrvāṇavāṇīṣu viśiṣṭabuddhi-\nstathāpi bhāṣāntaralolu TheSham .\nyathā sudhāyāmamareṣu satyāṃ\nsvargāṅganānāmadharāsave ruci: .. 10-18","meaning":"Even those expert in Sanskrit may delight in other languages, just as gods may enjoy nectar yet relish celestial lips.","source":"Chanakya Nīti 10-18"},{"slokaNo":"10-19","chapter":"10","verse":"19","variant":"","devanagari":"अन्नादशगुणं पिष्टं पिष्टादशगुणं पय: ।\nपयसोऽष्टगुणं मांसां मांसादशगुणं घृतम् ॥ १०-१९","iast":"annādaśaguṇaṃ piṣṭaṃ piṣṭādaśaguṇaṃ paya: .\npayaso'ṣṭaguṇaṃ māṃsāṃ māṃsādaśaguṇaṃ ghṛtam .. 10-19","meaning":"Flour is stronger than grain, milk stronger than flour, meat stronger than milk, and ghee stronger than meat.","source":"Chanakya Nīti 10-19"},{"slokaNo":"10-20","chapter":"10","verse":"20","variant":"","devanagari":"शोकन रोगा वर्धन्ते पयसा वर्धते तनु: ।\nघृतेन वर्धते वीर्यं मांसान्मांसं प्रवर्धते ॥ १०-२०","iast":"śokana rogā vardhante payasā vardhate tanu: .\nghṛtena vardhate vīryaṃ māṃsānmāṃsaṃ pravardhate .. 10-20","meaning":"Vegetables cause disease, milk strengthens the body, ghee nourishes vitality, and meat fattens flesh.","source":"Chanakya Nīti 10-20"},{"slokaNo":"11-01","chapter":"11","verse":"1","variant":"","devanagari":"दातृत्वं प्रियवक्तृत्वं धीरत्वमुचितज्ञता ।\nअभ्यासेन न लभ्यन्ते चत्वार: सहजा गुणा: ॥ ११-०१","iast":"dātṛtvaṃ priyavaktṛtvaṃ dhīratvamucitajñatā .\nabhyāsena na labhyante catvāra: sahajā guṇā: .. 11-01","meaning":"Generosity, sweet speech, courage, and proper conduct are innate qualities rather than things easily acquired.","source":"Chanakya Nīti 11-01"},{"slokaNo":"11-02","chapter":"11","verse":"2","variant":"","devanagari":"आत्मवर्गं परित्यज्य परवर्गं समाश्रयेत् ।\nस्वयमेव लयं याति यथा राजान्यधर्मत: ॥ ११-०२","iast":"ātmavargaṃ parityajya paravargaṃ samāśrayet .\nsvayameva layaṃ yāti yathā rājānyadharmata: .. 11-02","meaning":"One who abandons his own community for another perishes like a king who adopts an unrighteous path.","source":"Chanakya Nīti 11-02"},{"slokaNo":"11-03","chapter":"11","verse":"3","variant":"","devanagari":"हस्ती स्थूलतनु: स चाङ्कुशवश: किं हस्तिमात्रोऽङ्कुशो\nदीपे प्रज्वलिते प्रणश्यति तम: किं दीपमात्रं तम: ।\nवज्रेणापि हता: पतन्ति गिरय: किं वज्रमात्रं नगा-\nस्तेजो यस्य विराजते स बलवान्स्थूलेषु कः प्रत्ययः ॥ ११-०३","iast":"hastī sthūlatanu: sa cāṅkuśavaśa: kiṃ hastimātro'ṅkuśo\ndīpe prajvalite praṇaśyati tama: kiṃ dīpamātraṃ tama: .\nvajreṇāpi hatā: patanti giraya: kiṃ vajramātraṃ nagā-\nstejo yasya virājate sa balavānsthūleṣu kaḥ pratyayaḥ .. 11-03","meaning":"Power is not size: a goad controls an elephant, a lamp removes darkness, and a thunderbolt breaks a mountain.","source":"Chanakya Nīti 11-03"},{"slokaNo":"11-04","chapter":"11","verse":"4","variant":"","devanagari":"कलौ दशसहस्राणि हरिस्ट्यजति मेदिनीम् ।\nतदधं जाह्नवीतोयं तदधं ग्रामदेवताः ॥ ११-०४","iast":"kalau daśasahasrāṇi harisṭyajati medinīm .\ntadadhaṃ jāhnavītoyaṃ tadadhaṃ grāmadevatāḥ .. 11-04","meaning":"A small but potent thing can overcome a great one; true strength lies in effectiveness, not bulk.","source":"Chanakya Nīti 11-04"},{"slokaNo":"11-05","chapter":"11","verse":"5","variant":"","devanagari":"गृहासक्तस्य नो विद्या नो दया मांसभोजिनः ।\nद्रव्यलुब्धस्य नो सत्यं स्त्रीणस्य न पवित्रता ॥ ११-०५","iast":"gṛhāsaktasya no vidyā no dayā māṃsabhojinaḥ .\ndravyalubdhasya no satyaṃ strīṇasya na pavitratā .. 11-05","meaning":"Attachment to household life obstructs knowledge; meat-eating obstructs mercy; greed obstructs truth; impure habits obstruct purity.","source":"Chanakya Nīti 11-05"},{"slokaNo":"11-06","chapter":"11","verse":"6","variant":"","devanagari":"न दुर्जनः साधुदशामुपैति\nबहुप्रकारैरपि शिक्षयमाणः ।\nआमूलसिक्तः पयसा घृतेन\nन निम्बवृक्षो मधुरत्वमेति ॥ ११-०६","iast":"na durjanaḥ sādhudaśāmupaiti\nbahuprakārairapi śikṣayamāṇaḥ .\nāmūlasiktaḥ payasā ghṛtena\nna nimbavṛkṣo madhuratvameti .. 11-06","meaning":"A wicked person does not become good by instruction, just as neem does not become sweet even if watered with milk and ghee.","source":"Chanakya Nīti 11-06"},{"slokaNo":"11-07","chapter":"11","verse":"7","variant":"","devanagari":"अन्तर्गतमलो दुष्टस्तीर्थस्नानशतैरपि ।\nन शुध्यति यथा भाण्डं सुराया दाहितं च सत् ॥ ११-०७","iast":"antargatamalo duṣṭastīrthasnānaśatairapi .\nna śudhyati yathā bhāṇḍaṃ surāyā dāhitaṃ ca sat .. 11-07","meaning":"External bathing cannot cleanse mental impurity, just as a wine pot remains tainted even if emptied.","source":"Chanakya Nīti 11-07"},{"slokaNo":"11-08","chapter":"11","verse":"8","variant":"","devanagari":"न वेत्ति यो यस्य गुणप्रकर्ष\nस तं सदा निन्दति नात्र चित्रम् ।\nयथा किराती करिकुम्भलब्धां\nमुक्तां परित्यज्य बिभर्ति गुञ्जाम् ॥ ११-०८","iast":"na vetti yo yasya guṇaprakarṣa\nsa taṃ sadā nindati nātra citram .\nyathā kirātī karikumbhalabdhāṃ\nmuktāṃ parityajya bibharti guñjām .. 11-08","meaning":"The ignorant reject what they do not understand, like someone discarding a pearl and choosing a cheap seed.","source":"Chanakya Nīti 11-08"},{"slokaNo":"11-09","chapter":"11","verse":"9","variant":"","devanagari":"ये तु संवत्सरं पूर्णं नित्यं मौनेन भुञ्जते ।\nयुगकोटिसहस्रं तैः स्वर्गलोके महीयते ॥ ११-०९","iast":"ye tu saṃvatsaraṃ pūrṇaṃ nityaṃ maunena bhuñjate .\nyugakoṭisahasraṃ taiḥ svargaloke mahīyate .. 11-09","meaning":"One who eats silently with self-control for a year is said to gain great heavenly merit.","source":"Chanakya Nīti 11-09"},{"slokaNo":"11-10","chapter":"11","verse":"10","variant":"","devanagari":"कामक्रोधौ तथा लोभं स्वादृशृङ्गारकौतुके ।\nअतिनिद्रातिसेवे च विद्यार्थी ह्यष्ट वर्जयेत् ॥ ११-१०","iast":"kāmakrodhau tathā lobhaṃ svādṛśṛṅgārakautuke .\natinidrātiseve ca vidyārthī hyaṣṭa varjayet .. 11-10","meaning":"A student should give up lust, anger, greed, craving for sweets, vanity, excessive curiosity, oversleeping, and overexertion for comfort.","source":"Chanakya Nīti 11-10"},{"slokaNo":"11-11","chapter":"11","verse":"11","variant":"","devanagari":"अकृष्टफलमूलानि वनवासरतः सदा ।\nकुरुतेऽहरहः श्राद्धमृषिर्विप्रः स उच्यते ॥ ११-११","iast":"akṛṣṭaphalamūlāni vanavāsarataḥ sadā .\nkurute'harahaḥ śrāddhamṛṣirvipraḥ sa ucyate .. 11-11","meaning":"A disciplined seeker should live simply, restrain the senses, and dedicate energy to study and character.","source":"Chanakya Nīti 11-11"},{"slokaNo":"11-12","chapter":"11","verse":"12","variant":"","devanagari":"एकाहारेण सन्तुष्टः षट्कर्मनिरतः सदा ।\nऋतुकालाभिगामी च स विप्रो द्विज उच्यते ॥ ११-१२","iast":"ekāhāreṇa santuṣṭaḥ ṣaṭkarmanirataḥ sadā .\nṛtukālābhigāmī ca sa vipro dvija ucyate .. 11-12","meaning":"A true brāhmaṇa is disciplined in food, purified by rites, and restrained in family life.","source":"Chanakya Nīti 11-12"},{"slokaNo":"11-13","chapter":"11","verse":"13","variant":"","devanagari":"लौकिके कर्मणि रतः पशूनां परिपालकः ।\nवाणिज्यकृषिकर्मा यः स विप्रो वैश्य उच्यते ॥ ११-१३","iast":"laukike karmaṇi rataḥ paśūnāṃ paripālakaḥ .\nvāṇijyakṛṣikarmā yaḥ sa vipro vaiśya ucyate .. 11-13","meaning":"A brāhmaṇa absorbed in trade, cattle, and worldly business is called like a vaiśya.","source":"Chanakya Nīti 11-13"},{"slokaNo":"11-14","chapter":"11","verse":"14","variant":"","devanagari":"लाक्षादितैलनीलीनां कौसुम्भमधुसर्पिषाम् ।\nविक्रेता मद्यमांसानां स विप्रः शूद्र उच्यते ॥ ११-१४","iast":"lākṣāditailanīlīnāṃ kausumbhamadhusarpiṣām .\nvikretā madyamāṃsānāṃ sa vipraḥ śūdra ucyate .. 11-14","meaning":"A brāhmaṇa dealing in dye, oil, indigo, silk, honey, ghee, liquor, or meat is described as fallen to a lower occupation.","source":"Chanakya Nīti 11-14"},{"slokaNo":"11-15","chapter":"11","verse":"15","variant":"","devanagari":"परकार्यविहन्ता च दाम्भिकः स्वार्थसाधकः ।\nछली द्वेषी मृदुः क्रूरो विप्रो मार्जार उच्यते ॥ ११-१५","iast":"parakāryavihantā ca dāmbhikaḥ svārthasādhakaḥ .\nchalī dveṣī mṛduḥ krūro vipro mārjāra ucyate .. 11-15","meaning":"A hypocritical, selfish, deceitful person who speaks mildly while harming others is compared to a cat.","source":"Chanakya Nīti 11-15"},{"slokaNo":"11-16","chapter":"11","verse":"16","variant":"","devanagari":"वापीकूपतडागानामारामासुरवेश्मनाम् ।\nउच्छेदने निराशङ्कः स विप्रो म्लेच्छ उच्यते ॥ ११-१६","iast":"vāpīkūpataḍāgānāmārāmāsuraveśmanām .\nucchedane nirāśaṅkaḥ sa vipro mleccha ucyate .. 11-16","meaning":"One who destroys ponds, wells, tanks, gardens, or temples is called uncivilized.","source":"Chanakya Nīti 11-16"},{"slokaNo":"11-17","chapter":"11","verse":"17","variant":"","devanagari":"देवद्रव्यं गुरुद्रव्यं परदाराभिमर्शनम् ।\nनिर्वाहः सर्वभूतेषु विप्राण्डाल उच्यते ॥ ११-१७","iast":"devadravyaṃ gurudravyaṃ paradārābhimarśanam .\nnirvāhaḥ sarvabhūteṣu viprāṇḍāla ucyate .. 11-17","meaning":"One who steals sacred or teacher’s property, violates another’s wife, or lives without purity is considered deeply fallen.","source":"Chanakya Nīti 11-17"},{"slokaNo":"11-18","chapter":"11","verse":"18","variant":"","devanagari":"देयं भोज्यधनं धनं सुकृतिभिनों सञ्चयस्तस्य वै\nश्रीकर्णस्य बलेश्च विक्रमपतेरद्यापि कीर्तिः स्थिता ।\nअस्माकं मधुदानभोगरहितं नाथं चिरात्संचितं\nनिर्वाणादिति नैजपादयुगलं धर्षन्त्यहो मक्षिकाः ॥ ११-१८","iast":"deyaṃ bhojyadhanaṃ dhanaṃ sukṛtibhinoṃ sañcayastasya vai\nśrīkarṇasya baleśca vikramapateradyāpi kīrtiḥ sthitā .\nasmākaṃ madhudānabhogarahitaṃ nāthaṃ cirātsaṃcitaṃ\nnirvāṇāditi naijapādayugalaṃ dharṣantyaho makṣikāḥ .. 11-18","meaning":"Give surplus wealth in charity; hoarded wealth may be lost like honey taken from bees who neither enjoyed nor gave it.","source":"Chanakya Nīti 11-18"},{"slokaNo":"12-01","chapter":"12","verse":"1","variant":"","devanagari":"सानन्दं सदनं सुतास्तु सुधियः कान्ता प्रियालापिनी\nइच्छापूर्तिधनं स्वयोषिति रतिः स्वाज्ञापराः सेवकाः ।\nआतिथ्यं शिवपूजनं प्रतिदिनं मिष्टान्नपानं गृहे\nसाधोः संगममुपासते च सततं धन्यो गृहस्थाश्रमः ॥ १२-०१","iast":"sānandaṃ sadanaṃ sutāstu sudhiyaḥ kāntā priyālāpinī\nicchāpūrtidhanaṃ svayoṣiti ratiḥ svājñāparāḥ sevakāḥ .\nātithyaṃ śivapūjanaṃ pratidinaṃ miṣṭānnapānaṃ gṛhe\nsādhoḥ saṃgamamupāsate ca satataṃ dhanyo gṛhasthāśramaḥ .. 12-01","meaning":"Blessed is the householder whose home is peaceful, children talented, wife gentle, wealth sufficient, servants obedient, guests honored, God worshiped, food abundant, and good company present.","source":"Chanakya Nīti 12-01"},{"slokaNo":"12-02","chapter":"12","verse":"2","variant":"","devanagari":"आर्तेषु विप्रेषु दयान्वितश्च\nयच्छ्रद्धया स्वल्पमुपैति दानम् ।\nअनन्तपारमुपैति राजन्\nयद्दीयते तन्न लभेद्दिजेभ्यः ॥ १२-०२","iast":"ārteṣu vipreṣu dayānvitaśca\nyacchraddhayā svalpamupaiti dānam .\nanantapāramupaiti rājan\nyaddīyate tanna labheddijebhyaḥ .. 12-02","meaning":"A sincere gift to a worthy person in distress returns not equally but multiplied many times.","source":"Chanakya Nīti 12-02"},{"slokaNo":"12-03","chapter":"12","verse":"3","variant":"","devanagari":"दाक्षिण्यं स्वजने दया परजने शाठ्यं सदा दुर्जने\nप्रीतिः साधुजने स्मयः खलजने विद्वज्जने चार्जवम् ।\nशौर्यं शत्रुजने क्षमा गुरुजने नारीजने धूर्तता\nइत्थं ये पुरुषा कलासु कुशलास्तेष्वेव लोकस्थितिः ॥ १२-०३","iast":"dākṣiṇyaṃ svajane dayā parajane śāṭhyaṃ sadā durjane\nprītiḥ sādhujane smayaḥ khalajane vidvajjane cārjavam .\nśauryaṃ śatrujane kṣamā gurujane nārījane dhūrtatā\nitthaṃ ye puruṣā kalāsu kuśalāsteṣveva lokasthitiḥ .. 12-03","meaning":"Happy people are generous to kin, kind to strangers, distant from the wicked, loving to the good, shrewd with the base, frank with scholars, brave with enemies, humble with elders, and firm at home.","source":"Chanakya Nīti 12-03"},{"slokaNo":"12-04","chapter":"12","verse":"4","variant":"","devanagari":"हस्तौ दानविवर्जितौ श्रुतिपुटौ सारस्वतद्रोहिणौ\nनेत्रे साधुविलोकनेन रहिते पादौ न तीर्थ गतौ ।\nअन्यायार्जितवित्तपूर्णमुदरं गर्वेण तुङ्गं शिरो\nरे रे जम्बुक मुञ्च मुञ्च सहसा नीचं सुनिन्यं वपुः ॥ १२-०४","iast":"hastau dānavivarjitau śrutipuṭau sārasvatadrohiṇau\nnetre sādhuvilokanena rahite pādau na tīrtha gatau .\nanyāyārjitavittapūrṇamudaraṃ garveṇa tuṅgaṃ śiro\nre re jambuka muñca muñca sahasā nīcaṃ suninyaṃ vapuḥ .. 12-04","meaning":"A life without charity, learning, holy sight, pilgrimage, honest livelihood, and humility is spiritually polluted and worthless.","source":"Chanakya Nīti 12-04"},{"slokaNo":"12-05","chapter":"12","verse":"5","variant":"","devanagari":"येषां श्रीमद्यशोदासुतपदकमले नास्ति भक्तिर्नराणां\nयेषामाभीरकन्याप्रियगुणकथने नानुरक्ता रसज्ञा ।\nयेषां श्रीकृष्णलीलाललितरसकथासादरौ नैव कर्णौ\nधिक् तान् धिक् तान् धिगेतान् कथयति सततं कीर्तनस्थो मृदंगः ॥ १२-०५","iast":"yeṣāṃ śrīmadyaśodāsutapadakamale nāsti bhaktirnarāṇāṃ\nyeṣāmābhīrakanyāpriyaguṇakathane nānuraktā rasajñā .\nyeṣāṃ śrīkṛṣṇalīlālalitarasakathāsādarau naiva karṇau\ndhik tān dhik tān dhigetān kathayati satataṃ kīrtanastho mṛdaṃgaḥ .. 12-05","meaning":"The verse condemns those without devotion, love of divine praise, or eagerness to hear sacred stories.","source":"Chanakya Nīti 12-05"},{"slokaNo":"12-06","chapter":"12","verse":"6","variant":"","devanagari":"पत्रं नैव यदा करीलविटपे दोषो वसन्तस्य किं\nनोल्लूकोऽप्यवलोकते यदि दिवा सूर्यस्य किं दूषणम् ।\nवर्षा नैव पतन्ति चातकमुखे मेघस्य किं दूषणं\nयत्पूर्वं विधिना ललाटलिखितं तन्मार्जितुं कः क्षमः ॥ १२-०६","iast":"patraṃ naiva yadā karīlaviṭape doṣo vasantasya kiṃ\nnollūko'pyavalokate yadi divā sūryasya kiṃ dūṣaṇam .\nvarṣā naiva patanti cātakamukhe meghasya kiṃ dūṣaṇaṃ\nyatpūrvaṃ vidhinā lalāṭalikhitaṃ tanmārjituṃ kaḥ kṣamaḥ .. 12-06","meaning":"One cannot blame spring, sun, clouds, or fate for what destiny has not granted; what is written at birth cannot easily be erased.","source":"Chanakya Nīti 12-06"},{"slokaNo":"12-07","chapter":"12","verse":"7","variant":"","devanagari":"सत्सङ्गाद्भवति हि साधुना खलानां\nसाधूनां न हि खलसंगतः खलत्वम् ।\nआमोदं कुसुमभवं मृदेव धत्ते\nमृद्वन्थं नहि कुसुमानि धारयन्ति ॥ १२-०७","iast":"satsaṅgādbhavati hi sādhunā khalānāṃ\nsādhūnāṃ na hi khalasaṃgataḥ khalatvam .\nāmodaṃ kusumabhavaṃ mṛdeva dhatte\nmṛdvanthaṃ nahi kusumāni dhārayanti .. 12-07","meaning":"The wicked may improve in good company, but the good are not spoiled by wicked company, as a flower scents the earth without taking its smell.","source":"Chanakya Nīti 12-07"},{"slokaNo":"12-08","chapter":"12","verse":"8","variant":"","devanagari":"साधूनां दर्शनं पुण्यं तीर्थभूता हि साधवः ।\nकालेन फलते तीर्थं साधुसमागमः ॥ १२-०८","iast":"sādhūnāṃ darśanaṃ puṇyaṃ tīrthabhūtā hi sādhavaḥ .\nkālena phalate tīrthaṃ sādhusamāgamaḥ .. 12-08","meaning":"The sight of a saint is purifying; holy places purify gradually, but the saint purifies immediately.","source":"Chanakya Nīti 12-08"},{"slokaNo":"12-09","chapter":"12","verse":"9","variant":"","devanagari":"विप्रास्मिन्नगरे महान्कथय कस्तालद्भमानां गणः\nको दाता रजको ददाति वसनं प्रातर्गृहीत्वा निशि ।\nको दक्षः परवित्तदारहरणे सर्वोऽपि दक्षो जनः\nकस्माजीवसि हे सखे विषकृमिन्यायेन जीवाम्यहम् ॥ १२-०९","iast":"viprāsminnagare mahānkathaya kastāladbhamānāṃ gaṇaḥ\nko dātā rajako dadāti vasanaṃ prātargṛhītvā niśi .\nko dakṣaḥ paravittadāraharaṇe sarvo'pi dakṣo janaḥ\nkasmājīvasi he sakhe viṣakṛminyāyena jīvāmyaham .. 12-09","meaning":"In a corrupt town, greatness, charity, and skill may be inverted; a wise person survives there only with difficulty.","source":"Chanakya Nīti 12-09"},{"slokaNo":"12-10","chapter":"12","verse":"10","variant":"","devanagari":"न विप्रपादोदककर्दमाणि\nन वेदशास्त्रध्वनिगर्जितानि ।\nस्वाहास्वधाकारविवर्जितानि\nश्मशानतुल्यानि गृहाणि तानि ॥ १२-१०","iast":"na viprapādodakakardamāṇi\nna vedaśāstradhvanigarjitāni .\nsvāhāsvadhākāravivarjitāni\nśmaśānatulyāni gṛhāṇi tāni .. 12-10","meaning":"A house without honoring the learned, sacred recitation, and rites for gods and ancestors is like a cremation ground.","source":"Chanakya Nīti 12-10"},{"slokaNo":"12-11","chapter":"12","verse":"11","variant":"","devanagari":"सत्यं माता पिता ज्ञानं धर्मो भ्राता दया सखा ।\nशान्तिः पत्नी क्षमा पुत्रः षडेते मम बान्धवाः ॥ १२-११","iast":"satyaṃ mātā pitā jñānaṃ dharmo bhrātā dayā sakhā .\nśāntiḥ patnī kṣamā putraḥ ṣaḍete mama bāndhavāḥ .. 12-11","meaning":"Truth, knowledge, conduct, mercy, peace, and forgiveness are the true family of a saint.","source":"Chanakya Nīti 12-11"},{"slokaNo":"12-12","chapter":"12","verse":"12","variant":"","devanagari":"अनित्यानि शरीराणि विभवो नैव शाश्वतः ।\nनित्यं संनिहितो मृत्युः कर्तव्यो धर्मसङ्ग्रहः ॥ १२-१२","iast":"anityāni śarīrāṇi vibhavo naiva śāśvataḥ .\nnityaṃ saṃnihito mṛtyuḥ kartavyo dharmasaṅgrahaḥ .. 12-12","meaning":"The body perishes, wealth is unstable, and death is near; therefore one should promptly do meritorious deeds.","source":"Chanakya Nīti 12-12"},{"slokaNo":"12-13","chapter":"12","verse":"13","variant":"","devanagari":"निमन्त्रोत्सवा विप्रा गावो नवतृणोत्सवाः ।\nपत्युत्साहयुता भार्या अहं कृष्णचरणोत्सवः ॥ १२-१३","iast":"nimantrotsavā viprā gāvo navatṛṇotsavāḥ .\npatyutsāhayutā bhāryā ahaṃ kṛṣṇacaraṇotsavaḥ .. 12-13","meaning":"Each being delights in its own nature: brāhmaṇas in feasts, cows in grass, wives in husbands, and warriors in battle.","source":"Chanakya Nīti 12-13"},{"slokaNo":"12-14","chapter":"12","verse":"14","variant":"","devanagari":"मातृवत्परदारेषु परद्रव्येषु लोष्टवत् ।\nआत्मवत्सर्वभूतेषु यः पश्यति स पण्डितः ॥ १२-१४","iast":"mātṛvatparadāreṣu paradravyeṣu loṣṭavat .\nātmavatsarvabhūteṣu yaḥ paśyati sa paṇḍitaḥ .. 12-14","meaning":"One who sees another’s wife as mother, another’s wealth as dust, and others’ joy and sorrow as one’s own is truly wise.","source":"Chanakya Nīti 12-14"},{"slokaNo":"12-15","chapter":"12","verse":"15","variant":"","devanagari":"धर्मे तत्परता मुखे मधुरता दाने समुत्साहता\nमित्रेऽस्वच्छता गुरौ विनयता चित्तेऽतिमभीरता ।\nआचारे शुचिता गुणे रसिकता शास्त्रेषु विज्ञानता\nरूपे सुन्दरता शिवे भजनता त्वव्यस्ति भो राघव ॥ १२-१५","iast":"dharme tatparatā mukhe madhuratā dāne samutsāhatā\nmitre'svacchatā gurau vinayatā citte'timabhīratā .\nācāre śucitā guṇe rasikatā śāstreṣu vijñānatā\nrūpe sundaratā śive bhajanatā tvavyasti bho rāghava .. 12-15","meaning":"Virtue, pleasant speech, charity, sincerity, humility, calmness, purity, discernment, scriptural knowledge, beauty, and devotion are marks of excellence.","source":"Chanakya Nīti 12-15"},{"slokaNo":"12-16","chapter":"12","verse":"16","variant":"","devanagari":"काष्ठं कल्पतरुः सुमेरुरचलश्चिन्तामणिः प्रस्तरः\nसूर्यस्तीव्रकरः शशी क्षयकरः क्षारो हि वारां निधिः ।\nकामो नष्टतनुर्वलिर्दितिसुतो नित्यं पशुः कामगौ-\nनैतास्ते तुलयामि भो रघुपते कस्योपमा दीयते ॥ १२-१६","iast":"kāṣṭhaṃ kalpataruḥ sumeruracalaścintāmaṇiḥ prastaraḥ\nsūryastīvrakaraḥ śaśī kṣayakaraḥ kṣāro hi vārāṃ nidhiḥ .\nkāmo naṣṭatanurvalirditisuto nityaṃ paśuḥ kāmagau-\nnaitāste tulayāmi bho raghupate kasyopamā dīyate .. 12-16","meaning":"No worldly object can fully compare with the highest person, because every famous object has some limitation.","source":"Chanakya Nīti 12-16"},{"slokaNo":"12-17","chapter":"12","verse":"17","variant":"","devanagari":"विद्या मित्रं प्रवासे च भार्या मित्रं गृहेषु च ।\nव्याधितस्यौषधं मित्रं धर्मो मित्रं मृतस्य च ॥ १२-१७","iast":"vidyā mitraṃ pravāse ca bhāryā mitraṃ gṛheṣu ca .\nvyādhitasyauṣadhaṃ mitraṃ dharmo mitraṃ mṛtasya ca .. 12-17","meaning":"Learning helps while travelling, a wife at home, medicine in illness, and merit at death.","source":"Chanakya Nīti 12-17"},{"slokaNo":"12-18","chapter":"12","verse":"18","variant":"","devanagari":"विनयं राजपुत्रेभ्यः पण्डितेभ्यः सुभाषितम् ।\nअनृतं द्यूतकारेभ्यः स्त्रीभ्यः शिक्षेत कैतवम् ॥ १२-१८","iast":"vinayaṃ rājaputrebhyaḥ paṇḍitebhyaḥ subhāṣitam .\nanṛtaṃ dyūtakārebhyaḥ strībhyaḥ śikṣeta kaitavam .. 12-18","meaning":"Learn courtesy from princes, conversation from scholars, deceit from gamblers, and cunning from women—says the old maxim.","source":"Chanakya Nīti 12-18"},{"slokaNo":"12-19","chapter":"12","verse":"19","variant":"","devanagari":"अनालोक्य व्ययं कर्ता अनाथः कलहप्रियः ।\nआतुरः सर्वक्षेत्रेषु नरः शीघ्रं विनश्यति ॥ १२-१९","iast":"anālokya vyayaṃ kartā anāthaḥ kalahapriyaḥ .\nāturaḥ sarvakṣetreṣu naraḥ śīghraṃ vinaśyati .. 12-19","meaning":"The wasteful, homeless, quarrelsome, neglectful, and careless person soon comes to ruin.","source":"Chanakya Nīti 12-19"},{"slokaNo":"12-20","chapter":"12","verse":"20","variant":"","devanagari":"नाहारं चिन्तयेत्प्राज्ञो धर्ममेकं हि चिन्तयेत् ।\nआहारो हि मनुष्याणां जन्मना सह जायते ॥ १२-२०","iast":"nāhāraṃ cintayetprājño dharmamekaṃ hi cintayet .\nāhāro hi manuṣyāṇāṃ janmanā saha jāyate .. 12-20","meaning":"The wise should not worry about food but about dharma; food is allotted at birth.","source":"Chanakya Nīti 12-20"},{"slokaNo":"12-21","chapter":"12","verse":"21","variant":"","devanagari":"धनधान्यप्रयोगेषु विद्यासङ्ग्रहणे तथा ।\nआहारे व्यवहारे च त्यक्तलज्जः सुखी भवेत् ॥ १२-२१","iast":"dhanadhānyaprayogeṣu vidyāsaṅgrahaṇe tathā .\nāhāre vyavahāre ca tyaktalajjaḥ sukhī bhavet .. 12-21","meaning":"One who is not shy about earning wealth, grain, knowledge, and food becomes happy.","source":"Chanakya Nīti 12-21"},{"slokaNo":"12-22","chapter":"12","verse":"22","variant":"","devanagari":"जलविन्दुनिपातेन क्रमशः पूर्यते घटः ।\nस हेतुः सर्वविद्यानां धर्मस्य च धनस्य च ॥ १२-२२","iast":"jalavindunipātena kramaśaḥ pūryate ghaṭaḥ .\nsa hetuḥ sarvavidyānāṃ dharmasya ca dhanasya ca .. 12-22","meaning":"Drops fill a pot gradually; likewise knowledge, virtue, and wealth are gained little by little.","source":"Chanakya Nīti 12-22"},{"slokaNo":"12-23","chapter":"12","verse":"23","variant":"","devanagari":"वयसः परिणामेऽपि यः खलः खल एव सः ।\nसम्पकमपि माधुर्यं नोपयातीन्द्रवारुणम् ॥ १२-२३","iast":"vayasaḥ pariṇāme'pi yaḥ khalaḥ khala eva saḥ .\nsampakamapi mādhuryaṃ nopayātīndravāruṇam .. 12-23","meaning":"A fool remains a fool even in old age, as a bitter fruit does not become sweet when ripe.","source":"Chanakya Nīti 12-23"},{"slokaNo":"13-01","chapter":"13","verse":"1","variant":"","devanagari":"मुहूर्तमपि जीवेच्च नरः शुक्लेन कर्मणा ।\nन कल्पमपि कष्टेन लोकद्वयविरोधना ॥ १३-०१","iast":"muhūrtamapi jīvecca naraḥ śuklena karmaṇā .\nna kalpamapi kaṣṭena lokadvayavirodhanā .. 13-01","meaning":"Even a short life is worthwhile if spent in good deeds; a long life causing distress is useless.","source":"Chanakya Nīti 13-01"},{"slokaNo":"13-02","chapter":"13","verse":"2","variant":"","devanagari":"गते शोको न कर्तव्यो भविष्यं नैव चिन्तयेत् ।\nवर्तमानेन कालेन वर्तयन्ति विचक्षणाः ॥ १३-०२","iast":"gate śoko na kartavyo bhaviṣyaṃ naiva cintayet .\nvartamānena kālena vartayanti vicakṣaṇāḥ .. 13-02","meaning":"Do not grieve over the past or worry about the future; the discerning act in the present.","source":"Chanakya Nīti 13-02"},{"slokaNo":"13-03","chapter":"13","verse":"3","variant":"","devanagari":"स्वभावेन हि तुष्यन्ति देवाः सत्पुरुषाः पिता ।\nज्ञातयः स्नानपानाभ्यां वाक्यदानेन पण्डिताः ॥ १३-०३","iast":"svabhāvena hi tuṣyanti devāḥ satpuruṣāḥ pitā .\njñātayaḥ snānapānābhyāṃ vākyadānena paṇḍitāḥ .. 13-03","meaning":"Gods, good people, and fathers are pleased by nature; relatives by hospitality; scholars by wise conversation.","source":"Chanakya Nīti 13-03"},{"slokaNo":"13-04","chapter":"13","verse":"4","variant":"","devanagari":"आयुः कर्म च वित्तं च विद्या निधनमेव च ।\nपञ्चैतानि हि सृज्यन्ते गर्भस्थस्यैव देहिनः ॥ १३-०४ (4.1)","iast":"āyuḥ karma ca vittaṃ ca vidyā nidhanameva ca .\npañcaitāni hi sṛjyante garbhasthasyaiva dehinaḥ .. 13-04 (4.1)","meaning":"Lifespan, action, wealth, learning, and death are fixed while one is still in the womb.","source":"Chanakya Nīti 13-04"},{"slokaNo":"13-05","chapter":"13","verse":"5","variant":"","devanagari":"अहो बत विचित्राणि चरितानि महात्मनाम् ।\nलक्ष्मीं तृणाय मन्यन्ते तद्वारेण नमन्ति च ॥ १३-०५","iast":"aho bata vicitrāṇi caritāni mahātmanām .\nlakṣmīṃ tṛṇāya manyante tadvāreṇa namanti ca .. 13-05","meaning":"The ways of great people are strange: they treat wealth as straw, yet may bow under its responsibility.","source":"Chanakya Nīti 13-05"},{"slokaNo":"13-06","chapter":"13","verse":"6","variant":"","devanagari":"यस्य स्नेहो भयं तस्य स्नेहो दुःखस्य भाजनम् ।\nस्नेहमूलानि दुःखानि तानि त्यक्त्वा वसेत् सुखम् ॥ १३-०६","iast":"yasya sneho bhayaṃ tasya sneho duḥkhasya bhājanam .\nsnehamūlāni duḥkhāni tāni tyaktvā vaset sukham .. 13-06","meaning":"Attachment brings fear and sorrow; since sorrow is rooted in attachment, give it up to live happily.","source":"Chanakya Nīti 13-06"},{"slokaNo":"13-07","chapter":"13","verse":"7","variant":"","devanagari":"अनागतविधाता च प्रत्युत्पन्नमतिस्तथा ।\nद्वावेतौ सुखमेधेते यद्भविष्यो विनश्यति ॥ १३-०७","iast":"anāgatavidhātā ca pratyutpannamatistathā .\ndvāvetau sukhamedhete yadbhaviṣyo vinaśyati .. 13-07","meaning":"The planner and the quick-witted prosper; the one who merely waits on fate is ruined.","source":"Chanakya Nīti 13-07"},{"slokaNo":"13-08","chapter":"13","verse":"8","variant":"","devanagari":"राज्ञि धर्मिणि धर्मिष्ठाः पापे पापाः समे समाः ।\nराजामनुवर्तन्ते यथा राजा तथा प्रजाः ॥ १३-०८","iast":"rājñi dharmiṇi dharmiṣṭhāḥ pāpe pāpāḥ same samāḥ .\nrājāmanuvartante yathā rājā tathā prajāḥ .. 13-08","meaning":"As the ruler is righteous, sinful, or ordinary, so the subjects become; people follow the ruler.","source":"Chanakya Nīti 13-08"},{"slokaNo":"13-09","chapter":"13","verse":"9","variant":"","devanagari":"जीवन्तं मृतवन्मन्ये देहिनं धर्मवर्जितम् ।\nमृतो धर्मेण संयुक्तो दीर्घजीवी न संशयः ॥ १३-०९","iast":"jīvantaṃ mṛtavanmanye dehinaṃ dharmavarjitam .\nmṛto dharmeṇa saṃyukto dīrghajīvī na saṃśayaḥ .. 13-09","meaning":"One without dharma is dead while living; one who dies in dharma truly lives on.","source":"Chanakya Nīti 13-09"},{"slokaNo":"13-10","chapter":"13","verse":"10","variant":"","devanagari":"धर्मार्थकाममोक्षाणां यस्यैकोऽपि न विद्यते ।\nअजागलस्तनस्येव तस्य जन्म निरर्थकम् ॥ १३-१०","iast":"dharmārthakāmamokṣāṇāṃ yasyaiko'pi na vidyate .\najāgalastanasyeva tasya janma nirarthakam .. 13-10","meaning":"A life without dharma, wealth, desire, or liberation is useless, like useless nipples on a goat’s neck.","source":"Chanakya Nīti 13-10"},{"slokaNo":"13-12","chapter":"13","verse":"12","variant":"","devanagari":"बन्धाय विषयसङ्गो मुक्त्यै निर्विषयं मनः ।\nमन एव मनुष्याणां कारणं बन्धमोक्षयोः ॥ १३-१२","iast":"bandhāya viṣayasaṅgo muktyai nirviṣayaṃ manaḥ .\nmana eva manuṣyāṇāṃ kāraṇaṃ bandhamokṣayoḥ .. 13-12","meaning":"Attachment to sense-objects causes bondage; detachment brings liberation, so the mind alone binds or frees.","source":"Chanakya Nīti 13-12"},{"slokaNo":"13-13","chapter":"13","verse":"13","variant":"","devanagari":"देहाभिमाने गलितं ज्ञानेन परमात्मनि ।\nयत्र यत्र मनो याति तत्र तत्र समाधयः ॥ १३-१३","iast":"dehābhimāne galitaṃ jñānena paramātmani .\nyatra yatra mano yāti tatra tatra samādhayaḥ .. 13-13","meaning":"One who realizes the inner Self and gives up body-identification remains absorbed in spiritual steadiness.","source":"Chanakya Nīti 13-13"},{"slokaNo":"13-14","chapter":"13","verse":"14","variant":"","devanagari":"ईप्सितं मनसः सर्वं कस्य सम्पद्यते सुखम् ।\nदैवायत्तं यतः सर्वं तस्मात्सन्तोषमाश्रयेत् ॥ १३-१४","iast":"īpsitaṃ manasaḥ sarvaṃ kasya sampadyate sukham .\ndaivāyattaṃ yataḥ sarvaṃ tasmātsantoṣamāśrayet .. 13-14","meaning":"No one gets every desired happiness; all is under divine order, so learn contentment.","source":"Chanakya Nīti 13-14"},{"slokaNo":"13-15","chapter":"13","verse":"15","variant":"","devanagari":"यथा धेनुसहस्रेषु वत्सो गच्छति मातरम् ।\nतथा यच्च कृतं कर्म कर्तारमनुगच्छति ॥ १३-१५","iast":"yathā dhenusahasreṣu vatso gacchati mātaram .\ntathā yacca kṛtaṃ karma kartāramanugacchati .. 13-15","meaning":"A person’s deeds follow him just as a calf finds its mother among many cows.","source":"Chanakya Nīti 13-15"},{"slokaNo":"13-16","chapter":"13","verse":"16","variant":"","devanagari":"अनवस्थितकार्यस्य न जने न वने सुखम् ।\nजनो दहति संसर्गाद्वनं संगविवर्जनात् ॥ १३-१६","iast":"anavasthitakāryasya na jane na vane sukham .\njano dahati saṃsargādvanaṃ saṃgavivarjanāt .. 13-16","meaning":"The disorganized person is unhappy among people and in solitude; social friction burns him in society and helplessness burns him alone.","source":"Chanakya Nīti 13-16"},{"slokaNo":"13-17","chapter":"13","verse":"17","variant":"","devanagari":"खनित्वा हि खनित्रेण भूतले वारि विन्दति ।\nतथा गुरुगतां विद्यां शुश्रूषुरधिगच्छति ॥ १३-१७","iast":"khanitvā hi khanitreṇa bhūtale vāri vindati .\ntathā gurugatāṃ vidyāṃ śuśrūṣuradhigacchati .. 13-17","meaning":"As digging reveals underground water, serving the teacher reveals the teacher’s knowledge.","source":"Chanakya Nīti 13-17"},{"slokaNo":"13-18","chapter":"13","verse":"18","variant":"","devanagari":"कर्मायत्तं फलं पुंसां बुद्धिः कर्मानुसारिणी ।\nतथापि सुधियश्चार्या सुविचार्यैव कुर्वते ॥ १३-१८","iast":"karmāyattaṃ phalaṃ puṃsāṃ buddhiḥ karmānusāriṇī .\ntathāpi sudhiyaścāryā suvicāryaiva kurvate .. 13-18","meaning":"People receive results according to their actions and past impressions; the wise therefore act after careful reflection.","source":"Chanakya Nīti 13-18"},{"slokaNo":"13-19","chapter":"13","verse":"19","variant":"","devanagari":"सन्तोषस्त्रिषु कर्तव्यः स्वदारे भोजने धने ।\nत्रिषु चैव न कर्तव्योऽध्ययने जपदानयोः ॥ १३-१९","iast":"santoṣastriṣu kartavyaḥ svadāre bhojane dhane .\ntriṣu caiva na kartavyo'dhyayane japadānayoḥ .. 13-19","meaning":"Even the teacher of a single meaningful letter deserves reverence; ingratitude to such a teacher is a grave fault.","source":"Chanakya Nīti 13-19"},{"slokaNo":"13-20","chapter":"13","verse":"20","variant":"","devanagari":"एकाक्षरप्रदातारं यो गुरुं नाभिवन्दते ।\nश्वानयोनिशतं गत्वा चाण्डालेष्वभिजायते ॥ १३-२०","iast":"ekākṣarapradātāraṃ yo guruṃ nābhivandate .\nśvānayoniśataṃ gatvā cāṇḍāleṣvabhijāyate .. 13-20","meaning":"Mount Meru may shake and oceans may swell, but a saint does not abandon the righteous path.","source":"Chanakya Nīti 13-20"},{"slokaNo":"13-21","chapter":"13","verse":"21","variant":"","devanagari":"युगान्ते प्रचलेन्मेरुः कल्पान्ते सप्त सागराः ।\nसाधवः प्रतिपन्नार्थान्न चलन्ति कदाचन ॥ १३-२१","iast":"yugānte pracalenmeruḥ kalpānte sapta sāgarāḥ .\nsādhavaḥ pratipannārthānna calanti kadācana .. 13-21","meaning":"Food, water, and pleasant speech are the true jewels of earth; fools call stones jewels.","source":"Chanakya Nīti 13-21"},{"slokaNo":"14-01","chapter":"14","verse":"1","variant":"","devanagari":"पृथिव्यां त्रीणि रत्नानि जलमन्नं सुभाषितम् ।\nमूढैः पाषाणखण्डेषु रत्नसंज्ञा विधीयते ॥ १४-०१","iast":"pṛthivyāṃ trīṇi ratnāni jalamannaṃ subhāṣitam .\nmūḍhaiḥ pāṣāṇakhaṇḍeṣu ratnasaṃjñā vidhīyate .. 14-01","meaning":"The true jewels on earth are water, food, and good speech; fools mistakenly value stones as jewels.","source":"Chanakya Nīti 14-01"},{"slokaNo":"14-02","chapter":"14","verse":"2","variant":"","devanagari":"आत्मापराधवृक्षस्य फलान्येतानि देहिनाम् ।\nदारिद्र्यदुःखरोगाणि बन्धनव्यसनानि च ॥ १४-०२","iast":"ātmāparādhavṛkṣasya phalānyetāni dehinām .\ndāridryaduḥkharogāṇi bandhanavyasanāni ca .. 14-02","meaning":"Poverty, disease, sorrow, bondage, and misfortune are fruits of one’s own wrong actions.","source":"Chanakya Nīti 14-02"},{"slokaNo":"14-03","chapter":"14","verse":"3","variant":"","devanagari":"पुनर्वित्तं पुनर् The मित्रं पुनर्भार्या पुनर् मही ।\nएतत्सर्वं पुनर्लभ्यं न शरीरं पुनः पुनः ॥ १४-०३","iast":"punarvittaṃ punar The mitraṃ punarbhāryā punar mahī .\netatsarvaṃ punarlabhyaṃ na śarīraṃ punaḥ punaḥ .. 14-03","meaning":"Wealth, friends, wife, and kingdom can be regained, but the body once lost cannot be regained.","source":"Chanakya Nīti 14-03"},{"slokaNo":"14-04","chapter":"14","verse":"4","variant":"","devanagari":"बहूनां चैव सत्त्वानां समवायो रिपुञ्जयः ।\nवर्षाधाराधरो मेघस्तृणैरपि निवार्यते ॥ १४-०४","iast":"bahūnāṃ caiva sattvānāṃ samavāyo ripuñjayaḥ .\nvarṣādhārādharo meghastṛṇairapi nivāryate .. 14-04","meaning":"United groups can defeat enemies, just as many blades of grass can hold back heavy rain.","source":"Chanakya Nīti 14-04"},{"slokaNo":"14-05","chapter":"14","verse":"5","variant":"","devanagari":"जले तैलं खले गुह्यं पात्रे दानं मनागपि ।\nप्राज्ञे शास्त्रं स्वयं याति विस्तारं वस्तुशक्तितः ॥ १४-०५","iast":"jale tailaṃ khale guhyaṃ pātre dānaṃ manāgapi .\nprājñe śāstraṃ svayaṃ yāti vistāraṃ vastuśaktitaḥ .. 14-05","meaning":"Oil on water, secrets told to the wicked, gifts to the worthy, and teaching to the intelligent naturally spread.","source":"Chanakya Nīti 14-05"},{"slokaNo":"14-06","chapter":"14","verse":"6","variant":"","devanagari":"धर्माध्व्याने श्मशाने च रोगिणां या मतिर्भवेत् ।\nसा सदैव तिष्ठेच्चेत्को न मुच्येत बन्धनात् ॥ १४-०६","iast":"dharmādhvyāne śmaśāne ca rogiṇāṃ yā matirbhavet .\nsā sadaiva tiṣṭheccetko na mucyeta bandhanāt .. 14-06","meaning":"If the wisdom felt during religious teaching, at a cremation ground, or in sickness stayed always, who would not be liberated?","source":"Chanakya Nīti 14-06"},{"slokaNo":"14-07","chapter":"14","verse":"7","variant":"","devanagari":"उत्पन्नपश्चात्तापस्य बुद्धिर्भवति यादृशी ।\nतादृशी यदि पूर्वं स्यात्कस्य न स्यान्नमहोदयः ॥ १४-०७","iast":"utpannapaścāttāpasya buddhirbhavati yādṛśī .\ntādṛśī yadi pūrvaṃ syātkasya na syānnamahodayaḥ .. 14-07","meaning":"If the insight that comes after repentance came before action, who would not attain greatness?","source":"Chanakya Nīti 14-07"},{"slokaNo":"14-08","chapter":"14","verse":"8","variant":"","devanagari":"दाने तपसि शौर्ये वा विज्ञाने विनये नये ।\nविस्मयो नहि कर्तव्यो बहुरत्ना वसुन्धरा ॥ १४-०८","iast":"dāne tapasi śaurye vā vijñāne vinaye naye .\nvismayo nahi kartavyo bahuratnā vasundharā .. 14-08","meaning":"Do not be proud of charity, austerity, valor, learning, humility, or policy; the earth is full of rare gems.","source":"Chanakya Nīti 14-08"},{"slokaNo":"14-09","chapter":"14","verse":"9","variant":"","devanagari":"दूरस्थोऽपि न दूरस्थो यो यस्य मनसि स्थितः ।\nयो यस्य हृदये नास्ति समीपस्थोऽपि दूरतः ॥ १४-०९","iast":"dūrastho'pi na dūrastho yo yasya manasi sthitaḥ .\nyo yasya hṛdaye nāsti samīpastho'pi dūrataḥ .. 14-09","meaning":"One present in the heart is near even if far away; one absent from the heart is far even if nearby.","source":"Chanakya Nīti 14-09"},{"slokaNo":"14-10","chapter":"14","verse":"10","variant":"","devanagari":"यस्माच्च प्रियमिच्छेत्तु तस्य ब्रूयात्सदा प्रियम् ।\nव्याधो मृगवधं कर्तुं गीतं गायति सुस्वरम् ॥ १४-१०","iast":"yasmācca priyamicchettu tasya brūyātsadā priyam .\nvyādho mṛgavadhaṃ kartuṃ gītaṃ gāyati susvaram .. 14-10","meaning":"Speak pleasingly to one from whom you seek favor, just as a hunter sings sweetly to attract deer.","source":"Chanakya Nīti 14-10"},{"slokaNo":"14-11","chapter":"14","verse":"11","variant":"","devanagari":"अत्यासन्ना विनाशाय दूरस्था न फलप्रदा ।\nसेव्यतां मध्यभावेन राजा वह्निर्गुरुः स्त्रियः ॥ १४-११","iast":"atyāsannā vināśāya dūrasthā na phalapradā .\nsevyatāṃ madhyabhāvena rājā vahnirguruḥ striyaḥ .. 14-11","meaning":"Too much closeness destroys and too much distance gives no benefit; deal with king, fire, teacher, and women from a proper middle distance.","source":"Chanakya Nīti 14-11"},{"slokaNo":"14-12","chapter":"14","verse":"12","variant":"","devanagari":"अग्निरापः स्त्रियो मूर्खाः सर्पा राजकुलानि च ।\nनित्यं यत्लेन सेव्यानि सद्यः प्राणहराणि षट् ॥ १४-१२","iast":"agnirāpaḥ striyo mūrkhāḥ sarpā rājakulāni ca .\nnityaṃ yatlena sevyāni sadyaḥ prāṇaharāṇi ṣaṭ .. 14-12","meaning":"Fire, water, women, fools, snakes, and royal families must be approached carefully because they can quickly endanger life.","source":"Chanakya Nīti 14-12"},{"slokaNo":"14-13","chapter":"14","verse":"13","variant":"","devanagari":"स जीवति गुणा यस्य यस्य धर्मः स जीवति ।\nगुणधर्मविहीनस्य जीवितं निष्प्रयोजनम् ॥ १४-१३","iast":"sa jīvati guṇā yasya yasya dharmaḥ sa jīvati .\nguṇadharmavihīnasya jīvitaṃ niṣprayojanam .. 14-13","meaning":"One lives truly who has virtues and dharma; life without them is purposeless.","source":"Chanakya Nīti 14-13"},{"slokaNo":"14-14","chapter":"14","verse":"14","variant":"","devanagari":"यदीच्छसि वशीकर्तुं जगदेकेन कर्मणा ।\nपुरा पञ्चदशास्तेभ्यो गां चरन्ती निवारय ॥ १४-१४","iast":"yadīcchasi vaśīkartuṃ jagadekena karmaṇā .\npurā pañcadaśāstebhyo gāṃ carantī nivāraya .. 14-14","meaning":"To master the world, restrain the wandering fifteen: five sense objects, five sense organs, and five organs of action.","source":"Chanakya Nīti 14-14"},{"slokaNo":"14-15","chapter":"14","verse":"15","variant":"","devanagari":"प्रस्तावसदृशं वाक्यं प्रभावसदृशं प्रियम् ।\nआत्मशक्तिसमं कोपं यो जानाति स पण्डितः ॥ १४-१५","iast":"prastāvasadṛśaṃ vākyaṃ prabhāvasadṛśaṃ priyam .\nātmaśaktisamaṃ kopaṃ yo jānāti sa paṇḍitaḥ .. 14-15","meaning":"A wise person speaks suitably, shows affection according to ability, and knows the proper measure of anger.","source":"Chanakya Nīti 14-15"},{"slokaNo":"14-16","chapter":"14","verse":"16","variant":"","devanagari":"एक एव पदार्थस्तु त्रिधा भवति वीक्षितः ।\nकुणपं कामिनी मांसं योगिभिः कामिभिः श्वभिः ॥ १४-१६","iast":"eka eva padārthastu tridhā bhavati vīkṣitaḥ .\nkuṇapaṃ kāminī māṃsaṃ yogibhiḥ kāmibhiḥ śvabhiḥ .. 14-16","meaning":"The same object is viewed differently: a yogi sees a corpse, the sensual see a woman, and dogs see meat.","source":"Chanakya Nīti 14-16"},{"slokaNo":"14-17","chapter":"14","verse":"17","variant":"","devanagari":"सुसिद्धमौषधं धर्मं गृहच्छिद्रं च मैथुनम् ।\nकुभुक्तं कुश्रुतं चैव मतिमान्न प्रकाशयेत् ॥ १४-१७","iast":"susiddhamauṣadhaṃ dharmaṃ gṛhacchidraṃ ca maithunam .\nkubhuktaṃ kuśrutaṃ caiva matimānna prakāśayet .. 14-17","meaning":"The wise do not reveal powerful medicine, acts of charity, household faults, private intimacy, bad food, or bad words heard.","source":"Chanakya Nīti 14-17"},{"slokaNo":"14-18","chapter":"14","verse":"18","variant":"","devanagari":"तान्मौनेन नीयन्ते कोकिलैश्चैव वासराः ।\nयावत्सर्वजनानन्ददायिनी वाक्प्रवर्तते ॥ १४-१८","iast":"tānmaunena nīyante kokilaiścaiva vāsarāḥ .\nyāvatsarvajanānandadāyinī vākpravartate .. 14-18","meaning":"Cuckoos remain silent until their sweet voice can delight everyone; speak at the right time.","source":"Chanakya Nīti 14-18"},{"slokaNo":"14-19","chapter":"14","verse":"19","variant":"","devanagari":"धर्मं धनं च धान्यं च गुरोर्वचनमौषधम् ।\nसुगृहीतं च कर्तव्यमन्यथा तु न जीवति ॥ १४-१९","iast":"dharmaṃ dhanaṃ ca dhānyaṃ ca gurorvacanamauṣadham .\nsugṛhītaṃ ca kartavyamanyathā tu na jīvati .. 14-19","meaning":"Secure dharma, wealth, grain, the teacher’s words, and medicine well; without them life becomes difficult.","source":"Chanakya Nīti 14-19"},{"slokaNo":"14-20","chapter":"14","verse":"20","variant":"","devanagari":"त्यज दुर्जनसंसर्गं भज साधुसमागमम् ।\nकुरु पुण्यमहोरात्रं स्मर नित्यमनित्यतः ॥ १४-२०","iast":"tyaja durjanasaṃsargaṃ bhaja sādhusamāgamam .\nkuru puṇyamahorātraṃ smara nityamanityataḥ .. 14-20","meaning":"Leave wicked company, seek good company, do merit day and night, and remember the eternal while leaving the transient.","source":"Chanakya Nīti 14-20"},{"slokaNo":"15-01","chapter":"15","verse":"1","variant":"","devanagari":"यस्य चित्तं द्रवीभूतं कृपया सर्वजन्तुषु ।\nतस्य ज्ञानेन मोक्षेण किं जटाभस्मलेपनैः ॥ १५-०१","iast":"yasya cittaṃ dravībhūtaṃ kṛpayā sarvajantuṣu .\ntasya jñānena mokṣeṇa kiṃ jaṭābhasmalepanaiḥ .. 15-01","meaning":"For one whose heart melts with compassion for all beings, what need is there of outer marks, knowledge, or liberation rituals?","source":"Chanakya Nīti 15-01"},{"slokaNo":"15-02","chapter":"15","verse":"2","variant":"1","devanagari":"एकम्प्यक्षरं यस्तु गुरुः शिष्यं प्रबोधयेत् ।\nपृथिव्यां नास्ति तद्रव्यं यत्त्वा सोऽनृणी भवेत् ॥ १५-०२","iast":"ekampyakṣaraṃ yastu guruḥ śiṣyaṃ prabodhayet .\npṛthivyāṃ nāsti tadravyaṃ yattvā so'nṛṇī bhavet .. 15-02","meaning":"No gift can repay the debt owed to a teacher who imparts even a single letter of true knowledge.","source":"Chanakya Nīti 15-02"},{"slokaNo":"15-02","chapter":"15","verse":"2","variant":"2","devanagari":"खलानां कण्टकानां च द्विविधैव प्रतिक्रिया ।\nउपानन्मुखभङ्गो वा दूरतो वा विसर्जनम् ॥ १५-०२","iast":"khalānāṃ kaṇṭakānāṃ ca dvividhaiva pratikriyā .\nupānanmukhabhaṅgo vā dūrato vā visarjanam .. 15-02","meaning":"Remove thorns and wicked people firmly: protect yourself from thorns and humble the wicked so they stay away.","source":"Chanakya Nīti 15-02"},{"slokaNo":"15-04","chapter":"15","verse":"4","variant":"","devanagari":"कुचैलिनं दन्तमलोपधारिणं\nबह्वाशिनं निष्ठुरभाषिणं च ।\nसूर्योदये चास्तमिते शयानं\nविमुञ्चति श्रीर्यदि चक्रपाणिः ॥ १५-०४","iast":"kucailinaṃ dantamalopadhāriṇaṃ\nbahvāśinaṃ niṣṭhurabhāṣiṇaṃ ca .\nsūryodaye cāstamite śayānaṃ\nvimuñcati śrīryadi cakrapāṇiḥ .. 15-04","meaning":"Unclean clothing, dirty teeth, gluttony, harsh speech, and sleeping after sunrise drive away fortune.","source":"Chanakya Nīti 15-04"},{"slokaNo":"15-05","chapter":"15","verse":"5","variant":"","devanagari":"त्यजन्ति मित्राणि धनैर्विहीनं\nपुत्राश्च दाराश्च सुहृज्जनाश्च ।\nतमर्थवन्तं पुनराश्रयन्ति\nअर्थो हि लोके मनुष्यस्य बन्धुः ॥ १५-०५","iast":"tyajanti mitrāṇi dhanairvihīnaṃ\nputrāśca dārāśca suhṛjjanāśca .\ntamarthavantaṃ punarāśrayanti\nartho hi loke manuṣyasya bandhuḥ .. 15-05","meaning":"When wealth is lost, friends and relatives leave; when wealth returns, they return—so wealth acts like a powerful relation.","source":"Chanakya Nīti 15-05"},{"slokaNo":"15-06","chapter":"15","verse":"6","variant":"","devanagari":"अन्यायोपार्जितं द्रव्यं दश वर्षाणि तिष्ठति ।\nप्राप्ते चैकादशे वर्षे समूलं तद्विनश्यति ॥ १५-०६","iast":"anyāyopārjitaṃ dravyaṃ daśa varṣāṇi tiṣṭhati .\nprāpte caikādaśe varṣe samūlaṃ tadvinaśyati .. 15-06","meaning":"Sinfully gained wealth may remain for ten years, but in the eleventh it is destroyed with the original capital.","source":"Chanakya Nīti 15-06"},{"slokaNo":"15-07","chapter":"15","verse":"7","variant":"","devanagari":"अयुक्तं स्वामिनो युक्तं युक्तं नीचस्य दूषणम् ।\nअमृतं राहवे मृत्युर्विषं शङ्करभूषणम् ॥ १५-०७","iast":"ayuktaṃ svāmino yuktaṃ yuktaṃ nīcasya dūṣaṇam .\namṛtaṃ rāhave mṛtyurviṣaṃ śaṅkarabhūṣaṇam .. 15-07","meaning":"A wrong act by the great may be excused and a good act by the low may be criticized; status changes how actions are judged.","source":"Chanakya Nīti 15-07"},{"slokaNo":"15-08","chapter":"15","verse":"8","variant":"","devanagari":"तद्बोजनं यद्विभुक्तशेषं\nतत्सौहृदं यत्क्रियते परस्मिन् ।\nसा प्राज्ञता या न करोति पापं\nदम्भं विना यः क्रियते स धर्मः ॥ १५-०८","iast":"tadbojanaṃ yadvibhuktaśeṣaṃ\ntatsauhṛdaṃ yatkriyate parasmin .\nsā prājñatā yā na karoti pāpaṃ\ndambhaṃ vinā yaḥ kriyate sa dharmaḥ .. 15-08","meaning":"True food is sanctified leftovers, true friendship helps others, true wisdom avoids sin, and true charity is without show.","source":"Chanakya Nīti 15-08"},{"slokaNo":"15-09","chapter":"15","verse":"9","variant":"","devanagari":"मणिर्लुण्ठति पादाग्रे काचः शिरसि धार्यते ।\nक्रयविक्रयवेलायां काचः काचो मणिर्मणिः ॥ १५-०९","iast":"maṇirluṇṭhati pādāgre kācaḥ śirasi dhāryate .\nkrayavikrayavelāyāṃ kācaḥ kāco maṇirmaṇiḥ .. 15-09","meaning":"Without discernment, jewels lie in dust and glass sits on heads; true judgment restores each to its proper place.","source":"Chanakya Nīti 15-09"},{"slokaNo":"15-10","chapter":"15","verse":"10","variant":"","devanagari":"अनन्तशास्त्रं बहुलाश्च विद्याः\nस्वल्पश्च कालो बहुविघ्नता च ।\nयत्सारभूतं तदुपासनीयां\nहंसो यथा क्षीरमिवाम्बुमध्यात् ॥ १५-१०","iast":"anantaśāstraṃ bahulāśca vidyāḥ\nsvalpaśca kālo bahuvighnatā ca .\nyatsārabhūtaṃ tadupāsanīyāṃ\nhaṃso yathā kṣīramivāmbumadhyāt .. 15-10","meaning":"Śāstras and arts are endless, but life is short; choose the essence like a swan separating milk from water.","source":"Chanakya Nīti 15-10"},{"slokaNo":"15-11","chapter":"15","verse":"11","variant":"","devanagari":"दूरागंतं पधि श्रान्तं वृथा च गृहमागतम् ।\nअनर्चयित्वा यो भुङ्गे स वै चाण्डाल उच्यते ॥ १५-११","iast":"dūrāgaṃtaṃ padhi śrāntaṃ vṛthā ca gṛhamāgatam .\nanarcayitvā yo bhuṅge sa vai cāṇḍāla ucyate .. 15-11","meaning":"One who eats without feeding an unexpected tired guest is considered spiritually fallen.","source":"Chanakya Nīti 15-11"},{"slokaNo":"15-12","chapter":"15","verse":"12","variant":"","devanagari":"पठन्ति चतुरो वेदान्धर्मशास्त्राण्यनेकशः ।\nआत्मानं नैव जानन्ति दर्वी पाकरसं यथा ॥ १५-१२","iast":"paṭhanti caturo vedāndharmaśāstrāṇyanekaśaḥ .\nātmānaṃ naiva jānanti darvī pākarasaṃ yathā .. 15-12","meaning":"One may know many scriptures, but without self-realization he is like a ladle that stirs food without tasting it.","source":"Chanakya Nīti 15-12"},{"slokaNo":"15-13","chapter":"15","verse":"13","variant":"","devanagari":"धन्या द्विजमयी नौका विपरीता भवार्णवे ।\nतरन्त्यधोगताः सर्वे उपरिष्टाः पतन्त्यधः ॥ १५-१३","iast":"dhanyā dvijamayī naukā viparītā bhavārṇave .\ntarantyadhogatāḥ sarve upariṣṭāḥ patantyadhaḥ .. 15-13","meaning":"Those who cross life’s ocean by taking shelter of a true brāhmaṇa are blessed; such a guide is like a boat.","source":"Chanakya Nīti 15-13"},{"slokaNo":"15-14","chapter":"15","verse":"14","variant":"","devanagari":"अय Theमृतनिधानं नायकऽप्योषधीनाम्\nअमृतमयशरीरः कान्तियुक्तोऽपि चन्द्रः ।\nभवतिविगतरश्मिमण्डलं प्राप्य भानोः\nपरसदननिविष्टः को लघुत्वं न याति ॥ १५-१४","iast":"aya Themṛtanidhānaṃ nāyaka'pyoṣadhīnām\namṛtamayaśarīraḥ kāntiyukto'pi candraḥ .\nbhavativigataraśmimaṇḍalaṃ prāpya bhānoḥ\nparasadananiviṣṭaḥ ko laghutvaṃ na yāti .. 15-14","meaning":"The moon loses radiance when near the sun; similarly a person may feel diminished while living in another’s house.","source":"Chanakya Nīti 15-14"},{"slokaNo":"15-15","chapter":"15","verse":"15","variant":"","devanagari":"अलिरयं नलिनीदलमध्यगः\nकमलिनीमकरन्दमदालसः ।\nविधिवशात्परदेशमुपागतः\nकुटजपुष्परसं बहु मन्यते ॥ १५-१५","iast":"alirayaṃ nalinīdalamadhyagaḥ\nkamalinīmakarandamadālasaḥ .\nvidhivaśātparadeśamupāgataḥ\nkuṭajapuṣparasaṃ bahu manyate .. 15-15","meaning":"A bee used to lotus nectar may value the kutaja flower when stranded elsewhere; circumstances change what one appreciates.","source":"Chanakya Nīti 15-15"},{"slokaNo":"15-16","chapter":"15","verse":"16","variant":"","devanagari":"पीतः क्रुद्धेन तातश्चरणतलहतो वल्लभो येन रोषा\nदाबाल्याद्विप्रवर्यैः स्ववदनविवरे धार्यते वैरिणी मे ।\nगेहं मे छेदयन्ति प्रतिदिवसमुमाकान्तपूजानिमित्तं\nतस्मात्खन्ना सदाहं द्विजकुलनिलयं नाथ युक्तं त्यजामि ॥ १५-१६","iast":"pītaḥ kruddhena tātaścaraṇatalahato vallabho yena roṣā\ndābālyādvipravaryaiḥ svavadanavivare dhāryate vairiṇī me .\ngehaṃ me chedayanti pratidivasamumākāntapūjānimittaṃ\ntasmātkhannā sadāhaṃ dvijakulanilayaṃ nātha yuktaṃ tyajāmi .. 15-16","meaning":"Lakṣmī explains mythically why she fears living with brāhmaṇas: sages and rituals have troubled her family and symbols.","source":"Chanakya Nīti 15-16"},{"slokaNo":"15-17","chapter":"15","verse":"17","variant":"","devanagari":"बन्धनानि खलु सन्ति बहूनि\nप्रेमरज्जुकृतबन्धनमन्यत् ।\nदारुभेदनिपुणोऽपि षडंघ्रि-\nर्निष्कियो भवति पंकजकोशेः ॥ १५-१७","iast":"bandhanāni khalu santi bahūni\npremarajjukṛtabandhanamanyat .\ndārubhedanipuṇo'pi ṣaḍaṃghri-\nrniṣkiyo bhavati paṃkajakośeḥ .. 15-17","meaning":"Many bonds exist, but love is strongest; even a bee that pierces wood is trapped inside a closing lotus.","source":"Chanakya Nīti 15-17"},{"slokaNo":"15-18","chapter":"15","verse":"18","variant":"","devanagari":"छिन्नोऽपि चन्दनतरुर्न जहाति गन्धं\nवृद्धोऽपि वारणपतिर्न जहाति लीलाम ।\nयन्त्रार्पितो मधुरतां न जहाति चक्षुः\nक्षीणेऽपि न त्यजति शीलगुणान्कुलीनः ॥ १५-१८","iast":"chinno'pi candanatarurna jahāti gandhaṃ\nvṛddho'pi vāraṇapatirna jahāti līlāma .\nyantrārpito madhuratāṃ na jahāti cakṣuḥ\nkṣīṇe'pi na tyajati śīlaguṇānkulīnaḥ .. 15-18","meaning":"Sandal keeps fragrance when cut, an elephant keeps playfulness when old, sugarcane keeps sweetness when pressed, and noble people keep virtue in poverty.","source":"Chanakya Nīti 15-18"},{"slokaNo":"15-19","chapter":"15","verse":"19","variant":"","devanagari":"उर्व्या कोऽपि महीधरो लघुतरी दोर्भ्यां धृतो\nलीलया तेन त्वं दिवि भूतले च सततं गोवर्धनो गीयसे ।\nत्वां त्रैलोक्यधरं वहामि कुचयोर्ग्रे न तद्रण्यते\nकिं वा केशव भाषणेन बहुना पुण्यैर्यशो लभ्यते ॥ १५-१९","iast":"urvyā ko'pi mahīdharo laghutarī dorbhyāṃ dhṛto\nlīlayā tena tvaṃ divi bhūtale ca satataṃ govardhano gīyase .\ntvāṃ trailokyadharaṃ vahāmi kucayorgre na tadraṇyate\nkiṃ vā keśava bhāṣaṇena bahunā puṇyairyaśo labhyate .. 15-19","meaning":"A noble person retains inner greatness even under hardship; essential nature is not lost through external pressure.","source":"Chanakya Nīti 15-19"},{"slokaNo":"16-01","chapter":"16","verse":"1","variant":"","devanagari":"न ध्यातं पदमीश्वरस्य विधिवत्सारविच्छत्तये\nस्वर्गद्वारकापाटपाटनपटुध्र्मोऽपि नोपार्जितः ।\nनारीपीनपयोधरोरुयुगला स्वप्नेऽपि नालिंगितं\nमातुः केवलमेव यौवनवनाच्छेदे कुठारा वयम् ॥ १६-०१","iast":"na dhyātaṃ padamīśvarasya vidhivatsāravicchattaye\nsvargadvārakāpāṭapāṭanapaṭudhrmo'pi nopārjitaḥ .\nnārīpīnapayodharoruyugalā svapne'pi nāliṃgitaṃ\nmātuḥ kevalameva yauvanavanācchede kuṭhārā vayam .. 16-01","meaning":"A person’s inner qualities, not outer show, determine true worth and conduct.","source":"Chanakya Nīti 16-01"},{"slokaNo":"16-02","chapter":"16","verse":"2","variant":"","devanagari":"जल्पन्ति सार्धमन्येन पश्यन्त्यन्यं सविभ्रमाः ।\nहृदये चिन्तयन्त्यन्यं न स्त्रीणामेकतो रतिः ॥ १६-०२","iast":"jalpanti sārdhamanyena paśyantyanyaṃ savibhramāḥ .\nhṛdaye cintayantyanyaṃ na strīṇāmekato ratiḥ .. 16-02","meaning":"The verse portrays an unsteady heart as divided among words, glances, and thoughts.","source":"Chanakya Nīti 16-02"},{"slokaNo":"16-03","chapter":"16","verse":"3","variant":"","devanagari":"यो मोहान्मन्यते मूढो रत्तेयं मयि कामिनी ।\nस तस्या वशगो भूत्वा नृत्येत् क्रीडाशकुन्तवत् ॥ १६-०३","iast":"yo mohānmanyate mūḍho ratteyaṃ mayi kāminī .\nsa tasyā vaśago bhūtvā nṛtyet krīḍāśakuntavat .. 16-03","meaning":"A fool who thinks a charming woman loves him becomes her servant and dances as if tied by a string.","source":"Chanakya Nīti 16-03"},{"slokaNo":"16-04","chapter":"16","verse":"4","variant":"","devanagari":"कोऽर्थान्प्राप्य न गर्वितो विषयिणः कस्यापदोऽस्तं गताः\nस्त्रीभिः कस्य न खण्डितं भुवि मनः को नाम राजप्रियः ।\nकः कालस्य न गोचरत्वमगमत् कोऽर्थी गतो गौरवं\nको वा दुर्जनदुर्गमेषु पतितः क्षेमेण यातः पथि ॥ १६-०४","iast":"ko'rthānprāpya na garvito viṣayiṇaḥ kasyāpado'staṃ gatāḥ\nstrībhiḥ kasya na khaṇḍitaṃ bhuvi manaḥ ko nāma rājapriyaḥ .\nkaḥ kālasya na gocaratvamagamat ko'rthī gato gauravaṃ\nko vā durjanadurgameṣu patitaḥ kṣemeṇa yātaḥ pathi .. 16-04","meaning":"Wealth often brings pride, desire brings trouble, time conquers all, and company with the wicked never brings happiness.","source":"Chanakya Nīti 16-04"},{"slokaNo":"16-05","chapter":"16","verse":"5","variant":"","devanagari":"न निर्मितो न चैव न दृष्टपूर्वो\nन श्रूयते हेममयः कुरंगः ।\nतथाऽपि तृष्णा रघुनन्दनस्य\nविनाशकाले विपरीतबुद्धिः ॥ १६-०५","iast":"na nirmito na caiva na dṛṣṭapūrvo\nna śrūyate hemamayaḥ kuraṃgaḥ .\ntathā'pi tṛṣṇā raghunandanasya\nvināśakāle viparītabuddhiḥ .. 16-05","meaning":"Birth, status, and appearance do not guarantee greatness; merit alone makes a person truly high.","source":"Chanakya Nīti 16-05"},{"slokaNo":"16-06","chapter":"16","verse":"6","variant":"","devanagari":"गुणैरुत्तमतां याति नोच्चैरासनसंस्थिताः ।\nप्रासादशिखरस्थोऽपि काकः किं गरुडायते ॥ १६-०६","iast":"guṇairuttamatāṃ yāti noccairāsanasaṃsthitāḥ .\nprāsādaśikharastho'pi kākaḥ kiṃ garuḍāyate .. 16-06","meaning":"A person becomes great by qualities, not by sitting in a high place; a crow on a tall building is not Garuḍa.","source":"Chanakya Nīti 16-06"},{"slokaNo":"16-07","chapter":"16","verse":"7","variant":"","devanagari":"गुणाः सर्वत्र पूज्यन्ते न महत्वोऽपि सम्पदः ।\nपूर्णेन्दुः किं तथा वन्यौ निष्कलङ्को यथा कृशः ॥ १६-०७","iast":"guṇāḥ sarvatra pūjyante na mahatvo'pi sampadaḥ .\npūrṇenduḥ kiṃ tathā vanyau niṣkalaṅko yathā kṛśaḥ .. 16-07","meaning":"Without good qualities, rank and appearance do not create real honor.","source":"Chanakya Nīti 16-07"},{"slokaNo":"16-08","chapter":"16","verse":"8","variant":"","devanagari":"परैरुक्तगुणो यस्तु निर्गुणोऽपि गुणी भवेत् ।\nइन्द्रोऽपि लघुतां याति स्वयं प्रख्यापितैर्गुणैः ॥ १६-०८","iast":"parairuktaguṇo yastu nirguṇo'pi guṇī bhavet .\nindro'pi laghutāṃ yāti svayaṃ prakhyāpitairguṇaiḥ .. 16-08","meaning":"Praise by others can raise a person, but self-praise lowers one even if he has great qualities.","source":"Chanakya Nīti 16-08"},{"slokaNo":"16-09","chapter":"16","verse":"9","variant":"","devanagari":"विवेकिनमनुप्राप्ता गुणा यान्ति मनोज्ञताम् ।\nसुतरां रत्नमाभाति चामीकरनियोजितम् ॥ १६-०९","iast":"vivekinamanuprāptā guṇā yānti manojñatām .\nsutarāṃ ratnamābhāti cāmīkaraniyojitam .. 16-09","meaning":"Good qualities in a discerning person shine like a bright gem set in gold.","source":"Chanakya Nīti 16-09"},{"slokaNo":"16-10","chapter":"16","verse":"10","variant":"","devanagari":"गुणैः सर्वज्ञतुल्योऽपि सीदत्येको निराश्रयः ।\nअनर्घ्यमपि माणिक्यं हेमाश्रयमपेक्षते ॥ १६-१०","iast":"guṇaiḥ sarvajñatulyo'pi sīdatyeko nirāśrayaḥ .\nanarghyamapi māṇikyaṃ hemāśrayamapekṣate .. 16-10","meaning":"Even great qualities need support; a precious gem still needs a proper setting.","source":"Chanakya Nīti 16-10"},{"slokaNo":"16-11","chapter":"16","verse":"11","variant":"","devanagari":"अतिक्लेशेन यद्रव्यमतिलोभेन यत्सुखम् ।\nशत्रूणां प्रणिपातेन ते ह्यर्था मा भवन्तु मे ॥ १६-११","iast":"atikleśena yadravyamatilobhena yatsukham .\nśatrūṇāṃ praṇipātena te hyarthā mā bhavantu me .. 16-11","meaning":"Wealth gained through suffering, unrighteousness, or flattery of enemies is not worth having.","source":"Chanakya Nīti 16-11"},{"slokaNo":"16-12","chapter":"16","verse":"12","variant":"","devanagari":"किं तया क्रियते लक्ष्म्या या वधूरिव केवला ।\nया तु वेश्येव सामान्या पथिकैरपि भुज्यते ॥ १६-१२","iast":"kiṃ tayā kriyate lakṣmyā yā vadhūriva kevalā .\nyā tu veśyeva sāmānyā pathikairapi bhujyate .. 16-12","meaning":"Wealth should be sought only in ways that preserve dignity, virtue, and self-respect.","source":"Chanakya Nīti 16-12"},{"slokaNo":"16-13","chapter":"16","verse":"13","variant":"1","devanagari":"धनेषु जीवितव्येषु स्त्रीषु चाहारकर्मसु ।\nअतृप्ताः प्राणिनः सर्वे याता यास्यन्ति यान्ति च ॥ १६-१३","iast":"dhaneṣu jīvitavyeṣu strīṣu cāhārakarmasu .\natṛptāḥ prāṇinaḥ sarve yātā yāsyanti yānti ca .. 16-13","meaning":"People have gone, are going, and will go unsatisfied with wealth, life, women, and food; craving is never fully satisfied.","source":"Chanakya Nīti 16-13"},{"slokaNo":"16-13","chapter":"16","verse":"13","variant":"2","devanagari":"प्रियवाक्यप्रदानेन सर्वे तुष्यन्ति जन्तवः ।\nतस्मात्तदेव वक्तव्यं वचने का दरिद्रता ॥ १६-१३","iast":"priyavākyapradānena sarve tuṣyanti jantavaḥ .\ntasmāttadeva vaktavyaṃ vacane kā daridratā .. 16-13","meaning":"All beings are pleased by kind words; speak pleasantly, for sweet speech costs nothing.","source":"Chanakya Nīti 16-13"},{"slokaNo":"16-14","chapter":"16","verse":"14","variant":"","devanagari":"क्षीयन्ते सर्वदानानि यज्ञहोमबलिक्रियाः ।\nन क्षीयते पात्रदानमभयं सर्वदेहिनाम् ॥ १६-१४","iast":"kṣīyante sarvadānāni yajñahomabalikriyāḥ .\nna kṣīyate pātradānamabhayaṃ sarvadehinām .. 16-14","meaning":"All sacrifices and ordinary gifts perish in result, but gifts to the worthy and protection to beings do not perish.","source":"Chanakya Nīti 16-14"},{"slokaNo":"16-15","chapter":"16","verse":"15","variant":"1","devanagari":"तृणं लघु तृणात्तूलं तूलादपि च याचकः ।\nवायुना किं न नीतोऽसौ मामयं याचयिष्यति ॥ १६-१५","iast":"tṛṇaṃ laghu tṛṇāttūlaṃ tūlādapi ca yācakaḥ .\nvāyunā kiṃ na nīto'sau māmayaṃ yācayiṣyati .. 16-15","meaning":"Grass is light, cotton lighter, and a beggar lighter still; even the wind avoids carrying him, fearing he will ask for alms.","source":"Chanakya Nīti 16-15"},{"slokaNo":"16-15","chapter":"16","verse":"15","variant":"2","devanagari":"वरं प्राणपरित्यागो मानभङ्गेन जीवनात् ।\nप्राणत्यागे क्षणं दुःखं मानभङ्गे दिने दिने ॥ १६-१५","iast":"varaṃ prāṇaparityāgo mānabhaṅgena jīvanāt .\nprāṇatyāge kṣaṇaṃ duḥkhaṃ mānabhaṅge dine dine .. 16-15","meaning":"Better to die than live in dishonor; death hurts once, but dishonor hurts every day.","source":"Chanakya Nīti 16-15"},{"slokaNo":"16-18","chapter":"16","verse":"18","variant":"","devanagari":"संसारविषवृक्षस्य द्वे फलेऽमृतोपमे ।\nसुभाषितं च सुस्वादु सङ्गतिः सजने जने ॥ १६-१८","iast":"saṃsāraviṣavṛkṣasya dve phale'mṛtopame .\nsubhāṣitaṃ ca susvādu saṅgatiḥ sajane jane .. 16-18","meaning":"There are two sweet fruits on life’s tree: hearing pleasant sacred words and keeping company with good people.","source":"Chanakya Nīti 16-18"},{"slokaNo":"16-19","chapter":"16","verse":"19","variant":"","devanagari":"जन्म जन्म यदभ्यस्तं दानमध्ययनं तपः ।\nतेनैवाभ्यासयोगेन देही चाभ्यस्यते पुनः ॥ १६-१९","iast":"janma janma yadabhyastaṃ dānamadhyayanaṃ tapaḥ .\ntenaivābhyāsayogena dehī cābhyasyate punaḥ .. 16-19","meaning":"Charity, learning, and austerity practiced in past lives continue into this life through prior merit.","source":"Chanakya Nīti 16-19"},{"slokaNo":"16-20","chapter":"16","verse":"20","variant":"","devanagari":"पुस्तकस्था तु या विद्या परहस्तगतं धनम् ।\nकार्यकाले समुत्पन्ने न सा विद्या न तद्धनम् ॥ १६-२०","iast":"pustakasthā tu yā vidyā parahastagataṃ dhanam .\nkāryakāle samutpanne na sā vidyā na taddhanam .. 16-20","meaning":"Knowledge kept only in books and wealth kept in others’ hands are useless when needed.","source":"Chanakya Nīti 16-20"},{"slokaNo":"17-01","chapter":"17","verse":"1","variant":"","devanagari":"पुस्तकप्रत्ययाधीतं नाधीतं गुरुसन्निधौ ।\nसभामध्ये न शोभन्ते जारगर्भा इव स्त्रियः ॥ १७-०१","iast":"pustakapratyayādhītaṃ nādhītaṃ gurusannidhau .\nsabhāmadhye na śobhante jāragarbhā iva striyaḥ .. 17-01","meaning":"A scholar without the guidance and blessing of a true teacher does not shine among the truly learned.","source":"Chanakya Nīti 17-01"},{"slokaNo":"17-02","chapter":"17","verse":"2","variant":"","devanagari":"कृते प्रतिकृतिं कुर्याद्धिंसने प्रतिहिंसनम् ।\nतत्र दोषो न पतति दुष्टे दुष्टं समाचरेत् ॥ १७-०२","iast":"kṛte pratikṛtiṃ kuryāddhiṃsane pratihiṃsanam .\ntatra doṣo na patati duṣṭe duṣṭaṃ samācaret .. 17-02","meaning":"Repay kindness with kindness, and answer the wicked in their own manner when necessary; this is not sinful.","source":"Chanakya Nīti 17-02"},{"slokaNo":"17-03","chapter":"17","verse":"3","variant":"","devanagari":"यदूरं यदुराध्यं यच्च दूरे व्यवस्थितम् ।\nतत्सर्वं तपसा साध्यं तपो हि दुरतिक्रमम् ॥ १७-०३","iast":"yadūraṃ yadurādhyaṃ yacca dūre vyavasthitam .\ntatsarvaṃ tapasā sādhyaṃ tapo hi duratikramam .. 17-03","meaning":"Distant, difficult, and seemingly impossible things can be attained through austerity; nothing surpasses disciplined effort.","source":"Chanakya Nīti 17-03"},{"slokaNo":"17-04","chapter":"17","verse":"4","variant":"","devanagari":"लोभश्चेद्गुणेन किं पिशुनता यद्यस्ति किं पातकैः\nसत्यं चेत्तपसा च किं शुचि मनो यद्यस्ति तीर्थेन किम् ।\nसौजन्यं यदि किं गुणैः सुमहिमा यद्यस्ति किं मण्डनैः\nसद्विद्या यदि किं धनैरपयशो यद्यस्ति किं मृत्युना ॥ १७-०४","iast":"lobhaścedguṇena kiṃ piśunatā yadyasti kiṃ pātakaiḥ\nsatyaṃ cettapasā ca kiṃ śuci mano yadyasti tīrthena kim .\nsaujanyaṃ yadi kiṃ guṇaiḥ sumahimā yadyasti kiṃ maṇḍanaiḥ\nsadvidyā yadi kiṃ dhanairapayaśo yadyasti kiṃ mṛtyunā .. 17-04","meaning":"Greed is the worst vice, slander a great sin; truth, purity, good character, fame, knowledge, and honor make many other supports unnecessary.","source":"Chanakya Nīti 17-04"},{"slokaNo":"17-05","chapter":"17","verse":"5","variant":"","devanagari":"पिता रत्नाकरो यस्य लक्ष्मीर्यस्य सहोदरा ।\nशङ्खो भिक्षाटनं कुर्यान्न दत्तमुपतिष्ठते ॥ १७-०५","iast":"pitā ratnākaro yasya lakṣmīryasya sahodarā .\nśaṅkho bhikṣāṭanaṃ kuryānna dattamupatiṣṭhate .. 17-05","meaning":"Though born from the ocean and related to Lakṣmī, the conch still begs door to door; without past giving, nothing is gained.","source":"Chanakya Nīti 17-05"},{"slokaNo":"17-06","chapter":"17","verse":"6","variant":"","devanagari":"अशक्तस्तु भवेत्साधुर्ब्रह्मचारी वा निर्धनः ।\nव्याधितो देवभक्तश्च वृद्धा नारी पतिव्रता ॥ १७-०६","iast":"aśaktastu bhavetsādhurbrahmacārī vā nirdhanaḥ .\nvyādhito devabhaktaśca vṛddhā nārī pativratā .. 17-06","meaning":"The weak become ascetics, the poor act celibate, the sick become devout, and old women become faithful—often by necessity.","source":"Chanakya Nīti 17-06"},{"slokaNo":"17-07","chapter":"17","verse":"7","variant":"","devanagari":"नान्नोदकसमं दानं न तिथिर्द्वादशी समा ।\nन गायत्र्याः परो मन्त्रो न मातुर्दैवतं परम् ॥ १७-०७","iast":"nānnodakasamaṃ dānaṃ na tithirdvādaśī samā .\nna gāyatryāḥ paro mantro na māturdaivataṃ param .. 17-07","meaning":"People often adopt virtue when compelled by weakness or circumstance rather than from true inner discipline.","source":"Chanakya Nīti 17-07"},{"slokaNo":"17-08","chapter":"17","verse":"8","variant":"","devanagari":"तक्षकस्य विषं दन्ते मक्षिकायास्तु मस्तके ।\nवृश्चिकस्य विषं पुच्छे सर्वाङ्गे दुर्जने विषम् ॥ १७-०८","iast":"takṣakasya viṣaṃ dante makṣikāyāstu mastake .\nvṛścikasya viṣaṃ pucche sarvāṅge durjane viṣam .. 17-08","meaning":"Poison lies in the snake’s fang, the fly’s mouth, and the scorpion’s sting, but the wicked are poisonous throughout.","source":"Chanakya Nīti 17-08"},{"slokaNo":"17-09","chapter":"17","verse":"9","variant":"","devanagari":"पत्युराज्ञां विना नारी ह्युपोषय व्रतचारिणी ।\nआयुष्यं हरते भर्तुः सा नारी नरकं व्रजेत् ॥ १७-०९","iast":"patyurājñāṃ vinā nārī hyupoṣaya vratacāriṇī .\nāyuṣyaṃ harate bhartuḥ sā nārī narakaṃ vrajet .. 17-09","meaning":"A wife who performs fasts and vows against her husband’s wishes harms his life and her own spiritual welfare, says the verse.","source":"Chanakya Nīti 17-09"},{"slokaNo":"17-10","chapter":"17","verse":"10","variant":"","devanagari":"न दानैः शुध्यते नारी नोपवासशतैरपि ।\nन तीर्थसेवया तद्वद्धर्तुः पदोदकैर्यथा ॥ १७-१०","iast":"na dānaiḥ śudhyate nārī nopavāsaśatairapi .\nna tīrthasevayā tadvaddhartuḥ padodakairyathā .. 17-10","meaning":"The verse says a wife gains holiness more by devoted service to her husband than by many vows or sacred waters.","source":"Chanakya Nīti 17-10"},{"slokaNo":"17-11","chapter":"17","verse":"11","variant":"","devanagari":"पादशेषं पीतशेषं सन्ध्याशेषं तथैव च ।\nश्वानमूत्रसमं तोयं पीत्वा चान्द्रायणं चरेत् ॥ १७-११","iast":"pādaśeṣaṃ pītaśeṣaṃ sandhyāśeṣaṃ tathaiva ca .\nśvānamūtrasamaṃ toyaṃ pītvā cāndrāyaṇaṃ caret .. 17-11","meaning":"External religious acts without proper devotion and duty do not bring true purity.","source":"Chanakya Nīti 17-11"},{"slokaNo":"17-12","chapter":"17"
